<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b5bf0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Estudos</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--txt:#1d2433;--mut:#6b7489;--line:#e6e9f2;--ac:#5b5bf0;--ok:#1fa971;--okbg:#e3f6ee;--warn:#f59e0b;--bad:#e5484d;--badbg:#fdecec;--soft:#eef0fb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding-bottom:90px}
header{padding:18px 16px 6px;display:flex;justify-content:space-between;align-items:center;max-width:760px;margin:0 auto}
header h1{font-size:22px;margin:0}
header .sair{background:none;border:0;color:var(--mut);font-size:14px;text-decoration:underline;cursor:pointer}
main{padding:0 14px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 -4px 16px #1d24330d}
nav button{background:none;border:0;color:var(--mut);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;border-radius:12px;cursor:pointer;flex:1;min-width:0}
nav button span{font-size:22px}
nav button.on{color:var(--ac);background:var(--soft)}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #1d24330a}
.card h2{font-size:17px;margin:0 0 10px}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.btn{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:13px 16px;font-size:16px;font-weight:700;cursor:pointer;width:100%}
.btn.sec{background:var(--soft);color:var(--ac)}
.btn.ok{background:var(--ok)}
.btn.min{width:auto;padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.45}
input,select,textarea{background:#fff;color:var(--txt);border:1.5px solid var(--line);border-radius:12px;padding:11px;font-size:16px;width:100%;font-family:inherit}
textarea{min-height:70px;resize:vertical}
.bar{height:10px;background:var(--soft);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:var(--ok);transition:width .3s}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--mut)}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.hoje{background:var(--ac);color:#fff}
.hello{font-size:15px;color:var(--mut);margin:0 0 4px}
.hero{background:linear-gradient(135deg,#5b5bf0,#8b5cf6);color:#fff}
.hero .mut{color:#e4e2ff}
.big{font-size:30px;font-weight:800;line-height:1.1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.mcard{background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 10px #1d24330a;cursor:pointer;border-top:6px solid var(--c);display:flex;flex-direction:column;gap:6px}
.mcard .em{font-size:28px}
.mcard b{font-size:15px}
.mhead{border-radius:18px;padding:18px;color:#fff;background:var(--c);margin:12px 0}
.mhead .em{font-size:34px}
.voltar{background:none;border:0;color:var(--ac);font-weight:700;font-size:15px;padding:8px 0;cursor:pointer}
.topico{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #1d24330a}
.topico .tt{font-weight:700;margin-bottom:10px}
.pills{display:flex;gap:8px}
.pill{flex:1;border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 6px;font-size:15px;font-weight:700;color:var(--mut);cursor:pointer}
.pill.on{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.dom{display:flex;gap:6px;margin-top:6px}
.dom button{flex:1;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 0;font-size:22px;cursor:pointer;filter:grayscale(1);opacity:.6}
.dom button.on{filter:none;opacity:1;border-color:var(--ac);background:var(--soft)}
.lbl{font-size:13px;color:var(--mut);margin-top:12px}
details summary{cursor:pointer;color:var(--ac);font-weight:600;font-size:14px;margin-top:10px}
.alt{display:block;width:100%;text-align:left;background:#fff;color:var(--txt);border:2px solid var(--line);border-radius:14px;padding:13px;margin:8px 0;font-size:15px;cursor:pointer}
.alt.certa{border-color:var(--ok);background:var(--okbg)}
.alt.errada{border-color:var(--bad);background:var(--badbg)}
.alt.sel{border-color:var(--ac);background:var(--soft)}
.trilha{display:flex;gap:6px;margin:10px 0}
.trilha div{flex:1;text-align:center;padding:10px 4px;border-radius:14px;background:#ffffff26;font-size:13px;font-weight:700}
.trilha div.on{background:#fff;color:var(--ac)}
.trilha div span{display:block;font-size:22px}
.falta{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid #ffffff33;cursor:pointer}
.ck{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;border-top:1px solid var(--line)}
.ck:first-of-type{border-top:0}
.ck input{width:22px;height:22px;accent-color:var(--ok);flex:none}
.dia{margin:12px 0;padding-left:12px;border-left:4px solid var(--line)}
.dia.hoje{border-color:var(--ac)}
.dia.passado{opacity:.5}
.modal{position:fixed;inset:0;background:#1d243380;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .card{width:100%;max-width:420px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 18px;border-radius:12px;z-index:20;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.nivel{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.nivel b.ic{font-size:26px}
.enun{white-space:pre-line;font-size:16px;font-weight:600;margin:8px 0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-h{text-align:center;font-size:12px;font-weight:700;color:var(--mut);padding-bottom:4px}
.cal-d{min-width:0;min-height:78px;border:1.5px solid var(--line);border-radius:10px;padding:3px;cursor:pointer;display:flex;flex-direction:column;gap:3px;background:#fff}
.cal-d .n{font-size:13px;font-weight:700}
.cal-d.hoje .n{background:var(--ac);color:#fff;border-radius:20px;padding:0 6px;align-self:flex-start}
.cal-d.sel{border-color:var(--ac);background:var(--soft)}
.cal-d.passado{opacity:.55}
.chip{display:inline-block;max-width:100%;font-size:10px;font-weight:700;border-radius:8px;padding:1px 3px;background:var(--soft);color:var(--mut);white-space:nowrap;overflow:hidden}
.chip.prova{background:#fde2e2;color:#c0262c}
.chip.gta{background:#ede4ff;color:#6d4aff}
.chip.fer{background:#fff3d6;color:#a16207}
.chip.ok{background:var(--okbg);color:var(--ok)}
@media(min-width:620px){.cal-d{min-height:96px}.chip{font-size:12px}}
#login{max-width:380px;margin:12vh auto;padding:24px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr 1fr}}
.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.warn{background:#fff3d6;color:#a16207}
.alunos,.subabas{display:flex;gap:6px;max-width:760px;margin:4px auto 0;padding:0 14px;overflow-x:auto}
.alunos button,.subabas button{border:2px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-weight:700;color:var(--mut);cursor:pointer;white-space:nowrap;font-size:14px}
.alunos button.on,.subabas button.on{border-color:var(--ac);background:var(--soft);color:var(--ac)}
.subabas{padding:0;margin:12px 0}
.saldos{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:620px){.saldos{grid-template-columns:1fr 1fr 1fr}}
.saldo .big{font-size:26px}
.ckin{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;margin-right:10px}
.ckin input{width:18px;height:18px;padding:0}
.campo{display:flex;flex-direction:column;gap:2px;flex:1;min-width:130px;margin-top:6px}
.inativo{opacity:.55}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://ykwcicxnqdvopkykwxzc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_aPmFxy7JzuJCRWdWurQPsw_fzW58nNX';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// Matérias, tópicos, cronograma, tarefas, prêmios e regras de recompensa vêm do banco (aba Cadastros).

// ---------------- ESTADO ----------------
const S = { user:null, perfil:null, aba:'hoje', alunos:[], aluno:null, mats:[], todasMats:[], todosTopicos:[], crono:[],
  grupos:{}, saldos:{}, lanc:[], prog:{}, tent:[], lib:{}, notas:{}, tarefasCad:[], premios:[], tarefas:{}, rev:[], pend:[], recAb:[],
  pausas:[], quiz:null, prova:null, materia:null, cad:'tarefas', diaTarefa:null };
const $app = document.getElementById('app');
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hojeISO = () => new Date().toLocaleDateString('sv-SE', { timeZone:'America/Sao_Paulo' });
const addDias = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toLocaleDateString('sv-SE'); };
const segunda = iso => addDias(iso, -((new Date(iso + 'T12:00:00').getDay() + 6) % 7));
const fmtData = iso => new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'2-digit' });
const ehResp = () => S.perfil?.papel === 'responsavel';
const chT = (m, i) => `${m}:${i}`;
const MAT = id => S.mats.find(m => m.id === id);
const nomeAluno = id => S.alunos.find(a => a.user_id === id)?.nome || '—';
const val = id => document.getElementById(id)?.value ?? '';
const num = id => { const v = val(id); return v === '' ? null : Number(v); };
const GRUPO = { notas:['💰','Notas das provas'], estudos:['🎮','Estudos no app'], casa:['🧹','Tarefas de casa'] };
const MOEDA = { reais:'R$', minutos:'minutos de tela', pontos:'pontos' };
function fmtV(moeda, v){
  v = Number(v) || 0;
  if (moeda === 'reais') return 'R$ ' + v.toLocaleString('pt-BR', { maximumFractionDigits:2 });
  if (moeda === 'minutos'){ const s = v < 0 ? '-' : ''; v = Math.abs(Math.round(v)); const hh = Math.floor(v/60), mm = v%60;
    return s + (hh ? hh + 'h' + (mm ? String(mm).padStart(2,'0') : '') : mm + 'min'); }
  return v.toLocaleString('pt-BR') + ' pts';
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.append(t); setTimeout(()=>t.remove(),3000); }
const erro = e => { if (e){ toast((e.message || String(e)).replace(/^.*?: /, '')); return true; } return false; };

// ---------------- DADOS ----------------
async function carregar(){
  const a = S.aluno;
  const [mt, tp, cr, p, t, l, n, g, lc, tf, pr, pz] = await Promise.all([
    sb.from('materias').select('*').eq('aluno', a).order('ordem').order('nome'),
    sb.from('topicos').select('*').eq('aluno', a).order('idx'),
    sb.from('cronograma').select('*').eq('aluno', a).order('dia'),
    sb.from('progresso').select('*').eq('aluno', a),
    sb.from('tentativas').select('id,materia,tipo,acertos,total,pct,criado,detalhes').eq('aluno', a).order('criado', { ascending:false }),
    sb.from('liberacoes').select('*').eq('aluno', a),
    sb.from('notas_p2').select('*').eq('aluno', a),
    sb.from('grupos').select('*').eq('aluno', a),
    sb.from('lancamentos').select('*').eq('aluno', a).order('data_ref', { ascending:false }).order('id', { ascending:false }).limit(300),
    sb.from('tarefas').select('*').order('ordem').order('id'),
    sb.from('premios').select('*').order('custo'),
    sb.from('pausas').select('*').order('inicio', { ascending:false }),
  ]);
  S.todosTopicos = tp.data || [];
  S.todasMats = (mt.data || []).map(m => ({ ...m, topicos:S.todosTopicos.filter(x => x.materia === m.id && x.ativo) }));
  S.mats = S.todasMats.filter(m => m.ativa);
  S.crono = (cr.data || []).map(c => ({ d:c.dia, t:c.titulo, itens:c.itens || [] }));
  S.prog = Object.fromEntries((p.data || []).map(r => [r.chave, r]));
  S.tent = t.data || [];
  S.lib = Object.fromEntries((l.data || []).map(r => [r.materia, r]));
  S.notas = Object.fromEntries((n.data || []).map(r => [r.materia, r.nota]));
  S.grupos = Object.fromEntries((g.data || []).map(x => [x.grupo, x]));
  S.lanc = lc.data || [];
  S.tarefasCad = tf.data || [];
  S.premios = pr.data || [];
  S.pausas = pz.data || [];
  await Promise.all([carregarSaldos(), carregarTarefas(), contarQuestoes()]);
}
async function carregarSaldos(){
  const r = await Promise.all(['notas','estudos','casa'].map(g => sb.rpc('saldo', { p_aluno:S.aluno, p_grupo:g })));
  S.saldos = { notas:r[0].data ?? 0, estudos:r[1].data ?? 0, casa:r[2].data ?? 0 };
}
async function carregarTarefas(){
  const hoje = hojeISO();
  const dias = ehResp() ? [S.diaTarefa || hoje] : [hoje, addDias(hoje, -1)];
  const res = await Promise.all(dias.map(d => sb.rpc('tarefas_do_dia', { p_aluno:S.aluno, p_dia:d })));
  S.tarefas = Object.fromEntries(dias.map((d, i) => [d, res[i].data || []]));
  const rev = S.tarefasCad.filter(t => t.ativa && t.modo === 'revezamento');
  const r2 = await Promise.all(rev.flatMap(t => [hoje, addDias(hoje, 1)].map(d => sb.rpc('responsaveis', { p_tarefa:t.id, d }))));
  S.rev = rev.map((t, i) => ({ t, hoje:r2[2*i].data?.[0], amanha:r2[2*i+1].data?.[0] }));
  if (ehResp()){
    const [pd, rc] = await Promise.all([
      sb.from('tarefa_dia').select('*').eq('status','feito').is('decisao', null).order('dia'),
      sb.from('recursos').select('*').is('decisao_final', null).order('criado'),
    ]);
    S.pend = pd.data || []; S.recAb = rc.data || [];
  }
}

async function salvar(chave, campos){
  const atual = S.prog[chave] || { chave };
  const novo = { ...atual, ...campos, chave, aluno:S.aluno, atualizado:new Date().toISOString() };
  if ('estudou' in campos || 'exercicios' in campos){
    const ok = novo.estudou && novo.exercicios;
    novo.concluido_em = ok ? (atual.concluido_em || new Date().toISOString()) : null;
  }
  S.prog[chave] = novo;
  const { error } = await sb.from('progresso').upsert(novo, { onConflict:'aluno,chave' });
  if (error) toast('Erro ao salvar: ' + error.message);
}

// ---------------- CÁLCULOS ----------------
function progMat(mid){
  const m = MAT(mid); let ok = 0;
  m.topicos.forEach(t => { const p = S.prog[chT(mid, t.idx)]; if (p?.estudou && p?.exercicios) ok++; });
  return { ok, total:m.topicos.length };
}
function melhor(mid, tipo, ateData){
  return S.tent.filter(t => t.materia===mid && t.tipo===tipo && (!ateData || new Date(t.criado) <= ateData) && (tipo!=='treino' || t.total>=5))
    .reduce((mx, t) => Math.max(mx, Number(t.pct)), -1);
}
// Meta de estudos (bronze/prata/ouro) — regras em grupos.estudos.config
function calcMeta(){
  const c = S.grupos.estudos?.config || {};
  const mats = (c.materias || []).filter(id => MAT(id));
  if (!c.prazo || !mats.length) return null;
  const prazo = new Date(c.prazo);
  const bronzeDet = mats.map(mid => ({ mid, ok:MAT(mid).topicos.every(t => { const p = S.prog[chT(mid, t.idx)]; return p?.concluido_em && new Date(p.concluido_em) <= prazo; }) }));
  const bronze = bronzeDet.every(x => x.ok);
  const prataDet = mats.map(mid => ({ mid, v:melhor(mid, 'treino', prazo) }));
  const prata = bronze && prataDet.every(x => x.v >= c.treino_min);
  const qtd = Math.min(Number(c.prova_qtd) || mats.length, mats.length);
  const ouroDet = mats.map(mid => ({ mid, v:melhor(mid, 'prova', prazo) }));
  const ouro = prata && ouroDet.filter(x => x.v >= c.prova_min).length >= qtd;
  const M = c.minutos || {};
  const nivel = ouro ? 'ouro' : prata ? 'prata' : bronze ? 'bronze' : null;
  return { c, prazo, mats, qtd, M, bronze, prata, ouro, bronzeDet, prataDet, ouroDet, nivel, valor:nivel ? Number(M[nivel]) || 0 : 0 };
}
function calcDinheiro(){
  const c = S.grupos.notas?.config || {};
  const linhas = S.mats.map(m => { const n = S.notas[m.id]; return { mid:m.id, n, v:(n != null && n >= c.nota_min) ? Number(c.por_materia) || 0 : 0 }; });
  const todas = linhas.length && linhas.every(l => l.n != null);
  const bonus = todas && linhas.every(l => l.n >= c.bonus_min) ? Number(c.bonus) || 0 : 0;
  const bruto = linhas.reduce((s, l) => s + l.v, 0) + bonus;
  return { c, linhas, bonus, todas, total:c.maximo ? Math.min(bruto, c.maximo) : bruto };
}
// quanto já foi ganho na janela atual (para mostrar o teto)
function ganhoJanela(grupo){
  const g = S.grupos[grupo]; if (!g) return 0;
  const ini = g.expira === 'semanal' ? segunda(hojeISO()) : '0000';
  return S.lanc.filter(l => l.grupo === grupo && l.moeda === g.moeda && l.data_ref >= ini && (l.valor > 0 || l.origem === 'estorno'))
    .reduce((s, l) => s + Number(l.valor), 0);
}

// ---------------- TELAS ----------------
const DOM = [['😵','Não sei nada'],['😕','Sei pouco'],['😐','Mais ou menos'],['🙂','Sei bem'],['😎','Explico pra alguém']];

function render(){
  if (!S.user) return telaLogin();
  const abas = [['hoje','🏠','Hoje'],['agenda','📅','Agenda'],['materias','📚','Matérias'],['tarefas','🧹','Tarefas'],['premios','🎁','Prêmios']];
  if (ehResp()) abas.push(['painel','🛡️','Painel'], ['cad','⚙️','Cadastros']);
  let corpo = '';
  if (S.prova) corpo = telaProva();
  else if (S.quiz) corpo = telaQuiz();
  else if (S.aba === 'materias' && S.materia && MAT(S.materia)) corpo = telaMateria(S.materia);
  else if (S.aba === 'painel' && S.verQ) corpo = telaVerQuestoes();
  else if (S.aba === 'painel' && S.anMat) corpo = telaAnalise();
  else corpo = ({ hoje:telaHoje, agenda:telaAgenda, materias:telaMaterias, tarefas:telaTarefas, premios:telaPremios, painel:telaPainel, cad:telaCad })[S.aba]();
  const foco = S.quiz || S.prova;
  const seletor = ehResp() && !foco ? `<div class="alunos">${S.alunos.map(a => `<button data-a="verAluno" data-v="${a.user_id}" class="${a.user_id===S.aluno?'on':''}">${h(a.nome)}</button>`).join('')}</div>` : '';
  $app.innerHTML = `
    <header><h1>📘 Estudos</h1>${foco ? '' : '<button class="sair" data-a="sair">sair</button>'}</header>
    ${seletor}
    <main>${corpo}</main>
    ${foco ? '' : `<nav>${abas.map(([id,ic,nm]) => `<button data-a="aba" data-v="${id}" class="${S.aba===id?'on':''}"><span>${ic}</span>${nm}</button>`).join('')}</nav>`}`;
}

function telaLogin(){
  $app.innerHTML = `<div id="login" class="card">
    <div class="big">📘</div><h2>Estudos</h2><p class="mut">Entre com seu e-mail e senha.</p>
    <input id="lemail" type="email" placeholder="e-mail" autocomplete="username"><br><br>
    <input id="lsenha" type="password" placeholder="senha" autocomplete="current-password"><br><br>
    <button class="btn" data-a="entrar">Entrar</button></div>`;
}

function proximaProva(){
  const hoje = hojeISO();
  const futuras = S.mats.filter(m => m.prova && m.prova >= hoje).sort((a,b) => a.prova.localeCompare(b.prova));
  if (!futuras.length) return null;
  const d = futuras[0].prova;
  const dias = Math.round((new Date(d+'T12:00:00') - new Date(hoje+'T12:00:00')) / 864e5);
  return { d, dias, mats:futuras.filter(m => m.prova===d) };
}

function blocoDia(dia){
  const hoje = hojeISO();
  const cls = dia.d===hoje ? 'hoje' : dia.d < hoje ? 'passado' : '';
  return `<div class="dia ${cls}"><div class="row sp"><b>${h(dia.t)}</b><span class="tag ${dia.d===hoje?'hoje':''}">${dia.d===hoje?'HOJE':fmtData(dia.d)}</span></div>
    ${dia.itens.map((it, i) => { const k=`crono:${dia.d}:${i}`; return `<label class="ck"><input type="checkbox" data-a="crono" data-k="${k}" ${S.prog[k]?.feito?'checked':''}> ${h(it)}</label>`; }).join('')}</div>`;
}

function oQueFalta(g){
  const itens = [];
  if (!g.bronze) g.bronzeDet.forEach(x => { if (!x.ok){ const p = progMat(x.mid); itens.push([x.mid, `Marcar estudo + exercícios: ${p.ok}/${p.total} tópicos`]); } });
  else if (!g.prata) g.prataDet.forEach(x => { if (x.v < g.c.treino_min) itens.push([x.mid, `Treino com ${g.c.treino_min}%+ (melhor: ${x.v>=0?x.v+'%':'nenhum'})`]); });
  else if (!g.ouro) g.ouroDet.forEach(x => { if (x.v < g.c.prova_min) itens.push([x.mid, `Prova valendo com ${g.c.prova_min}%+ (precisa em ${g.qtd} de ${g.mats.length})`]); });
  return itens;
}

function trilha(g){
  const mo = S.grupos.estudos.moeda;
  return `<div class="trilha">${[['bronze','🥉'],['prata','🥈'],['ouro','🥇']].map(([n, ic]) => `<div class="${g[n]?'on':''}"><span>${ic}</span>${fmtV(mo, g.M[n])}</div>`).join('')}</div>`;
}

function telaHoje(){
  const hoje = hojeISO(); const pp = proximaProva(); const g = calcMeta();
  const diaHoje = S.crono.find(d => d.d===hoje) || S.crono.find(d => d.d > hoje);
  let meta = '';
  const falta = g ? g.prazo - new Date() : 0;
  if (g && falta > 0){
    const hh = Math.floor(falta/36e5), mm = Math.floor(falta%36e5/6e4);
    meta = `<div class="card hero"><div class="row sp"><h2 style="margin:0">🎮 Missão da semana</h2><span class="mut">faltam ${hh}h${String(mm).padStart(2,'0')}</span></div>
      ${trilha(g)}

      ${oQueFalta(g).map(([mid, t]) => `<div class="falta" data-a="mat" data-v="${mid}"><span>${MAT(mid).emoji} <b>${h(MAT(mid).nome)}</b><br><small>${h(t)}</small></span><span>›</span></div>`).join('')}</div>`;
  }
  const tHoje = S.tarefas[hoje] || [];
  const aFazer = tHoje.filter(t => t.status === 'a_fazer').length;
  const casa = tHoje.length ? `<div class="card"><div class="row sp"><h2 style="margin:0">🧹 Tarefas de casa</h2><button class="btn sec min" data-a="aba" data-v="tarefas">abrir ›</button></div>
    <p class="mut" style="margin:6px 0 0">${aFazer ? `${aFazer} para marcar hoje` : 'Tudo marcado hoje ✓'}${S.rev.length ? ' · ' + S.rev.map(r => `${r.t.emoji} hoje: <b>${h(nomeAluno(r.hoje))}</b>`).join(' · ') : ''}</p></div>` : '';
  const quem = ehResp() ? `Vendo: ${h(nomeAluno(S.aluno))}` : `E aí, ${h(S.perfil?.nome || '')}! 👋`;
  return `<p class="hello">${quem}</p>
    ${pp ? `<div class="card"><div class="row sp"><div><div class="mut">Próxima prova</div><div class="big">${pp.dias===0?'HOJE':pp.dias===1?'Amanhã':'em '+pp.dias+' dias'}</div></div><span class="tag">${fmtData(pp.d)}</span></div>
      <div class="row" style="margin-top:10px">${pp.mats.map(m => `<button class="btn sec min" data-a="mat" data-v="${m.id}">${m.emoji} ${h(m.nome)}</button>`).join('')}</div></div>` : ''}
    ${meta}${casa}
    ${S.crono.length ? `<div class="card"><h2>📅 ${diaHoje?.d===hoje ? 'O que fazer hoje' : 'Próximo dia do plano'}</h2>${diaHoje ? blocoDia(diaHoje) : '<p class="mut">Cronograma encerrado 🎉</p>'}
      <details><summary>Ver cronograma completo</summary>${S.crono.map(blocoDia).join('')}</details></div>` : ''}
    ${!S.mats.length ? '<div class="card"><p class="mut">Ainda não há matérias cadastradas. O pai ou a mãe cadastram na aba ⚙️ Cadastros.</p></div>' : ''}`;
}

function telaAgenda(){
  const hoje = hojeISO(); const sel = S.diaSel || hoje;
  const primeiro = [hoje, S.crono[0]?.d].filter(Boolean).sort()[0];
  const ini = addDias(primeiro, -new Date(primeiro + 'T12:00:00').getDay());
  const dias = Array.from({ length:21 }, (_, i) => addDias(ini, i));
  const prazo = calcMeta()?.prazo; const diaPrazo = prazo ? prazo.toLocaleDateString('sv-SE', { timeZone:'America/Sao_Paulo' }) : null;
  const cel = d => {
    const provas = S.mats.filter(m => m.prova === d);
    const cr = S.crono.find(c => c.d === d);
    const feitos = cr ? cr.itens.filter((_, i) => S.prog[`crono:${d}:${i}`]?.feito).length : 0;
    const n = Number(d.slice(8));
    let chips = '';
    if (provas.length) chips += `<div class="chip prova">✏️ ${provas.map(m => m.emoji).join('')}</div>`;
    if (d === diaPrazo) chips += `<div class="chip gta">🎮 meta</div>`;
    if (S.pausas.some(p => d >= p.inicio && d <= p.fim)) chips += `<div class="chip fer">pausa</div>`;
    if (cr) chips += `<div class="chip ${feitos===cr.itens.length?'ok':''}">${feitos===cr.itens.length?'✓':''} ${feitos}/${cr.itens.length}</div>`;
    return `<div class="cal-d ${d===hoje?'hoje':''} ${d===sel?'sel':''} ${d<hoje?'passado':''}" data-a="dia" data-v="${d}"><span class="n">${n===1?'1/'+d.slice(5,7):n}</span>${chips}</div>`;
  };
  const cr = S.crono.find(c => c.d === sel); const provas = S.mats.filter(m => m.prova === sel);
  return `<div class="card" style="padding:10px"><div class="row sp" style="padding:4px 6px 10px"><b>Próximas 3 semanas</b><span class="mut">toque num dia</span></div>
    <div class="cal">${['D','S','T','Q','Q','S','S'].map(x => `<div class="cal-h">${x}</div>`).join('')}${dias.map(cel).join('')}</div>
    <div class="row" style="padding:10px 4px 2px;gap:12px;font-size:12px"><span><span class="chip prova">✏️</span> prova</span><span><span class="chip">0/3</span> metas do dia</span><span><span class="chip gta">🎮</span> prazo da meta</span></div></div>
    <div class="card"><h2>${fmtData(sel)}${sel===hoje?' · hoje':''}</h2>
      ${provas.length ? `<div class="row" style="margin-bottom:8px">${provas.map(m => `<button class="btn sec min" data-a="mat" data-v="${m.id}">✏️ Prova: ${m.emoji} ${h(m.nome)}</button>`).join('')}</div>` : ''}
      ${cr ? blocoDia(cr) : '<p class="mut">Sem metas neste dia.</p>'}</div>`;
}

function telaMaterias(){
  const hoje = hojeISO();
  const lista = [...S.mats].sort((a,b) => (a.prova||'9').localeCompare(b.prova||'9'));
  if (!lista.length) return '<div class="card"><p class="mut">Nenhuma matéria cadastrada ainda.</p></div>';
  return `<p class="hello">Toque numa matéria pra estudar, treinar ou fazer a prova.</p><div class="grid">${lista.map(m => {
    const p = progMat(m.id); const tr = melhor(m.id,'treino'); const pv = melhor(m.id,'prova');

      <div class="row sp"><span class="em">${m.emoji}</span>${m.prova ? `<span class="tag ${m.prova===hoje?'hoje':''}">${m.prova<hoje?'✔ foi':fmtData(m.prova)}</span>` : ''}</div>
      <b>${h(m.nome)}</b>

      <div class="mut" style="font-size:12px">${p.ok}/${p.total} tópicos ${tr>=0?'· 🎯 '+tr+'%':''} ${pv>=0?'· 🏛️ '+pv+'%':''}</div></div>`;
  }).join('')}</div>`;
}

function telaMateria(mid){
  const m = MAT(mid); const p = progMat(mid);
  const topicos = m.topicos.map((t, n) => {
    const k = chT(mid, t.idx); const r = S.prog[k] || {};
    return `<div class="topico"><div class="tt">${n+1}. ${h(t.nome)}</div>
      <div class="pills"><button class="pill ${r.estudou?'on':''}" data-a="tg" data-k="${k}" data-f="estudou">📖 ${r.estudou?'Estudei ✓':'Estudei'}</button>
      <button class="pill ${r.exercicios?'on':''}" data-a="tg" data-k="${k}" data-f="exercicios">✏️ ${r.exercicios?'Fiz exercícios ✓':'Fiz exercícios'}</button></div>
      <div class="lbl">Quanto eu domino? ${r.dominio ? '· <b>'+DOM[r.dominio-1][1]+'</b>' : ''}</div>
      <div class="dom">${DOM.map(([e], n) => `<button data-a="dom" data-k="${k}" data-v="${n+1}" class="${r.dominio===n+1?'on':''}" title="${DOM[n][1]}">${e}</button>`).join('')}</div>
      <details ${r.duvida?'open':''}><summary>❓ Tenho uma dúvida</summary><textarea data-a="duv" data-k="${k}" placeholder="Escreva o que não entendeu">${h(r.duvida)}</textarea></details></div>`;
  }).join('');
  let extra = '';

    const r = S.prog['redacao:texto'] || {};
    extra = `<div class="topico"><div class="tt">✍️ Minha redação</div><p class="mut">Cole aqui seu texto para o pai mandar corrigir.</p><textarea data-a="duv" data-k="redacao:texto" style="min-height:200px">${h(r.duvida)}</textarea></div>`;
  }
  let acoes = '';
  if (mid !== 'redacao'){

      : `<button class="btn sec" data-a="liberar" data-v="${mid}">🔐 Liberar prova (pai/mãe)</button>`;
    acoes = `<div class="card"><h2>🎯 Treino livre</h2><p class="mut">10 questões sorteadas com gabarito comentado. Refaça quantas vezes quiser. ${tr>=0?'Melhor: <b>'+tr+'%</b>':''}</p>

    <div class="mhead" style="--c:${h(m.cor)}"><div class="row sp"><span class="em">${m.emoji}</span>${m.prova ? `<span class="tag" style="background:#ffffff33;color:#fff">Prova ${fmtData(m.prova)}</span>` : ''}</div>

    ${topicos}${extra}${acoes}`;
}

function telaQuiz(){
  const q = S.quiz; const it = q.lista[q.i];
  if (!it){
    const pct = Math.round(100*q.acertos/q.lista.length);
    return `<div class="card" style="text-align:center"><div class="big">${pct>=70?'🔥':'💪'}</div><h2>${q.acertos} de ${q.lista.length} · ${pct}%</h2>
      <p class="mut">${ehResp() ? 'Teste do responsável: não fica registrado.' : pct>=70 ? 'Mandou bem! Isso conta pra meta.' : 'Revisa os tópicos e tenta de novo.'}</p>
      <button class="btn" data-a="fecharQuiz">Voltar pra matéria</button></div>`;
  }
  return `<div class="card"><div class="row sp"><span class="tag">${MAT(q.materia).emoji} ${h(MAT(q.materia).nome)}</span><span class="tag">${q.i+1} de ${q.lista.length}</span></div>
    <div class="bar" style="margin:12px 0"><i style="width:${100*q.i/q.lista.length}%;background:var(--ac)"></i></div>
    ${it.topico ? `<div class="mut">${h(it.topico)}</div>` : ''}
    <p class="enun">${h(it.enunciado)}</p>
    ${it.alternativas.map((a, i) => {
      let c = ''; if (q.resp != null){ if (i===it.correta) c='certa'; else if (i===q.resp) c='errada'; }

    }).join('')}
    ${q.resp != null ? `<p><b>${q.resp===it.correta?'✅ Acertou!':'❌ Errou.'}</b> ${h(it.explicacao||'')}</p><button class="btn" data-a="proxima" ${q.salvando?'disabled':''}>${q.i+1===q.lista.length?'Ver resultado':'Próxima →'}</button>` : ''}

}

function telaProva(){
  const p = S.prova;

// ---------- Tarefas da casa ----------
function itemTarefa(t, dia){
  const k = `data-t="${t.tarefa}" data-d="${dia}"`;
  const mo = S.grupos.casa?.moeda || 'pontos';
  let st = '', bts = '';
  if (t.decisao === 'validado') st = `<span class="tag ok">✅ validado · +${fmtV(mo, t.valor)}</span>`;
  else if (t.decisao === 'rejeitado') st = `<span class="tag bad">🚫 não validado</span>`;
  else if (t.status === 'feito') st = `<span class="tag warn">⏳ esperando pai/mãe</span>`;
  else if (t.status === 'nao_feito') st = `<span class="tag bad">❌ não feito</span>`;
  else st = `<span class="tag">vale ${fmtV(mo, t.pontos)}</span>`;
  if (t.pode_marcar){
    if (t.status === 'a_fazer') bts = `<button class="btn ok min" data-a="tMarcar" data-s="feito" ${k}>✅ Fiz</button><button class="btn sec min" data-a="tMarcar" data-s="nao_feito" ${k}>Não fiz</button>`;
    else bts = `<button class="btn sec min" data-a="tMarcar" data-s="" ${k}>desfazer</button>`;
  }
  if (ehResp() && t.status === 'feito' && !t.decisao)
    bts += `<button class="btn ok min" data-a="tDecidir" data-s="validado" ${k} data-al="${S.aluno}">Validar</button><button class="btn sec min" data-a="tDecidir" data-s="rejeitado" ${k} data-al="${S.aluno}">Rejeitar</button>`;
  let rec = '';
  if (t.recurso_id) rec = `<div class="mut" style="margin-top:6px">📣 Recurso: “${h(t.recurso_comentario)}” → ${t.recurso_decisao ? `<b>${t.recurso_decisao==='validado'?'aceito':'negado'}</b>${t.recurso_resposta?' · '+h(t.recurso_resposta):''}` : 'aguardando pai/mãe'}</div>`;
  else if (t.pode_recorrer) rec = `<details><summary>Não concordo (recurso, até 5 dias)</summary><textarea id="rc-${t.tarefa}-${dia}" placeholder="Explique o que aconteceu"></textarea><br><button class="btn sec min" data-a="tRecurso" ${k}>Enviar recurso</button></details>`;
  return `<div class="nivel" style="flex-wrap:wrap"><b class="ic">${t.emoji}</b><div style="flex:1;min-width:160px"><b>${h(t.nome)}</b><div>${st}</div></div><div class="row">${bts}</div>${rec ? `<div style="flex-basis:100%">${rec}</div>` : ''}</div>`;
}
function telaTarefas(){

  const rev = S.rev.length ? `<div class="card"><h2>🔁 Revezamento</h2>${S.rev.map(r => `<div class="row sp" style="padding:6px 0"><span>${r.t.emoji} ${h(r.t.nome)}</span><span class="mut">hoje: <b>${h(nomeAluno(r.hoje))}</b> · amanhã: <b>${h(nomeAluno(r.amanha))}</b></span></div>`).join('')}</div>` : '';

  const mo = S.grupos.casa?.moeda || 'pontos';

// ---------- Análise de desempenho (pais) ----------
async function abrirAnalise(mid){
  S.anMat = mid; S.banco = null; render(); window.scrollTo(0,0);
  const { data: qs } = await sb.from('questoes').select('id,topico,tipo,enunciado,alternativas').eq('aluno', S.aluno).eq('materia', mid);
  const { data: gb } = await sb.from('gabarito').select('*').in('questao_id', (qs||[]).map(q => q.id));
  const G = Object.fromEntries((gb||[]).map(g => [g.questao_id, g]));
  S.banco = Object.fromEntries((qs||[]).map(q => [q.id, { ...q, correta:G[q.id]?.correta, explicacao:G[q.id]?.explicacao }]));
  render();
}
// detalhes da prova trazem o texto; os do treino, só {id, r, c}
const normDet = d => (d || []).map(x => ({ id:x.id, r:x.r ?? x.resposta ?? null, c:x.c ?? x.correta }));
function telaAnalise(){
  const mid = S.anMat; const m = MAT(mid); const B = S.banco;
  const T = S.tent.filter(t => t.materia === mid).sort((a, b) => a.criado.localeCompare(b.criado));
  const voltar = `<button class="voltar" data-a="fecharAnalise">‹ Painel</button>
    <select data-a="anMat" style="margin-bottom:8px">${S.mats.map(x => `<option value="${x.id}" ${x.id===mid?'selected':''}>${x.emoji} ${h(x.nome)}</option>`).join('')}</select>`;
  if (!B) return voltar + '<p class="mut">Carregando…</p>';
  // clique duplo: mesma matéria/resultado gravada com menos de 3 s de diferença
  const dup = new Set(); T.forEach((t, i) => { const a = T[i-1]; if (a && a.tipo === t.tipo && a.acertos === t.acertos && a.total === t.total && new Date(t.criado) - new Date(a.criado) < 3000) dup.add(t.id); });
  const validas = T.filter(t => !dup.has(t.id));
  const tr = validas.filter(t => t.tipo === 'treino'), pv = validas.filter(t => t.tipo === 'prova');
  const media = L => L.length ? Math.round(L.reduce((s, t) => s + Number(t.pct), 0) / L.length) + '%' : '—';
  // estatística por questão
  const Q = {};
  validas.forEach(t => normDet(t.detalhes).forEach(d => { const q = Q[d.id] ||= { vezes:0, acertos:0, tipo:t.tipo }; q.vezes++; if (d.r === d.c) q.acertos++; }));
  const ids = Object.keys(Q); const comDet = validas.filter(t => t.detalhes?.length).length;
  const bancoTreino = Object.values(B).filter(q => q.tipo === 'treino').length;
  const vistasTreino = ids.filter(id => B[id]?.tipo === 'treino').length;
  const repetidas = ids.filter(id => Q[id].vezes > 1);
  const respostas = ids.reduce((s, id) => s + Q[id].vezes, 0);
  const erradas = ids.filter(id => Q[id].acertos < Q[id].vezes).sort((a, b) => (Q[b].vezes - Q[b].acertos) - (Q[a].vezes - Q[a].acertos) || Q[a].acertos/Q[a].vezes - Q[b].acertos/Q[b].vezes);
  const sempreErra = erradas.filter(id => Q[id].acertos === 0 && Q[id].vezes > 1);
  const errouDepoisAcertou = ids.filter(id => Q[id].vezes > 1 && Q[id].acertos > 0 && Q[id].acertos < Q[id].vezes);
  // por tópico
  const top = {}; ids.forEach(id => { const k = B[id]?.topico || 'sem tópico'; const x = top[k] ||= { v:0, a:0 }; x.v += Q[id].vezes; x.a += Q[id].acertos; });
  const linhaQ = id => { const q = B[id]; const x = Q[id];
    return `<div class="nivel"><div style="flex:1"><b>${q ? h(q.enunciado.slice(0, 110)) + (q.enunciado.length > 110 ? '…' : '') : h(id) + ' (apagada)'}</b><div class="mut">${h(q?.topico || '')} · ${x.tipo === 'prova' ? 'prova' : 'treino'}</div></div>
      <span class="tag ${x.acertos === x.vezes ? 'ok' : x.acertos === 0 ? 'bad' : 'warn'}">${x.acertos}/${x.vezes}</span></div>`; };
  const detTent = t => { const D = normDet(t.detalhes);
    if (!D.length) return '<p class="mut">Sem detalhe por questão (teste feito antes desta versão).</p>';
    return D.map((d, n) => { const q = B[d.id]; const ok = d.r === d.c;
      return `<div class="topico"><b>${ok ? '✅' : '❌'} ${n+1}. ${q ? h(q.enunciado) : h(d.id) + ' (questão apagada)'}</b>
        ${q ? q.alternativas.map((a, i) => `<div class="alt ${i===d.c?'certa':i===d.r?'errada':''}" style="cursor:default"><b>${'ABCDE'[i]})</b> ${h(a)}${i===d.r?' ← marcou':''}</div>`).join('') : ''}
        ${d.r == null ? '<p class="mut">Não respondeu.</p>' : ''}${q?.explicacao ? `<p class="mut">💡 ${h(q.explicacao)}</p>` : ''}</div>`; }).join(''); };
  const quando = iso => new Date(iso).toLocaleString('pt-BR', { weekday:'short', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
  return `${voltar}
    <div class="mhead" style="--c:${h(m.cor)}"><span class="em">${m.emoji}</span><div class="big">${h(m.nome)}</div><div>Desempenho de ${h(nomeAluno(S.aluno))}</div></div>
    <div class="card"><h2>Resumo</h2><table>
      <tr><td>🎯 Treinos</td><td><b>${tr.length}</b></td><td>média ${media(tr)} · melhor ${tr.length ? Math.max(...tr.map(t => Number(t.pct))) + '%' : '—'}</td></tr>
      <tr><td>🏛️ Provas valendo</td><td><b>${pv.length}</b></td><td>${pv.map(t => t.pct + '%').join(', ') || '—'}</td></tr>
      <tr><td>📈 Evolução dos treinos</td><td colspan="2">${tr.map(t => t.pct + '%').join(' → ') || '—'}</td></tr>
      <tr><td>👀 Questões de treino vistas</td><td colspan="2"><b>${vistasTreino}</b> de ${bancoTreino}${bancoTreino && vistasTreino < bancoTreino ? ` · ${bancoTreino - vistasTreino} nunca apareceram` : ''}</td></tr>
      <tr><td>🔁 Repetidas</td><td colspan="2"><b>${repetidas.length}</b> questões apareceram mais de uma vez${respostas ? ` · ${respostas} respostas no total` : ''}</td></tr>
      <tr><td>❌ Sempre erra</td><td colspan="2"><b>${sempreErra.length}</b> (erradas toda vez, vistas 2+ vezes)</td></tr>
      <tr><td>🔀 Instáveis</td><td colspan="2"><b>${errouDepoisAcertou.length}</b> (ora acerta, ora erra: pode ser chute)</td></tr>
    </table>
    ${dup.size ? `<p class="mut">⚠️ ${dup.size} tentativa(s) gravada(s) em dobro por clique duplo foram ignoradas.</p>` : ''}
    ${comDet < validas.length ? `<p class="mut">${validas.length - comDet} tentativa(s) antigas não têm detalhe por questão; os números acima usam só as ${comDet} com detalhe.</p>` : ''}</div>
    ${Object.keys(top).length ? `<div class="card"><h2>Acerto por tópico</h2><table>${Object.entries(top).sort((a, b) => a[1].a/a[1].v - b[1].a/b[1].v).map(([k, x]) => `<tr><td>${h(k)}</td><td style="width:120px"><div class="bar"><i style="width:${100*x.a/x.v}%;background:${x.a/x.v >= .7 ? 'var(--ok)' : x.a/x.v >= .5 ? 'var(--warn)' : 'var(--bad)'}"></i></div></td><td style="text-align:right">${Math.round(100*x.a/x.v)}% <span class="mut">(${x.a}/${x.v})</span></td></tr>`).join('')}</table></div>` : ''}
    ${erradas.length ? `<div class="card"><h2>Questões que ele erra (${erradas.length})</h2><p class="mut">Acertos / vezes que apareceu. As piores primeiro.</p>${erradas.slice(0, 30).map(linhaQ).join('')}</div>` : ''}
    <div class="card"><h2>Todas as tentativas (${T.length})</h2>${[...T].reverse().map(t => `<details class="topico"><summary>${t.tipo === 'prova' ? '🏛️ Prova' : '🎯 Treino'} · ${quando(t.criado)} · <b>${t.acertos}/${t.total} (${t.pct}%)</b>${dup.has(t.id) ? ' · <span class="tag warn">duplicada</span>' : ''}</summary>${detTent(t)}</details>`).join('') || '<p class="mut">Nenhuma.</p>'}</div>`;
}

async function liberarProva(mid){
  const min = 30;
  if (ehResp()){ await gravarLiberacao(sb, mid, min); return; }
  const html = `<div class="modal" id="mlib"><div class="card"><h2>🔐 Liberar prova de ${h(MAT(mid).nome)}</h2>
    <p class="mut">Pai ou mãe: entre com o seu login. Tempo de prova: ${min} minutos.</p>
    <input id="remail" type="email" placeholder="e-mail do responsável"><br><br><input id="rsenha" type="password" placeholder="senha"><br><br>
    <div class="row"><button class="btn sec" id="rcanc">Cancelar</button><button class="btn" id="rok" style="flex:1">Liberar</button></div></div></div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  const fechar = () => document.getElementById('mlib')?.remove();
  document.getElementById('rcanc').onclick = fechar;
  document.getElementById('rok').onclick = async () => {
    const tmp = createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:false, autoRefreshToken:false, storageKey:'tmp-resp' } });
    const { data, error } = await tmp.auth.signInWithPassword({ email:document.getElementById('remail').value.trim(), password:document.getElementById('rsenha').value });
    if (error){ toast('Login inválido'); return; }
    const { data: pf } = await tmp.from('perfis').select('papel').eq('user_id', data.user.id).maybeSingle();
    if (pf?.papel !== 'responsavel'){ toast('Esse login não é de responsável 😏'); await tmp.auth.signOut(); return; }
    await gravarLiberacao(tmp, mid, min, data.user.id);
    await tmp.auth.signOut();
    fechar();
  };
}
async function gravarLiberacao(cli, mid, min, uid){
  const ate = new Date(Date.now() + min*6e4).toISOString();
  const { error } = await cli.from('liberacoes').upsert({ aluno:S.aluno, materia:mid, ate, liberada_por: uid || S.user.id }, { onConflict:'aluno,materia' });
  if (error){ toast('Erro: ' + error.message); return; }
  S.lib[mid] = { materia:mid, ate };
  toast('Prova liberada por ' + min + ' minutos');
  render();
}

async function iniciarProva(mid){
  const { data, error } = await sb.from('questoes').select('id,enunciado,alternativas,topico').eq('aluno', S.aluno).eq('materia', mid).eq('tipo','prova');
  if (error || !data?.length){ toast('Ainda não há questões de prova para essa matéria'); return; }
  S.prova = { materia:mid, ate:S.lib[mid].ate, lista:data.sort(() => Math.random()-.5), resp:{} };
  render();
}

async function treinar(mid){
  const { data: qs, error } = await sb.from('questoes').select('id,enunciado,alternativas,topico').eq('aluno', S.aluno).eq('materia', mid).eq('tipo','treino');
  if (error || !qs?.length){ toast('Ainda sem questões de treino — cobra o pai pelas fotos 😅'); return; }
  const { data: gb } = await sb.from('gabarito').select('*').in('questao_id', qs.map(q => q.id));
  const G = Object.fromEntries((gb||[]).map(g => [g.questao_id, g]));
  const lista = qs.sort(() => Math.random()-.5).slice(0,10).map(q => ({ ...q, correta:G[q.id]?.correta, explicacao:G[q.id]?.explicacao }));
  S.quiz = { materia:mid, lista, i:0, acertos:0, resp:null, det:[] };
  render();
}

function relatorio(){
  const linhas = S.mats.map(m => {
    const tops = m.topicos.map(t => { const r = S.prog[chT(m.id, t.idx)] || {};
      return `  - ${t.nome}: ${r.estudou?'estudou':'não estudou'}, ${r.exercicios?'fez exercícios':'sem exercícios'}, domínio ${r.dominio||'?'}/5${r.duvida?`, dúvida: "${r.duvida}"`:''}`; }).join('\n');
    const tr = melhor(m.id,'treino'), pv = melhor(m.id,'prova');
    return `${m.nome} [código ${m.id}]${m.prova ? ' (prova ' + m.prova + ')' : ''} — melhor treino: ${tr>=0?tr+'%':'—'} · prova valendo: ${pv>=0?pv+'%':'—'}\n${tops}`;
  }).join('\n\n');
  const red = S.prog['redacao:texto']?.duvida;
  return `RELATÓRIO DE ESTUDOS — ${nomeAluno(S.aluno)} — ${new Date().toLocaleString('pt-BR')}\n\n${linhas}${red ? `\n\nREDAÇÃO PARA CORRIGIR:\n${red}` : ''}`;
}

  async lMeta(){ const g = calcMeta(); if (!confirm(`Lançar ${fmtV(S.grupos.estudos.moeda, g.valor)} (${g.nivel}) para ${nomeAluno(S.aluno)}?`)) return;
    const dRef = g.prazo.toLocaleDateString('sv-SE', { timeZone:'America/Sao_Paulo' });
    const { error } = await sb.rpc('lancar', { p_aluno:S.aluno, p_grupo:'estudos', p_valor:g.valor, p_descricao:`Missão: nível ${g.nivel}`, p_data_ref:dRef, p_origem:'nivel', p_origem_ref:'meta:' + g.c.prazo });
    if (erro(error)) return; toast('Lançado ✓'); await recarregar(); },
  async lNotas(){ const d = calcDinheiro(); const ref = val('lnRef').trim() || 'notas'; if (!confirm(`Lançar ${fmtV(S.grupos.notas.moeda, d.total)} (${ref}) para ${nomeAluno(S.aluno)}?`)) return;
    const { error } = await sb.rpc('lancar', { p_aluno:S.aluno, p_grupo:'notas', p_valor:d.total, p_descricao:`Notas: ${ref}`, p_origem:'notas', p_origem_ref:ref });
    if (error?.message?.includes('lancamentos_unico')){ toast('Essa rodada já foi lançada'); return; } if (erro(error)) return; toast('Lançado ✓'); await recarregar(); },
  async lUso(){ await lancarManual(-1); },
  async lCredito(){ await lancarManual(1); },
  // cadastros
  cadAba(el){ S.cad = el.dataset.v; render(); },
  async cTarefaSalvar(el){ const id = el.dataset.v, p = `t${id}`;
    const reg = { nome:val(`${p}-nome`).trim(), emoji:val(`${p}-emoji`).trim() || '✅', pontos:num(`${p}-pontos`) ?? 0, modo:val(`${p}-modo`), alunos:lerAlunos(`${p}-al`), base:val(`${p}-base`) || hojeISO(), dias_semana:lerDias(p) };
    if (!reg.nome || !reg.alunos.length){ toast('Dê um nome e marque ao menos uma criança'); return; }
    if (reg.dias_semana && !reg.dias_semana.length){ toast('Marque ao menos um dia da semana'); return; }
    const { error } = id === 'novo' ? await sb.from('tarefas').insert(reg) : await sb.from('tarefas').update(reg).eq('id', id);
    if (erro(error)) return; toast('Salvo ✓'); await recarregar(); },
  async cTarefaAtiva(el){ const t = S.tarefasCad.find(x => x.id === Number(el.dataset.v)); const { error } = await sb.from('tarefas').update({ ativa:!t.ativa }).eq('id', t.id); if (erro(error)) return; await recarregar(); },
  async cTroca(el){ const id = Number(el.dataset.v); const { error } = await sb.from('trocas').upsert({ tarefa:id, dia:val(`t${id}-tdia`), aluno:val(`t${id}-tal`), por:S.user.id }, { onConflict:'tarefa,dia' });
    if (erro(error)) return; toast('Troca registrada'); await recarregar(); },
  async cPremioSalvar(el){ const id = el.dataset.v, k = `p${id}`; const al = lerAlunos(`${k}-al`);
    const reg = { nome:val(`${k}-nome`).trim(), emoji:val(`${k}-emoji`).trim() || '🎁', custo:num(`${k}-custo`), alunos:al.length === S.alunos.length ? null : al };
    if (!reg.nome || !(reg.custo > 0) || !al.length){ toast('Nome, custo maior que zero e ao menos uma criança'); return; }
    const { error } = id === 'novo' ? await sb.from('premios').insert(reg) : await sb.from('premios').update(reg).eq('id', id);
    if (erro(error)) return; toast('Salvo ✓'); await recarregar(); },
  async cPremioAtivo(el){ const p = S.premios.find(x => x.id === Number(el.dataset.v)); const { error } = await sb.from('premios').update({ ativo:!p.ativo }).eq('id', p.id); if (erro(error)) return; await recarregar(); },
  async cMatSalvar(el){ const id = el.dataset.v;
    const { error } = await sb.from('materias').update({ nome:val(`m-${id}-nome`).trim(), emoji:val(`m-${id}-emoji`).trim() || '📘', cor:val(`m-${id}-cor`), prova:val(`m-${id}-prova`) || null }).eq('aluno', S.aluno).eq('id', id);
    if (erro(error)) return;
    const tops = S.todosTopicos.filter(t => t.materia === id);
    for (const t of tops){ const nome = val(`tp-${id}-${t.idx}`).trim(); const ativo = document.getElementById(`tpa-${id}-${t.idx}`).checked;
      if (nome && (nome !== t.nome || ativo !== t.ativo)){ const r = await sb.from('topicos').update({ nome, ativo }).eq('aluno', S.aluno).eq('materia', id).eq('idx', t.idx); if (erro(r.error)) return; } }
    const novo = val(`tpn-${id}`).trim();
    if (novo){ const idx = tops.reduce((mx, t) => Math.max(mx, t.idx), -1) + 1; const r = await sb.from('topicos').insert({ aluno:S.aluno, materia:id, idx, nome:novo }); if (erro(r.error)) return; }
    toast('Salvo ✓'); await recarregar(); },
  async cMatAtiva(el){ const m = S.todasMats.find(x => x.id === el.dataset.v); const { error } = await sb.from('materias').update({ ativa:!m.ativa }).eq('aluno', S.aluno).eq('id', m.id); if (erro(error)) return; await recarregar(); },
  async cMatNova(){ const nome = val('mn-nome').trim();
    const id = (val('mn-id').trim() || nome).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
    if (!nome || !id){ toast('Dê um nome'); return; }
    if (S.todasMats.some(m => m.id === id)){ toast('Já existe uma matéria com o código ' + id); return; }
    const { error } = await sb.from('materias').insert({ aluno:S.aluno, id, nome, emoji:val('mn-emoji').trim() || '📘', cor:val('mn-cor'), ordem:S.todasMats.length });
    if (erro(error)) return; toast('Matéria criada: código ' + id); await recarregar(); },
  async cRegra(el){ const gr = el.dataset.v; const x = S.grupos[gr];
    const reg = { moeda:val(`g-${gr}-moeda`), teto:num(`g-${gr}-teto`), expira:val(`g-${gr}-expira`), config:{ ...x.config } };
    if (reg.teto != null && !(reg.teto > 0)) reg.teto = null;
    if (gr === 'estudos'){ const pz = val('ge-prazo');
      Object.assign(reg.config, { prazo:pz ? new Date(pz + ':00-03:00').toISOString() : null, materias:S.mats.map(m => m.id).filter(id => document.getElementById(`ge-m-${id}`)?.checked),
        treino_min:num('ge-tmin') ?? 70, prova_min:num('ge-pmin') ?? 80, prova_qtd:num('ge-pqtd') ?? 1, minutos:{ bronze:num('ge-b') ?? 0, prata:num('ge-p') ?? 0, ouro:num('ge-o') ?? 0 } }); }
    if (gr === 'notas') Object.assign(reg.config, { por_materia:num('gn-por') ?? 0, nota_min:num('gn-min') ?? 0, bonus:num('gn-bonus') ?? 0, bonus_min:num('gn-bmin') ?? 0, maximo:num('gn-max') });
    if (reg.moeda !== x.moeda && !confirm('Mudar o tipo de recompensa começa um saldo novo nesse tipo (o histórico continua no extrato). Continuar?')) return;
    const { error } = await sb.from('grupos').update(reg).eq('aluno', S.aluno).eq('grupo', gr); if (erro(error)) return; toast('Regras salvas ✓'); await recarregar(); },
  async cPausa(){ const ini = val('pz-ini'), fim = val('pz-fim') || val('pz-ini'); if (!ini){ toast('Escolha as datas'); return; }
    const { error } = await sb.from('pausas').insert({ inicio:ini, fim, motivo:val('pz-mot') || null }); if (erro(error)) return; toast('Pausa criada'); await recarregar(); },
  async cPausaDel(el){ if (!confirm('Remover esta pausa?')) return; const { error } = await sb.from('pausas').delete().eq('id', el.dataset.v); if (erro(error)) return; await recarregar(); },
};
async function lancarManual(sinal){
  const g = val('luG'), v = Math.abs(num('luV') || 0), desc = val('luT').trim();
  if (!v || !desc){ toast('Preencha valor e descrição'); return; }
  const { error } = await sb.rpc('lancar', { p_aluno:S.aluno, p_grupo:g, p_valor:sinal * v, p_descricao:desc, p_data_ref:val('luD') || null, p_origem:sinal < 0 ? 'uso' : 'manual' });
  if (erro(error)) return; toast('Lançado ✓'); await recarregar();
}

$app.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') return;
  const fn = acoes[el.dataset.a]; if (!fn) return;
  if (el.tagName === 'BUTTON'){ if (el.dataset.ocupado) return; el.dataset.ocupado = '1'; }
  try { await fn(el); } finally { delete el.dataset.ocupado; }
});

// Ações de campo (precisam ver o valor novo)
$app.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.a === 'anMat'){ await abrirAnalise(el.value); return; }
  if (el.dataset.a === 'crono'){ await salvar(el.dataset.k, { feito: el.checked }); if (S.aba === 'agenda') render(); }
  if (el.dataset.a === 'duv'){ await salvar(el.dataset.k, { duvida: el.value }); toast('Salvo'); }
  if (el.dataset.a === 'nota'){
    const n = el.value === '' ? null : Number(el.value);
    const { error } = n == null ? await sb.from('notas_p2').delete().eq('aluno', S.aluno).eq('materia', el.dataset.v) : await sb.from('notas_p2').upsert({ aluno:S.aluno, materia:el.dataset.v, nota:n }, { onConflict:'aluno,materia' });
    if (error) toast(error.message); else { S.notas[el.dataset.v] = n; toast('Nota salva'); }
  }
});

async function importar(txt){
  let arr; try { arr = JSON.parse(txt.replace(/^﻿/, '').trim()); } catch (e) { toast('Não consegui ler o arquivo: ' + e.message.slice(0,80)); return false; }
  if (!Array.isArray(arr)){ toast('Arquivo em formato inesperado'); return false; }
  const cods = new Set(S.todasMats.map(m => m.id));
  const sem = [...new Set(arr.map(q => q.materia).filter(m => !cods.has(m)))];
  if (sem.length){ toast(`Matéria não cadastrada para ${nomeAluno(S.aluno)}: ${sem.join(', ')}`); return false; }
  const ids = arr.map(q => q.id);
  const { data: existentes } = await sb.from('questoes').select('id,aluno').in('id', ids);
  const deOutro = (existentes || []).filter(q => q.aluno !== S.aluno).map(q => q.id);
  if (deOutro.length){ toast(`IDs já usados por outro aluno (${deOutro.slice(0,3).join(', ')}…). Peça IDs novos ao Claude.`); return false; }
  const qs = arr.map(q => ({ id:q.id, aluno:S.aluno, materia:q.materia, topico:q.topico || null, tipo:q.tipo, enunciado:q.enunciado, alternativas:q.alternativas }));
  const gb = arr.map(q => ({ questao_id:q.id, correta:q.correta, explicacao:q.explicacao || null }));
  const r1 = await sb.from('questoes').upsert(qs); if (r1.error){ toast('Erro: ' + r1.error.message); return false; }
  const r2 = await sb.from('gabarito').upsert(gb); if (r2.error){ toast('Erro: ' + r2.error.message); return false; }
  const t = arr.filter(q => q.tipo==='treino').length;
  toast(`✅ ${arr.length} questões importadas para ${nomeAluno(S.aluno)} (${t} treino · ${arr.length-t} prova)`);
  document.getElementById('imp').value = ''; document.getElementById('impf').value = '';
  return true;
}
async function contarQuestoes(){
  if (!ehResp()) return;
  const { data } = await sb.from('questoes').select('materia,tipo').eq('aluno', S.aluno);
  S.qtd = {}; (data||[]).forEach(q => { const k = S.qtd[q.materia] ||= { treino:0, prova:0 }; k[q.tipo]++; });
}

// Relógio da prova
setInterval(() => {
  if (!S.prova || S.prova.resultado) return;
  const r = document.getElementById('relogio'); if (!r) return;
  const falta = Math.max(0, new Date(S.prova.ate) - new Date());
  r.textContent = `${Math.floor(falta/6e4)}:${String(Math.floor(falta%6e4/1e3)).padStart(2,'0')}`;
  if (falta === 0 && !S.prova.auto){ S.prova.auto = true; acoes.enviarProva(); }
}, 1000);

// ---------------- INÍCIO ----------------
async function iniciarSessao(session){
  S.user = session?.user || null;
  if (!S.user){ S.perfil = null; render(); return; }
  const { data: perfis } = await sb.from('perfis').select('*');
  const data = (perfis || []).find(p => p.user_id === S.user.id);
  if (!data){ $app.innerHTML = `<div id="login" class="card"><h2>Quase lá</h2><p class="mut">Seu login funciona, mas ainda não foi cadastrado no app. Fala com o pai.</p><button class="btn sec" data-a="sair">Sair</button></div>`; return; }
  S.perfil = data;
  S.alunos = (perfis || []).filter(p => p.papel === 'aluno').sort((a, b) => a.nome.localeCompare(b.nome));
  if (data.papel === 'aluno') S.aluno = data.user_id;
  else { let salvo = null; try { salvo = localStorage.getItem('aluno'); } catch {} S.aluno = S.alunos.some(a => a.user_id === salvo) ? salvo : S.alunos[0]?.user_id; }
  await carregar();
  render();
}
sb.auth.onAuthStateChange((_ev, session) => {
  const novo = session?.user?.id || null;
  if (novo === (S.user?.id || null) && S.perfil !== undefined && _ev !== 'INITIAL_SESSION') return;
  setTimeout(() => iniciarSessao(session), 0);
});
</script>
