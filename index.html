<style>
:root{

  --bg:#EEF2EF;--card:#FFFFFF;--txt:#16201D;--mut:#55635E;--line:#DCE4DF;
  --ac:#0E7A64;--ac-ink:#FFFFFF;--soft:#D9F0E9;
  --ok:#0E7A64;--okbg:#D9F0E9;--warn:#F3A712;--warnbg:#FFF0CC;--warn-ink:#6B4200;--bad:#CF3B3A;--badbg:#FBE3E2;
  --prova:#CF3B3A;--estudo:#2C6BE0;--meta:#7B4CD1;--metabg:#ECE4FA;
  --shadow:0 1px 2px #16201d14,0 6px 20px #16201d0d;
}
:root[data-theme="dark"]{
  --bg:#0F1513;--card:#18211E;--txt:#E8F0EC;--mut:#9AABA4;--line:#2A3631;
  --ac:#3CC4A3;--ac-ink:#06201A;--soft:#163A31;
  --ok:#3CC4A3;--okbg:#163A31;--warn:#F5B83A;--warnbg:#3A2E10;--warn-ink:#FFE2A0;--bad:#FF7B7A;--badbg:#3F1F1F;
  --prova:#FF7B7A;--estudo:#7BA7FF;--meta:#B596F5;--metabg:#2C2147;
  --shadow:0 1px 2px #00000066,0 6px 20px #00000040;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 var(--font-body);padding-bottom:96px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--estudo);outline-offset:2px}
main{padding:0 14px;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.topo{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px;gap:10px;max-width:760px;margin:0 auto}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who small{display:block;color:var(--mut);line-height:1.1}
.who b{font-family:var(--font-display);font-size:21px;line-height:1.1}
.av{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;color:#fff;font-weight:800;font-family:var(--font-display);flex:none;font-size:14px}
.av.sm{width:26px;height:26px;font-size:10px}
.saldo{display:flex;align-items:center;gap:6px;background:var(--warnbg);color:var(--warn-ink);border:0;border-radius:999px;padding:8px 14px 8px 8px;font-size:18px;min-height:44px;font-family:var(--font-display);font-weight:800}
.coin{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--warn);color:var(--warn-ink);font-size:12px;font-weight:800;flex:none;font-family:var(--font-body)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 -4px 16px #16201d12}
nav button{flex:1;max-width:140px;min-width:0;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;font-size:12px;font-weight:700;position:relative;min-height:54px}
nav button[aria-current="page"]{color:var(--ac);background:var(--soft)}
.badge{position:absolute;top:2px;left:calc(50% + 8px);background:var(--prova);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.card{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.card h2{font-size:18px;margin:0 0 4px}
.card h3{font-size:13px;margin:14px 0 2px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.mut{color:var(--mut);font-size:14px}
.hello{font-size:15px;color:var(--mut);margin:4px 0 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{background:var(--ac);color:var(--ac-ink);border:0;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:800;cursor:pointer;width:100%;min-height:46px}
.btn.sec{background:var(--soft);color:var(--ac)}
.btn.ok{background:var(--ok);color:var(--ac-ink)}
.btn.bad{background:var(--badbg);color:var(--bad)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--txt)}
.btn.min{width:auto;padding:8px 14px;font-size:14px;min-height:40px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:var(--card);color:var(--txt);border:1.5px solid var(--line);border-radius:12px;padding:11px;font-size:16px;width:100%;font-family:inherit}
textarea{min-height:70px;resize:vertical}
.bar{height:10px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:var(--ok);transition:width .3s}
.bar.ouro i{background:var(--warn)}
.tag,.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--line);color:var(--mut)}
.tag.ok,.chip.ok{background:var(--okbg);color:var(--ok)}
.tag.hoje{background:var(--ac);color:var(--ac-ink)}
.tag.bad,.chip.prova{background:var(--badbg);color:var(--bad)}
.tag.warn,.chip.ouro{background:var(--warnbg);color:var(--warn-ink)}
.chip.meta{background:var(--metabg);color:var(--meta)}
.dia-ok{background:var(--okbg);color:var(--ok);border-radius:14px;padding:10px 12px;font-weight:800;margin-top:10px}
.hero{background:var(--ac);color:var(--ac-ink)}
.hero .mut{color:inherit;opacity:.85}
.big{font-family:var(--font-display);font-size:30px;font-weight:800;line-height:1.1}
/* tarefas */
.task{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.task:first-of-type{border-top:0}
.chk{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;color:transparent;font-size:20px;font-weight:800;padding:0}
.chk:not(:disabled):hover{border-color:var(--ac)}
.task.ok .chk{background:var(--ac);border-color:var(--ac);color:var(--ac-ink);animation:pop .3s}
.task.feito .chk{background:var(--warnbg);border-color:var(--warn);color:var(--warn-ink)}
.task.rej .chk,.task.nao .chk{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.task.fut .chk{opacity:.5}
.task.meio .chk{background:var(--warnbg);border-color:var(--warn);color:var(--warn-ink);font-weight:800}
.btn.warn{background:var(--warnbg);color:var(--warn-ink)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.task.ok .chk{animation:none}.bar i{transition:none}}
.task.ok .tx b{text-decoration:line-through;text-decoration-color:var(--mut);color:var(--mut)}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:800;line-height:1.25}
.tx small{color:var(--mut);font-size:13px}
.pts{display:inline-flex;align-items:center;gap:5px;font-weight:800;color:var(--warn-ink);background:var(--warnbg);border-radius:999px;padding:3px 10px 3px 4px;font-size:14px;flex:none}
.pts .coin{width:18px;height:18px;font-size:10px}
.task .acoes{flex-basis:100%;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
/* missão */
.trilha{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.trilha div{text-align:center;padding:10px 4px;border-radius:14px;background:var(--bg);font-size:13px;font-weight:800}
.trilha div.on{background:var(--ac);color:var(--ac-ink)}
.trilha div span{display:block;font-size:24px}
.falta{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
/* agenda */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.alunos button,.subabas button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:800;color:var(--mut);min-height:42px;white-space:nowrap;font-size:14px}
.seg button[aria-pressed="true"],.alunos button.on,.subabas button.on{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.alunos,.subabas{display:flex;gap:6px;max-width:760px;margin:4px auto 4px;padding:0 14px;overflow-x:auto}
.subabas{padding:0;margin:0 0 4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dbtn{border:1.5px solid transparent;background:var(--card);border-radius:14px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:64px;font-weight:800;min-width:0}
.dbtn small{color:var(--mut);font-weight:700;text-transform:uppercase;font-size:11px}
.dbtn .n{font-size:17px;font-family:var(--font-display)}
.dbtn.hoje .n{color:var(--ac)}
.dbtn.sel{background:var(--ac);color:var(--ac-ink)}
.dbtn.sel small,.dbtn.sel .n{color:var(--ac-ink)}
.dbtn.pas{opacity:.6}
.dots{display:flex;gap:3px;height:7px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.prova{background:var(--prova)}.dot.casa{background:var(--ac)}.dot.estudo{background:var(--estudo)}.dot.meta{background:var(--meta)}
.dbtn.sel .dot{box-shadow:0 0 0 1.5px var(--ac-ink)}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mh{text-align:center;font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);font-weight:700;margin-top:10px}
.legenda span{display:inline-flex;align-items:center;gap:5px}
.navw{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.navw button{width:44px;height:44px;border-radius:50%;border:0;background:var(--bg);font-size:20px;font-weight:800}
.navw button:disabled{opacity:.35}
.pessoa{display:flex;align-items:center;gap:8px;margin:12px 0 2px;font-weight:800}
/* matérias e legado */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr 1fr}}
.mcard{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:6px;border:0;border-top:6px solid var(--c);text-align:left}
.mcard .em{font-size:28px}
.mcard b{font-size:15px}
.mhead{border-radius:18px;padding:18px;color:#fff;background:var(--c);margin:4px 0}
.mhead .em{font-size:34px}
.voltar{background:none;border:0;color:var(--ac);font-weight:800;font-size:15px;padding:8px 0;cursor:pointer;text-align:left}
.topico{background:var(--card);border-radius:16px;padding:14px;margin:0;box-shadow:var(--shadow)}
.topico .tt{font-weight:800;margin-bottom:10px}
.pills{display:flex;gap:8px}
.pill{flex:1;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:11px 6px;font-size:15px;font-weight:800;color:var(--mut);cursor:pointer}
.pill.on{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.dom{display:flex;gap:6px;margin-top:6px}
.dom button{flex:1;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 0;font-size:22px;cursor:pointer;filter:grayscale(1);opacity:.6}
.dom button.on{filter:none;opacity:1;border-color:var(--ac);background:var(--soft)}
.lbl{font-size:13px;color:var(--mut);margin-top:12px}
details summary{cursor:pointer;color:var(--ac);font-weight:700;font-size:14px;margin-top:10px}
.alt{display:block;width:100%;text-align:left;background:var(--card);color:var(--txt);border:2px solid var(--line);border-radius:14px;padding:13px;margin:8px 0;font-size:15px;cursor:pointer}
.alt.certa{border-color:var(--ok);background:var(--okbg)}
.alt.errada{border-color:var(--bad);background:var(--badbg)}
.alt.sel{border-color:var(--ac);background:var(--soft)}
.ck{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;border-top:1px solid var(--line)}
.ck input{width:22px;height:22px;accent-color:var(--ok);flex:none}
.modal{position:fixed;inset:0;background:#0b1210a6;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .card{width:100%;max-width:420px}
.sheetbg{position:fixed;inset:0;background:#0b1210a6;display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:22px;margin:0}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:20;font-weight:700;max-width:90vw;text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.nivel{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.nivel b.ic{font-size:26px}
.enun{white-space:pre-line;font-size:16px;font-weight:700;margin:8px 0}
.campo{display:flex;flex-direction:column;gap:2px;flex:1;min-width:130px;margin-top:6px}
.ckin{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;margin-right:10px}
.ckin input{width:18px;height:18px;padding:0}
.inativo{opacity:.55}
#login{max-width:380px;margin:12vh auto;padding:24px}
.sair{background:none;border:0;color:var(--mut);font-size:14px;text-decoration:underline;padding:10px;margin:8px auto;display:block}
/* loja */
.saldo-card{background:var(--warnbg);color:var(--warn-ink)}
.saldo-card .big{display:flex;align-items:center;gap:10px;font-size:44px}
.saldo-card .coin{width:36px;height:36px;font-size:18px}
.loja-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.loja-item:first-of-type{border-top:0}
.tile{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--warnbg);flex:none}
.loja-item b{display:block}
.preco{display:flex;align-items:center;gap:5px;font-weight:800;font-size:14px;color:var(--warn-ink)}
.step{display:flex;align-items:center;gap:8px}
.step button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:20px;font-weight:800}
.step button:disabled{opacity:.35}
.step output{min-width:64px;text-align:center;font-weight:800;font-family:var(--font-display);font-size:18px}
.ext{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.ext:first-of-type{border-top:0}
.ext b.neg{color:var(--bad)}.ext b.pos{color:var(--ok)}
.lista{display:flex;flex-direction:column}
.lista button{display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;background:none;padding:14px 4px;border-top:1px solid var(--line);text-align:left;font-weight:700;min-height:52px;width:100%}
.lista button:first-child{border-top:0}
.vazio{color:var(--mut);padding:8px 0}
.aviso{background:var(--warnbg);color:var(--warn-ink);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:700}
</style>

function autoFeito(texto, d){

  const n = norm(texto); const c = S.grupos.estudos?.config || {};
  if (/\bprova valendo\b/.test(n)) return S.tent.some(t => t.tipo === 'prova' && diaSP(t.criado) === d);

function progMat(mid){
  const m = MAT(mid); let ok = 0;
  m.topicos.forEach(t => { const p = S.prog[chT(mid, t.idx)]; if (p?.estudou && p?.exercicios) ok++; });
  return { ok, total:m.topicos.length };
}
function melhor(mid, tipo, ateData){
  return S.tent.filter(t => t.materia===mid && t.tipo===tipo && (!ateData || new Date(t.criado) <= ateData) && (tipo!=='treino' || t.total>=5))
    .reduce((mx, t) => Math.max(mx, Number(t.pct)), -1);
}
// Meta de estudos (bronze/prata/ouro) — regras em grupos.estudos.config
function calcMeta(){
  const c = S.grupos.estudos?.config || {};
  const mats = (c.materias || []).filter(id => MAT(id));
  if (!c.prazo || !mats.length) return null;
  const prazo = new Date(c.prazo);
  const bronzeDet = mats.map(mid => ({ mid, ok:MAT(mid).topicos.every(t => { const p = S.prog[chT(mid, t.idx)]; return p?.concluido_em && new Date(p.concluido_em) <= prazo; }) }));
  const bronze = bronzeDet.every(x => x.ok);
  const prataDet = mats.map(mid => ({ mid, v:melhor(mid, 'treino', prazo) }));
  const prata = bronze && prataDet.every(x => x.v >= c.treino_min);
  const qtd = Math.min(Number(c.prova_qtd) || mats.length, mats.length);
  const ouroDet = mats.map(mid => ({ mid, v:melhor(mid, 'prova', prazo) }));
  const ouro = prata && ouroDet.filter(x => x.v >= c.prova_min).length >= qtd;
  const M = c.pontos || {};
  const nivel = ouro ? 'ouro' : prata ? 'prata' : bronze ? 'bronze' : null;
  return { c, prazo, mats, qtd, M, bronze, prata, ouro, bronzeDet, prataDet, ouroDet, nivel, valor:nivel ? Number(M[nivel]) || 0 : 0 };
}
function calcDinheiro(){
  const c = S.grupos.notas?.config || {};
  const linhas = S.mats.map(m => { const n = S.notas[m.id]; return { mid:m.id, n, v:(n != null && n >= c.nota_min) ? Number(c.por_materia) || 0 : 0 }; });
  const todas = linhas.length && linhas.every(l => l.n != null);
  const bonus = todas && linhas.every(l => l.n >= c.bonus_min) ? Number(c.bonus) || 0 : 0;
  const bruto = linhas.reduce((s, l) => s + l.v, 0) + bonus;
  return { c, linhas, bonus, todas, total:c.maximo ? Math.min(bruto, c.maximo) : bruto };
}

}

function telaQuiz(){

    const txt = ehResp() ? 'Teste do responsável: não fica registrado.' : falta == null ? '' : completo ? 'Treino concluído! Todas as questões estão certas.'

  return `<div class="card"><div class="row sp"><span class="tag">${MAT(q.materia).emoji} ${h(MAT(q.materia).nome)}</span><span class="tag">${q.i+1} de ${q.lista.length}</span></div>

function itemLoja(p){
  const saldo = S.saldoT;
  const l = S.limites[p.id]; const restante = l ? Math.max(0, l.limite - l.usado) : Infinity;
  const n = p.unidade ? Math.min(Math.max(1, S.qtdLoja[p.id] || 1), Math.max(1, restante === Infinity ? 99 : restante)) : 1;
  const custo = p.custo * n;
  const aguard = p.divide > 1 ? S.resgates.find(r => r.premio === p.id && r.status === 'aguardando') : null;
  const compartilha = p.limite_grupo ? S.premios.filter(x => x.ativo && x.id !== p.id && x.limite_grupo === p.limite_grupo).map(x => x.nome) : [];
  let limTxt = '';
  if (l){
    const usadoTxt = p.tipo === 'tela' ? `${fmtMin(l.usado * p.unidade)} de ${fmtMin(l.limite * p.unidade)}` : p.tipo === 'dinheiro' ? `R$ ${l.usado * p.unidade} de R$ ${l.limite * p.unidade}` : `${l.usado} de ${l.limite}`;
    limTxt = `<small class="mut" style="display:block">${usadoTxt} ${p.limite_periodo === 'semana' ? 'nesta semana' : 'neste mês'}${compartilha.length ? ` (junto com ${h(compartilha.join(', '))})` : ''}</small>`;
  }
  const unidTxt = p.unidade ? (p.tipo === 'tela' ? fmtMin(p.unidade * n) : `R$ ${p.unidade * n}`) : '';
  const stepper = p.unidade && !aguard ? `<div class="step"><button data-a="step" data-v="${p.id}" data-d="-1" ${n <= 1 ? 'disabled' : ''} aria-label="Menos">−</button><output>${unidTxt}</output><button data-a="step" data-v="${p.id}" data-d="1" ${n >= Math.min(restante, 99) ? 'disabled' : ''} aria-label="Mais">+</button></div>` : '';
  const cancelar = aguard ? `<button class="btn bad min" data-a="rCancelar" data-v="${aguard.id}">Cancelar</button>` : '';
  const falta = custo - saldo;
  const pode = !aguard && saldo >= custo && restante >= n;
  const msg = aguard ? 'Você já pagou a sua metade. Falta o outro pagar.' : restante < 1 ? 'Limite atingido' : (falta > 0 ? `Faltam ${pts(falta)} pontos` : (p.divide > 1 ? 'Cada um paga a sua metade. O dia é combinado com pai ou mãe.' : ''));
  return `<div class="loja-item"><span class="tile">${p.emoji}</span><div class="grow"><b>${h(p.nome)}</b><div class="preco">${coin} ${pts(custo)}</div>
      ${falta > 0 && !aguard ? `<div class="bar ouro" style="margin:6px 0 2px"><i style="width:${Math.min(100, Math.round(100 * saldo / custo))}%"></i></div>` : ''}
      ${msg ? `<small class="mut" style="display:block">${msg}</small>` : ''}${limTxt}</div>
    <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">${stepper}${cancelar}${!aguard ? `<button class="btn min" data-a="trocar" data-v="${p.id}" ${pode ? '' : 'disabled'}>Trocar</button>` : ''}</div></div>`;
}

    <div class="row sp" style="margin-top:10px"><b>Total previsto</b><span class="big">${pts(d.total)}</span></div>` : '';
  return `<div class="card"><details><summary>Como ganhar mais pontos</summary>
    <table style="margin-top:8px"><tr><td>🧹 Cada tarefa de casa</td><td style="text-align:right">o valor dela</td></tr>
    <tr><td>📖 Tópico concluído</td><td style="text-align:right"><b>+${pts(c.pts_topico ?? 30)}</b></td></tr>
    <tr><td>🎯 Treino com ${c.treino_min ?? 70}%+</td><td style="text-align:right"><b>+${pts(c.pts_treino ?? 40)}</b></td></tr>
    <tr><td>🏛️ Prova valendo com ${c.prova_min ?? 80}%+</td><td style="text-align:right"><b>+${pts(c.pts_prova ?? 100)}</b></td></tr>
    <tr><td>✅ Concluir o treino (100% das questões)</td><td style="text-align:right"><b>+${pts(c.pts_conclusao ?? 150)}</b></td></tr></table>${missao}${notas}</details></div>`;

async function abrirQuestoes(mid){
  S.verQ = mid; S.listaQ = null; render(); window.scrollTo(0,0);
  const { data: qs } = await sb.from('questoes').select('*').eq('aluno', S.aluno).eq('materia', mid).order('id');
  const { data: gb } = await sb.from('gabarito').select('*').in('questao_id', (qs||[]).map(q => q.id));
  const G = Object.fromEntries((gb||[]).map(g => [g.questao_id, g]));
  S.listaQ = (qs||[]).map(q => ({ ...q, correta:G[q.id]?.correta, explicacao:G[q.id]?.explicacao }));
  render();
}

async function abrirAnalise(mid){
  S.anMat = mid; S.banco = null; render(); window.scrollTo(0,0);
  const { data: qs } = await sb.from('questoes').select('id,topico,tipo,enunciado,alternativas').eq('aluno', S.aluno).eq('materia', mid);
  const { data: gb } = await sb.from('gabarito').select('*').in('questao_id', (qs||[]).map(q => q.id));
  const G = Object.fromEntries((gb||[]).map(g => [g.questao_id, g]));
  S.banco = Object.fromEntries((qs||[]).map(q => [q.id, { ...q, correta:G[q.id]?.correta, explicacao:G[q.id]?.explicacao }]));
  render();
}
// detalhes da prova trazem o texto; os do treino, só {id, r, c}
const normDet = d => (d || []).map(x => ({ id:x.id, r:x.r ?? x.resposta ?? null, c:x.c ?? x.correta }));
function telaAnalise(){
  const mid = S.anMat; const m = MAT(mid); const B = S.banco;
  const T = S.tent.filter(t => t.materia === mid).sort((a, b) => a.criado.localeCompare(b.criado));
  const voltar = `<button class="voltar" data-a="fecharAnalise">‹ Painel</button>
    <select data-a="anMat" style="margin-bottom:8px">${S.mats.map(x => `<option value="${x.id}" ${x.id===mid?'selected':''}>${x.emoji} ${h(x.nome)}</option>`).join('')}</select>`;
  if (!B) return voltar + '<p class="mut">Carregando…</p>';
  // clique duplo: mesma matéria/resultado gravada com menos de 3 s de diferença
  const dup = new Set(); T.forEach((t, i) => { const a = T[i-1]; if (a && a.tipo === t.tipo && a.acertos === t.acertos && a.total === t.total && new Date(t.criado) - new Date(a.criado) < 3000) dup.add(t.id); });
  const validas = T.filter(t => !dup.has(t.id));
  const tr = validas.filter(t => t.tipo === 'treino'), pv = validas.filter(t => t.tipo === 'prova');
  const media = L => L.length ? Math.round(L.reduce((s, t) => s + Number(t.pct), 0) / L.length) + '%' : '—';
  // estatística por questão
  const Q = {};
  validas.forEach(t => normDet(t.detalhes).forEach(d => { const q = Q[d.id] ||= { vezes:0, acertos:0, tipo:t.tipo }; q.vezes++; if (d.r === d.c) q.acertos++; }));
  const ids = Object.keys(Q); const comDet = validas.filter(t => t.detalhes?.length).length;
  const bancoTreino = Object.values(B).filter(q => q.tipo === 'treino').length;
  const vistasTreino = ids.filter(id => B[id]?.tipo === 'treino').length;
  const repetidas = ids.filter(id => Q[id].vezes > 1);
  const respostas = ids.reduce((s, id) => s + Q[id].vezes, 0);
  const erradas = ids.filter(id => Q[id].acertos < Q[id].vezes).sort((a, b) => (Q[b].vezes - Q[b].acertos) - (Q[a].vezes - Q[a].acertos) || Q[a].acertos/Q[a].vezes - Q[b].acertos/Q[b].vezes);
  const sempreErra = erradas.filter(id => Q[id].acertos === 0 && Q[id].vezes > 1);
  const errouDepoisAcertou = ids.filter(id => Q[id].vezes > 1 && Q[id].acertos > 0 && Q[id].acertos < Q[id].vezes);
  // por tópico
  const top = {}; ids.forEach(id => { const k = B[id]?.topico || 'sem tópico'; const x = top[k] ||= { v:0, a:0 }; x.v += Q[id].vezes; x.a += Q[id].acertos; });
  const linhaQ = id => { const q = B[id]; const x = Q[id];
    return `<div class="nivel"><div style="flex:1"><b>${q ? h(q.enunciado.slice(0, 110)) + (q.enunciado.length > 110 ? '…' : '') : h(id) + ' (apagada)'}</b><div class="mut">${h(q?.topico || '')} · ${x.tipo === 'prova' ? 'prova' : 'treino'}</div></div>
      <span class="tag ${x.acertos === x.vezes ? 'ok' : x.acertos === 0 ? 'bad' : 'warn'}">${x.acertos}/${x.vezes}</span></div>`; };
  const detTent = t => { const D = normDet(t.detalhes);
    if (!D.length) return '<p class="mut">Sem detalhe por questão (teste feito antes desta versão).</p>';
    return D.map((d, n) => { const q = B[d.id]; const ok = d.r === d.c;
      return `<div class="topico"><b>${ok ? '✅' : '❌'} ${n+1}. ${q ? h(q.enunciado) : h(d.id) + ' (questão apagada)'}</b>
        ${q ? q.alternativas.map((a, i) => `<div class="alt ${i===d.c?'certa':i===d.r?'errada':''}" style="cursor:default"><b>${'ABCDE'[i]})</b> ${h(a)}${i===d.r?' ← marcou':''}</div>`).join('') : ''}
        ${d.r == null ? '<p class="mut">Não respondeu.</p>' : ''}${q?.explicacao ? `<p class="mut">💡 ${h(q.explicacao)}</p>` : ''}</div>`; }).join(''); };
  const quando = iso => new Date(iso).toLocaleString('pt-BR', { weekday:'short', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
  return `${voltar}
    <div class="mhead" style="--c:${h(m.cor)}"><span class="em">${m.emoji}</span><div class="big">${h(m.nome)}</div><div>Desempenho de ${h(nomeAluno(S.aluno))}</div></div>

async function liberarProva(mid){
  const min = 30;
  if (ehResp()){ await gravarLiberacao(sb, mid, min); return; }
  const html = `<div class="modal" id="mlib"><div class="card"><h2>🔐 Liberar prova de ${h(MAT(mid).nome)}</h2>
    <p class="mut">Pai ou mãe: entre com o seu login. Tempo de prova: ${min} minutos.</p>
    <input id="remail" type="email" placeholder="e-mail do responsável"><br><br><input id="rsenha" type="password" placeholder="senha"><br><br>
    <div class="row"><button class="btn sec" id="rcanc">Cancelar</button><button class="btn" id="rok" style="flex:1">Liberar</button></div></div></div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  const fechar = () => document.getElementById('mlib')?.remove();
  document.getElementById('rcanc').onclick = fechar;
  document.getElementById('rok').onclick = async () => {
    const tmp = createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:false, autoRefreshToken:false, storageKey:'tmp-resp' } });
    const { data, error } = await tmp.auth.signInWithPassword({ email:document.getElementById('remail').value.trim(), password:document.getElementById('rsenha').value });
    if (error){ toast('Login inválido'); return; }
    const { data: pf } = await tmp.from('perfis').select('papel').eq('user_id', data.user.id).maybeSingle();
    if (pf?.papel !== 'responsavel'){ toast('Esse login não é de responsável 😏'); await tmp.auth.signOut(); return; }
    await gravarLiberacao(tmp, mid, min, data.user.id);
    await tmp.auth.signOut();
    fechar();
  };
}
async function gravarLiberacao(cli, mid, min, uid){
  const ate = new Date(Date.now() + min*6e4).toISOString();
  const { error } = await cli.from('liberacoes').upsert({ aluno:S.aluno, materia:mid, ate, liberada_por: uid || S.user.id }, { onConflict:'aluno,materia' });
  if (error){ toast('Erro: ' + error.message); return; }
  S.lib[mid] = { materia:mid, ate };
  toast('Prova liberada por ' + min + ' minutos');
  render();
}

async function iniciarProva(mid){
  const { data, error } = await sb.from('questoes').select('id,enunciado,alternativas,topico').eq('aluno', S.aluno).eq('materia', mid).eq('tipo','prova');
  if (error || !data?.length){ toast('Ainda não há questões de prova para essa matéria'); return; }
  S.prova = { materia:mid, ate:S.lib[mid].ate, lista:data.sort(() => Math.random()-.5), resp:{} };

async function treinar(mid){
  const { data: qs, error } = await sb.from('questoes').select('id,enunciado,alternativas,topico').eq('aluno', S.aluno).eq('materia', mid).eq('tipo','treino');
  if (error || !qs?.length){ toast('Ainda sem questões de treino — cobra o pai pelas fotos 😅'); return; }
  const { data: gb } = await sb.from('gabarito').select('*').in('questao_id', qs.map(q => q.id));
  const G = Object.fromEntries((gb||[]).map(g => [g.questao_id, g]));
  const lista = qs.sort(() => Math.random()-.5).slice(0,10).map(q => ({ ...q, correta:G[q.id]?.correta, explicacao:G[q.id]?.explicacao }));
  S.quiz = { materia:mid, lista, i:0, acertos:0, resp:null, det:[] };
  render();
}

function relatorio(){
  const linhas = S.mats.map(m => {
    const tops = m.topicos.map(t => { const r = S.prog[chT(m.id, t.idx)] || {};
      return `  - ${t.nome}: ${r.estudou?'estudou':'não estudou'}, ${r.exercicios?'fez exercícios':'sem exercícios'}, domínio ${r.dominio||'?'}/5${r.duvida?`, dúvida: "${r.duvida}"`:''}`; }).join('\n');
    const tr = melhor(m.id,'treino'), pv = melhor(m.id,'prova');
    return `${m.nome} [código ${m.id}]${m.prova ? ' (prova ' + m.prova + ')' : ''} — melhor treino: ${tr>=0?tr+'%':'—'} · prova valendo: ${pv>=0?pv+'%':'—'}\n${tops}`;
  }).join('\n\n');
  const red = S.prog['redacao:texto']?.duvida;
  return `RELATÓRIO DE ESTUDOS — ${nomeAluno(S.aluno)} — ${new Date().toLocaleString('pt-BR')}\n\n${linhas}${red ? `\n\nREDAÇÃO PARA CORRIGIR:\n${red}` : ''}`;
}

        treino_min:num('ge-tmin') ?? 70, prova_min:num('ge-pmin') ?? 80, prova_qtd:num('ge-pqtd') ?? 1,
        pts_topico:num('ge-pt') ?? 30, pts_treino:num('ge-ptr') ?? 40, pts_prova:num('ge-ppr') ?? 100, pts_conclusao:num('ge-pco') ?? 150, concluir_min_questoes:num('ge-qmin') ?? 50,
        pontos:{ bronze:num('ge-b') ?? 0, prata:num('ge-p') ?? 0, ouro:num('ge-o') ?? 0 } }); delete reg.config.minutos; }
    if (gr === 'notas'){ reg.config = { ...x.config }; Object.assign(reg.config, { por_materia:num('gn-por') ?? 0, nota_min:num('gn-min') ?? 0, bonus:num('gn-bonus') ?? 0, bonus_min:num('gn-bmin') ?? 0, maximo:num('gn-max') }); }
    const { error } = await sb.from('grupos').update(reg).eq('aluno', S.aluno).eq('grupo', gr); if (erro(error)) return; toast('Regras salvas ✓'); await recarregar(); },
  async cPausa(){ const ini = val('pz-ini'), fim = val('pz-fim') || val('pz-ini'); if (!ini){ toast('Escolha as datas'); return; }
    const { error } = await sb.from('pausas').insert({ inicio:ini, fim, motivo:val('pz-mot') || null }); if (erro(error)) return; toast('Pausa criada'); await recarregar(); },
  async cPausaDel(el){ if (!confirm('Remover esta pausa?')) return; const { error } = await sb.from('pausas').delete().eq('id', el.dataset.v); if (erro(error)) return; await recarregar(); },
};
async function lancarManual(sinal){
  const g = val('luG'), v = Math.abs(num('luV') || 0), desc = val('luT').trim();
  if (!v || !desc){ toast('Preencha valor e descrição'); return; }
  const { error } = await sb.rpc('lancar', { p_aluno:S.aluno, p_grupo:g, p_valor:sinal * v, p_descricao:desc, p_data_ref:val('luD') || null, p_origem:sinal < 0 ? 'uso' : 'manual' });
  if (erro(error)) return; toast('Lançado ✓'); await recarregar();
}

$app.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') return;
  const fn = acoes[el.dataset.a]; if (!fn) return;
  if (el.tagName === 'BUTTON'){ if (el.dataset.ocupado) return; el.dataset.ocupado = '1'; }
  try { await fn(el); } finally { delete el.dataset.ocupado; }
});

// Ações de campo (precisam ver o valor novo)
$app.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.a === 'anMat'){ await abrirAnalise(el.value); return; }
  if (el.dataset.a === 'cpCalc' || el.id?.startsWith('cp-')){ cpAtualiza(el.id === 'cpItem' || el.id === 'cpQtd'); return; }
  if (el.dataset.a === 'crono'){ await salvar(el.dataset.k, { feito: el.checked }); if (S.aba === 'agenda') render(); }
  if (el.dataset.a === 'duv'){ await salvar(el.dataset.k, { duvida: el.value }); toast('Salvo'); }
  if (el.dataset.a === 'nota'){
    const n = el.value === '' ? null : Number(el.value);
    const { error } = n == null ? await sb.from('notas_p2').delete().eq('aluno', S.aluno).eq('materia', el.dataset.v) : await sb.from('notas_p2').upsert({ aluno:S.aluno, materia:el.dataset.v, nota:n }, { onConflict:'aluno,materia' });
    if (error) toast(error.message); else { S.notas[el.dataset.v] = n; toast('Nota salva'); }
  }
});

async function importar(txt){
  let arr; try { arr = JSON.parse(txt.replace(/^﻿/, '').trim()); } catch (e) { toast('Não consegui ler o arquivo: ' + e.message.slice(0,80)); return false; }
  if (!Array.isArray(arr)){ toast('Arquivo em formato inesperado'); return false; }
  const cods = new Set(S.todasMats.map(m => m.id));
  const sem = [...new Set(arr.map(q => q.materia).filter(m => !cods.has(m)))];
  if (sem.length){ toast(`Matéria não cadastrada para ${nomeAluno(S.aluno)}: ${sem.join(', ')}`); return false; }
  const ids = arr.map(q => q.id);
  const { data: existentes } = await sb.from('questoes').select('id,aluno').in('id', ids);
  const deOutro = (existentes || []).filter(q => q.aluno !== S.aluno).map(q => q.id);
  if (deOutro.length){ toast(`IDs já usados por outro aluno (${deOutro.slice(0,3).join(', ')}…). Peça IDs novos ao Claude.`); return false; }
  const qs = arr.map(q => ({ id:q.id, aluno:S.aluno, materia:q.materia, topico:q.topico || null, tipo:q.tipo, enunciado:q.enunciado, alternativas:q.alternativas }));
  const gb = arr.map(q => ({ questao_id:q.id, correta:q.correta, explicacao:q.explicacao || null }));
  const r1 = await sb.from('questoes').upsert(qs); if (r1.error){ toast('Erro: ' + r1.error.message); return false; }
  const r2 = await sb.from('gabarito').upsert(gb); if (r2.error){ toast('Erro: ' + r2.error.message); return false; }
  const t = arr.filter(q => q.tipo==='treino').length;
  toast(`✅ ${arr.length} questões importadas para ${nomeAluno(S.aluno)} (${t} treino · ${arr.length-t} prova)`);
  document.getElementById('imp').value = ''; document.getElementById('impf').value = '';
  return true;
}
async function contarQuestoes(){
  if (!ehResp()) return;
  const { data } = await sb.from('questoes').select('materia,tipo').eq('aluno', S.aluno);
  S.qtd = {}; (data||[]).forEach(q => { const k = S.qtd[q.materia] ||= { treino:0, prova:0 }; k[q.tipo]++; });
}

// Relógio da prova
setInterval(() => {
  if (!S.prova || S.prova.resultado) return;
  const r = document.getElementById('relogio'); if (!r) return;
  const falta = Math.max(0, new Date(S.prova.ate) - new Date());
  r.textContent = `${Math.floor(falta/6e4)}:${String(Math.floor(falta%6e4/1e3)).padStart(2,'0')}`;
  if (falta === 0 && !S.prova.auto){ S.prova.auto = true; acoes.enviarProva(); }
}, 1000);

// ---------------- INÍCIO ----------------
async function iniciarSessao(session){
  S.user = session?.user || null;
  if (!S.user){ S.perfil = null; render(); return; }
  const { data: perfis } = await sb.from('perfis').select('*');
  const data = (perfis || []).find(p => p.user_id === S.user.id);
  if (!data){ $app.innerHTML = `<div id="login" class="card"><h2>Quase lá</h2><p class="mut">Seu login funciona, mas ainda não foi cadastrado no app. Fala com o pai.</p><button class="btn sec" data-a="sair">Sair</button></div>`; return; }
  S.perfil = data;
  S.alunos = (perfis || []).filter(p => p.papel === 'aluno').sort((a, b) => a.nome.localeCompare(b.nome));
  if (data.papel === 'aluno') S.aluno = data.user_id;
  else { let salvo = null; try { salvo = localStorage.getItem('aluno'); } catch {} S.aluno = S.alunos.some(a => a.user_id === salvo) ? salvo : S.alunos[0]?.user_id; }
  await carregar();
  render();
}
sb.auth.onAuthStateChange((_ev, session) => {
  const novo = session?.user?.id || null;
  if (novo === (S.user?.id || null) && S.perfil !== undefined && _ev !== 'INITIAL_SESSION') return;
  setTimeout(() => iniciarSessao(session), 0);
});
</script>
