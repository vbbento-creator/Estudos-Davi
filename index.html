<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Estudos do Davi · P2</title>
<style>
:root{--bg:#0f1420;--card:#182032;--card2:#1f2940;--txt:#e8ecf4;--mut:#8f9bb3;--ac:#ff5fa2;--ok:#3ddc97;--warn:#ffc04d;--bad:#ff6b6b;--line:#2a3550}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:80px}
header{padding:16px 16px 8px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px;margin:0}
header small{color:var(--mut)}
main{padding:0 12px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#0b0f18;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;border:0;color:var(--mut);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px}
nav button span{font-size:22px}
nav button.on{color:var(--ac)}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0}
.card h2{font-size:17px;margin:0 0 8px}
.card h3{font-size:15px;margin:10px 0 6px}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--txt)}
.btn.ok{background:var(--ok);color:#06281a}
.btn:disabled{opacity:.45}
input,select,textarea{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;width:100%}
textarea{min-height:70px;resize:vertical}
label.ck{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer}
label.ck input{width:22px;height:22px;accent-color:var(--ok)}
.bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--card2);color:var(--mut)}
.tag.hoje{background:var(--ac);color:#fff}
.tag.ok{background:#164d37;color:var(--ok)}
.dom{display:flex;gap:6px}
.dom button{flex:1;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 0;font-weight:700}
.dom button.on{background:var(--ac);border-color:var(--ac)}
.topico{border-top:1px solid var(--line);padding:10px 0}
.alt{display:block;width:100%;text-align:left;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:12px;margin:6px 0;font-size:15px}
.alt.certa{border-color:var(--ok);background:#163d2e}
.alt.errada{border-color:var(--bad);background:#4a1f25}
.alt.sel{border-color:var(--ac)}
.nivel{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.nivel b{font-size:22px}
.big{font-size:28px;font-weight:800}
.dia{border-left:3px solid var(--line);padding-left:10px;margin:10px 0}
.dia.hoje{border-color:var(--ac)}
.dia.passado{opacity:.55}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .card{width:100%;max-width:420px}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--card2);padding:10px 16px;border-radius:10px;z-index:20;box-shadow:0 4px 20px #0008}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
details summary{cursor:pointer;color:var(--mut)}
#login{max-width:380px;margin:12vh auto;padding:0 16px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://ykwcicxnqdvopkykwxzc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_aPmFxy7JzuJCRWdWurQPsw_fzW58nNX';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------------- CONTEÚDO DA P2 ----------------
const MATERIAS = [
  { id:'portugues', nome:'Língua Portuguesa', emoji:'📝', prova:'2026-11-23', topicos:['Crase','Homônimos e parônimos','Leitura e interpretação textual'] },
  { id:'ingles', nome:'Inglês', emoji:'🇬🇧', prova:'2026-11-23', topicos:['Text comprehension','Relative pronouns: who, which and whose','Question tag'] },
  { id:'fisica', nome:'Física', emoji:'🌌', prova:'2026-11-24', topicos:['Módulo 10: Constelações','Módulo 11: Evolução estelar'] },
  { id:'biologia', nome:'Biologia', emoji:'🌿', prova:'2026-11-24', topicos:['16.1 Modificações na estrutura dos ecossistemas','16.2 Poluição'] },
  { id:'redacao', nome:'Redação', emoji:'✍️', prova:'2026-11-25', topicos:['Artigo de opinião','Livro: O Quarto de Despejo'] },
  { id:'espanhol', nome:'Espanhol', emoji:'🇪🇸', prova:'2026-11-25', topicos:['Variantes linguísticas','Aspectos culturales: Cuba','Comprensión lectora'] },
  { id:'matematica', nome:'Matemática', emoji:'📐', prova:'2026-11-26', topicos:['Trigonometria no triângulo retângulo','Razões trigonométricas','Ângulos notáveis','Situações-problema: trigonometria no triângulo retângulo','Situações-problema: razões trigonométricas','Situações-problema: ângulos notáveis'] },
  { id:'quimica', nome:'Química', emoji:'⚗️', prova:'2026-11-26', topicos:['Química orgânica (introdução)','Classificação geral de cadeia','Classificação geral do carbono'] },
  { id:'geografia', nome:'Geografia', emoji:'🗾', prova:'2026-11-27', topicos:['Japão: localização, fatores naturais, população e economia','Antártida: localização e Tratado da Antártida'] },
  { id:'historia', nome:'História', emoji:'📜', prova:'2026-11-27', topicos:['Módulo 13: Brasil, a encruzilhada da ditadura','Nova República e Constituição de 1988','A conquista do protagonismo feminino','Questão indígena e questão do "campo negro"','Transformações do capitalismo na América Latina e no Brasil','Nova República e Neoliberalismo'] },
  { id:'arte', nome:'Arte', emoji:'🎨', prova:'2026-12-01', topicos:['Ciberarte','Bioarte','A história da arte'] },
  { id:'musica', nome:'Música', emoji:'🎵', prova:'2026-12-01', topicos:['Simbologia musical (p.174)','Figuras de duração (p.174)','Barras de compasso: simples e dupla (p.174-175)','Ligadura e ponto de aumento (p.175)','Sinais de repetição: Da Capo e Ritornelo (p.176)','Sinais de intensidade (p.176)','Pulso e compasso: binário, ternário, quaternário (p.177-178)','Clave e suas finalidades (p.179)'] },
];
const MAT = Object.fromEntries(MATERIAS.map(m => [m.id, m]));

const CRONO = [
  { d:'2026-11-18', t:'Quarta', itens:['Português: crase, homônimos e parônimos','Inglês: relative pronouns e question tag','📖 Livro: 1º sexto'] },
  { d:'2026-11-19', t:'Quinta 🎯 META GTA até 22h', itens:['Física: constelações e evolução estelar','Biologia: módulo 16','📖 Livro: 2º sexto (curto)','Treinos das 4 matérias (70%+)','Prova valendo supervisionada (80%+)'] },
  { d:'2026-11-20', t:'Sexta (feriado)', itens:['Matemática: razões trigonométricas + decorar 30°, 45°, 60°','📖 Livro: 3º sexto (de manhã)'] },
  { d:'2026-11-21', t:'Sábado', itens:['Matemática: exercícios de triângulo retângulo','História: ditadura e Nova República (leitura)','📖 Livro: 4º sexto'] },
  { d:'2026-11-22', t:'Domingo (GTA até 18h)', itens:['Revisão Português','Revisão Inglês','📖 Livro: 5º sexto (de manhã)','Dormir cedo'] },
  { d:'2026-11-23', t:'Segunda · ✏️ Português e Inglês', itens:['Revisão Física','Revisão Biologia','📖 Livro: 6º sexto — FIM 🏁'] },
  { d:'2026-11-24', t:'Terça · ✏️ Física e Biologia', itens:['Redação: escrever 1 artigo de opinião usando o livro','Espanhol: variantes, Cuba, leitura'] },
  { d:'2026-11-25', t:'Quarta · ✏️ Redação e Espanhol', itens:['Matemática: situações-problema','Química: classificação de cadeias e do carbono'] },
  { d:'2026-11-26', t:'Quinta · ✏️ Matemática e Química', itens:['Geografia: Japão e Antártida','Revisão História'] },
  { d:'2026-11-27', t:'Sexta · ✏️ Geografia e História', itens:['Folga merecida 😎'] },
  { d:'2026-11-28', t:'Sábado', itens:['Arte: ciberarte, bioarte, história da arte'] },
  { d:'2026-11-29', t:'Domingo', itens:['Música: figuras, compassos, repetição, claves (p.174-179)'] },
  { d:'2026-11-30', t:'Segunda', itens:['Revisão Arte','Revisão Música'] },
  { d:'2026-12-01', t:'Terça · ✏️ Arte e Música', itens:['🏁 Acabou! Agora é esperar as notas'] },
];

// ---------------- RECOMPENSAS ----------------
const PRAZO_GTA = new Date('2026-11-19T22:00:00-03:00');
const META_MATS = ['portugues','ingles','fisica','biologia'];
const HORAS = { bronze:5, prata:9, ouro:14 };
const P2_MATS = MATERIAS.map(m => m.id);

// ---------------- ESTADO ----------------
const S = { user:null, perfil:null, aba:'hoje', prog:{}, tent:[], lib:{}, notas:{}, gta:[], quiz:null, prova:null, aberta:null };
const $app = document.getElementById('app');
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hojeISO = () => new Date().toLocaleDateString('sv-SE', { timeZone:'America/Sao_Paulo' });
const fmtData = iso => new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'2-digit' });
const ehResp = () => S.perfil?.papel === 'responsavel';
const chT = (m, i) => `${m}:${i}`;
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.append(t); setTimeout(()=>t.remove(),2600); }

// ---------------- DADOS ----------------
async function carregar(){
  const [p, t, l, n, g] = await Promise.all([
    sb.from('progresso').select('*'),
    sb.from('tentativas').select('id,materia,tipo,acertos,total,pct,criado').order('criado', { ascending:false }),
    sb.from('liberacoes').select('*'),
    sb.from('notas_p2').select('*'),
    sb.from('uso_gta').select('*').order('dia'),
  ]);
  S.prog = Object.fromEntries((p.data||[]).map(r => [r.chave, r]));
  S.tent = t.data || [];
  S.lib = Object.fromEntries((l.data||[]).map(r => [r.materia, r]));
  S.notas = Object.fromEntries((n.data||[]).map(r => [r.materia, r.nota]));
  S.gta = g.data || [];
}

async function salvar(chave, campos){
  const atual = S.prog[chave] || { chave };
  const novo = { ...atual, ...campos, chave, atualizado:new Date().toISOString() };
  if ('estudou' in campos || 'exercicios' in campos){
    const ok = novo.estudou && novo.exercicios;
    novo.concluido_em = ok ? (atual.concluido_em || new Date().toISOString()) : null;
  }
  S.prog[chave] = novo;
  const { error } = await sb.from('progresso').upsert(novo);
  if (error) toast('Erro ao salvar: ' + error.message);
}

// ---------------- CÁLCULOS ----------------
function progMat(mid){
  const m = MAT[mid]; let ok = 0;
  m.topicos.forEach((_, i) => { const p = S.prog[chT(mid,i)]; if (p?.estudou && p?.exercicios) ok++; });
  return { ok, total:m.topicos.length };
}
function melhor(mid, tipo, ateData){
  return S.tent.filter(t => t.materia===mid && t.tipo===tipo && (!ateData || new Date(t.criado) <= ateData) && (tipo!=='treino' || t.total>=5))
    .reduce((mx, t) => Math.max(mx, Number(t.pct)), -1);
}
function calcGTA(){
  const bronzeDet = META_MATS.map(mid => {
    const m = MAT[mid];
    const ok = m.topicos.every((_, i) => { const p = S.prog[chT(mid,i)]; return p?.concluido_em && new Date(p.concluido_em) <= PRAZO_GTA; });
    return { mid, ok };
  });
  const bronze = bronzeDet.every(x => x.ok);
  const prataDet = META_MATS.map(mid => ({ mid, v:melhor(mid,'treino',PRAZO_GTA) }));
  const prata = bronze && prataDet.every(x => x.v >= 70);
  const ouroDet = META_MATS.map(mid => ({ mid, v:melhor(mid,'prova',PRAZO_GTA) }));
  const ouro = prata && ouroDet.filter(x => x.v >= 80).length >= 3;
  const horas = ouro ? HORAS.ouro : prata ? HORAS.prata : bronze ? HORAS.bronze : 0;
  const usadas = S.gta.reduce((s, r) => s + Number(r.horas), 0);
  return { bronze, prata, ouro, bronzeDet, prataDet, ouroDet, horas, usadas, saldo:horas - usadas };
}
function calcDinheiro(){
  const linhas = P2_MATS.map(mid => { const n = S.notas[mid]; const v = (n != null && n >= 8) ? 7 : 0; return { mid, n, v }; });
  const todas = linhas.every(l => l.n != null);
  const bonus = todas && linhas.every(l => l.n >= 7) ? 9 : 0;
  return { linhas, bonus, total:linhas.reduce((s,l) => s + l.v, 0) + bonus, todas };
}

// ---------------- TELAS ----------------
function render(){
  if (!S.user) return telaLogin();
  const abas = [['hoje','🏠','Hoje'],['materias','📚','Matérias'],['treino','🎯','Treino'],['premios','🎮','Prêmios']];
  if (ehResp()) abas.push(['painel','🛡️','Painel']);
  let corpo = '';
  if (S.prova) corpo = telaProva();
  else if (S.quiz) corpo = telaQuiz();
  else corpo = ({ hoje:telaHoje, materias:telaMaterias, treino:telaTreino, premios:telaPremios, painel:telaPainel })[S.aba]();
  $app.innerHTML = `
    <header><div><h1>📘 Estudos · P2</h1><small>${h(S.perfil?.nome || '')}</small></div>
    <button class="btn sec" data-a="sair">Sair</button></header>
    <main>${corpo}</main>
    ${S.quiz || S.prova ? '' : `<nav>${abas.map(([id,ic,nm]) => `<button data-a="aba" data-v="${id}" class="${S.aba===id?'on':''}"><span>${ic}</span>${nm}</button>`).join('')}</nav>`}`;
}

function telaLogin(){
  $app.innerHTML = `<div id="login" class="card">
    <h2>📘 Estudos · P2</h2><p class="mut">Entre com seu e-mail e senha.</p>
    <input id="lemail" type="email" placeholder="e-mail" autocomplete="username"><br><br>
    <input id="lsenha" type="password" placeholder="senha" autocomplete="current-password"><br><br>
    <button class="btn" data-a="entrar" style="width:100%">Entrar</button></div>`;
}

function proximaProva(){
  const hoje = hojeISO();
  const futuras = MATERIAS.filter(m => m.prova >= hoje).sort((a,b) => a.prova.localeCompare(b.prova));
  if (!futuras.length) return null;
  const d = futuras[0].prova;
  const dias = Math.round((new Date(d+'T12:00:00') - new Date(hoje+'T12:00:00')) / 864e5);
  return { d, dias, mats:futuras.filter(m => m.prova===d) };
}

function blocoDia(dia, destaque){
  const hoje = hojeISO();
  const cls = dia.d===hoje ? 'hoje' : dia.d < hoje ? 'passado' : '';
  return `<div class="dia ${cls}"><div class="row sp"><b>${h(dia.t)}</b><span class="tag ${dia.d===hoje?'hoje':''}">${fmtData(dia.d)}</span></div>
    ${dia.itens.map((it, i) => { const k=`crono:${dia.d}:${i}`; return `<label class="ck"><input type="checkbox" data-a="crono" data-k="${k}" ${S.prog[k]?.feito?'checked':''}> ${h(it)}</label>`; }).join('')}</div>`;
}

function telaHoje(){
  const hoje = hojeISO();
  const pp = proximaProva();
  const g = calcGTA();
  const diaHoje = CRONO.find(d => d.d===hoje) || CRONO.find(d => d.d > hoje);
  const faltaGta = PRAZO_GTA - new Date();
  let gtaTxt = '';
  if (faltaGta > 0){
    const hh = Math.floor(faltaGta/36e5), mm = Math.floor(faltaGta%36e5/6e4);
    const prox = !g.bronze ? 'Bronze (5h): checklist completo nas 4 matérias' : !g.prata ? 'Prata (9h): treino 70%+ nas 4' : !g.ouro ? 'Ouro (14h): prova valendo 80%+ em 3 das 4' : 'Você já está no OURO 🥇';
    gtaTxt = `<div class="card"><h2>🎮 Meta GTA</h2><div class="row sp"><span>Faltam <b>${hh}h${String(mm).padStart(2,'0')}</b></span><span class="big">${g.horas}h</span></div><p class="mut">Próximo: ${h(prox)}</p></div>`;
  }
  return `
    ${pp ? `<div class="card"><h2>⏳ Próxima prova</h2><div class="big">${pp.dias===0?'HOJE':pp.dias===1?'Amanhã':pp.dias+' dias'}</div><p class="mut">${fmtData(pp.d)} · ${pp.mats.map(m=>m.emoji+' '+h(m.nome)).join(' + ')}</p></div>` : ''}
    ${gtaTxt}
    <div class="card"><h2>📅 ${diaHoje?.d===hoje ? 'Plano de hoje' : 'Próximo dia do plano'}</h2>${diaHoje ? blocoDia(diaHoje) : '<p class="mut">Cronograma encerrado 🎉</p>'}</div>
    <div class="card"><details><summary>Ver cronograma completo</summary>${CRONO.map(d => blocoDia(d)).join('')}</details></div>`;
}

function telaMaterias(){
  const hoje = hojeISO();
  return MATERIAS.map(m => {
    const p = progMat(m.id); const aberta = S.aberta === m.id;
    const feita = m.prova < hoje;
    let corpo = '';
    if (aberta){
      corpo = m.topicos.map((t, i) => {
        const k = chT(m.id, i); const r = S.prog[k] || {};
        return `<div class="topico"><b>${h(t)}</b>
          <label class="ck"><input type="checkbox" data-a="ck" data-k="${k}" data-f="estudou" ${r.estudou?'checked':''}> Estudei</label>
          <label class="ck"><input type="checkbox" data-a="ck" data-k="${k}" data-f="exercicios" ${r.exercicios?'checked':''}> Fiz os exercícios</label>
          <div class="mut">Quanto eu domino? (1 = nada · 5 = explico pra alguém)</div>
          <div class="dom">${[1,2,3,4,5].map(n => `<button data-a="dom" data-k="${k}" data-v="${n}" class="${r.dominio===n?'on':''}">${n}</button>`).join('')}</div>
          <textarea data-a="duv" data-k="${k}" placeholder="O que não entendi (opcional)">${h(r.duvida)}</textarea></div>`;
      }).join('');
      if (m.id === 'redacao'){
        const r = S.prog['redacao:texto'] || {};
        corpo += `<div class="topico"><b>✍️ Minha redação (cole aqui para correção)</b><textarea data-a="duv" data-k="redacao:texto" style="min-height:180px" placeholder="Cole aqui seu artigo de opinião">${h(r.duvida)}</textarea></div>`;
      }
    }
    return `<div class="card"><div class="row sp" data-a="abrir" data-v="${m.id}" style="cursor:pointer">
      <div><b>${m.emoji} ${h(m.nome)}</b><div class="mut">Prova ${fmtData(m.prova)} ${feita?'· já foi':''}</div></div>
      <span class="tag ${p.ok===p.total?'ok':''}">${p.ok}/${p.total}</span></div>
      <div class="bar"><i style="width:${100*p.ok/p.total}%"></i></div>${corpo}</div>`;
  }).join('');
}

function telaTreino(){
  const lista = MATERIAS.filter(m => m.id !== 'redacao');
  const agora = new Date();
  return `<div class="card"><h2>🎯 Me testa</h2><p class="mut">Treino livre: 10 questões sorteadas, com gabarito comentado. Pode refazer à vontade. Vale para a meta com 70%+.</p>
    <select id="tmat">${lista.map(m => `<option value="${m.id}">${m.emoji} ${h(m.nome)}</option>`).join('')}</select><br><br>
    <button class="btn" data-a="treinar" style="width:100%">Começar treino</button></div>
    <div class="card"><h2>🏛️ Prova valendo</h2><p class="mut">Só com o pai ou a mãe do lado. Abre com a senha de um deles, tem tempo e só pode ser feita uma vez.</p>
    ${lista.map(m => {
      const l = S.lib[m.id]; const aberta = l && new Date(l.ate) > agora;
      const feita = melhor(m.id, 'prova');
      return `<div class="topico row sp"><span>${m.emoji} ${h(m.nome)} ${feita>=0?`<span class="tag ok">${feita}%</span>`:''}</span>
        ${aberta ? `<button class="btn ok" data-a="iniciarProva" data-v="${m.id}">Começar</button>` : `<button class="btn sec" data-a="liberar" data-v="${m.id}">Liberar</button>`}</div>`;
    }).join('')}</div>
    <div class="card"><h2>📈 Últimos resultados</h2>${S.tent.slice(0,10).map(t => `<div class="row sp topico"><span>${MAT[t.materia]?.emoji||''} ${h(MAT[t.materia]?.nome||t.materia)} · ${t.tipo==='prova'?'🏛️ prova':'🎯 treino'}</span><b>${t.pct}%</b></div>`).join('') || '<p class="mut">Nada ainda.</p>'}</div>`;
}

function telaQuiz(){
  const q = S.quiz; const it = q.lista[q.i];
  if (!it){
    return `<div class="card"><h2>Resultado</h2><div class="big">${q.acertos}/${q.lista.length} · ${Math.round(100*q.acertos/q.lista.length)}%</div>
      <p class="mut">${q.acertos/q.lista.length >= .7 ? 'Mandou bem! 🔥' : 'Bora revisar e tentar de novo 💪'}</p>
      <button class="btn" data-a="fecharQuiz" style="width:100%">Voltar</button></div>`;
  }
  return `<div class="card"><div class="row sp"><span class="mut">${MAT[q.materia].emoji} ${h(MAT[q.materia].nome)}</span><span class="tag">${q.i+1}/${q.lista.length}</span></div>
    ${it.topico ? `<div class="mut">${h(it.topico)}</div>` : ''}
    <h3>${h(it.enunciado)}</h3>
    ${it.alternativas.map((a, i) => {
      let c = ''; if (q.resp != null){ if (i===it.correta) c='certa'; else if (i===q.resp) c='errada'; }
      return `<button class="alt ${c}" data-a="resp" data-v="${i}" ${q.resp!=null?'disabled':''}>${'ABCDE'[i]}) ${h(a)}</button>`;
    }).join('')}
    ${q.resp != null ? `<p>${q.resp===it.correta?'✅ Certo!':'❌ Errou.'} ${h(it.explicacao||'')}</p><button class="btn" data-a="proxima" style="width:100%">Próxima</button>` : ''}
    <br><button class="btn sec" data-a="fecharQuiz">Sair do treino</button></div>`;
}

function telaProva(){
  const p = S.prova;
  if (p.resultado){
    const r = p.resultado;
    return `<div class="card"><h2>🏛️ Resultado da prova</h2><div class="big">${r.acertos}/${r.total} · ${r.pct}%</div></div>
      ${r.detalhes.map((d, n) => `<div class="card"><b>${n+1}. ${h(d.enunciado)}</b>
        ${d.alternativas.map((a, i) => `<div class="alt ${i===d.correta?'certa':i===d.resposta?'errada':''}">${'ABCDE'[i]}) ${h(a)}</div>`).join('')}
        <p class="mut">${h(d.explicacao||'')}</p></div>`).join('')}
      <button class="btn" data-a="fecharProva" style="width:100%">Voltar</button>`;
  }
  const falta = Math.max(0, new Date(p.ate) - new Date());
  const mm = Math.floor(falta/6e4), ss = Math.floor(falta%6e4/1e3);
  return `<div class="card"><div class="row sp"><b>🏛️ ${h(MAT[p.materia].nome)}</b><span class="big" id="relogio">${mm}:${String(ss).padStart(2,'0')}</span></div>
    <p class="mut">Responda tudo e envie antes do tempo acabar. Sem consulta! 👀</p></div>
    ${p.lista.map((q, n) => `<div class="card"><b>${n+1}. ${h(q.enunciado)}</b>
      ${q.alternativas.map((a, i) => `<button class="alt ${p.resp[q.id]===i?'sel':''}" data-a="marcar" data-q="${h(q.id)}" data-v="${i}">${'ABCDE'[i]}) ${h(a)}</button>`).join('')}</div>`).join('')}
    <button class="btn" data-a="enviarProva" style="width:100%">Enviar prova (${Object.keys(p.resp).length}/${p.lista.length} respondidas)</button>`;
}

function telaPremios(){
  const g = calcGTA(); const d = calcDinheiro();
  const nv = (ok, ic, nome, hrs, det) => `<div class="nivel"><b>${ok?ic:'⬜'}</b><div style="flex:1"><b>${nome} · ${hrs}h</b><div class="mut">${det}</div></div></div>`;
  const nm = mid => MAT[mid].emoji;
  return `<div class="card"><h2>🎮 GTA no fim de semana</h2>
    <div class="row sp"><span class="mut">Prazo: quinta 19/11 às 22h</span><span class="big">${g.horas}h</span></div>
    ${nv(g.bronze,'🥉','Bronze',5,'Checklist completo: '+g.bronzeDet.map(x=>nm(x.mid)+(x.ok?'✅':'⏳')).join(' '))}
    ${nv(g.prata,'🥈','Prata',9,'Treino 70%+: '+g.prataDet.map(x=>nm(x.mid)+(x.v>=0?x.v+'%':'—')).join(' '))}
    ${nv(g.ouro,'🥇','Ouro',14,'Prova 80%+ em 3 das 4: '+g.ouroDet.map(x=>nm(x.mid)+(x.v>=0?x.v+'%':'—')).join(' '))}
    <div class="nivel"><b>⏱️</b><div style="flex:1">Usadas: <b>${g.usadas}h</b> · Saldo: <b>${Math.max(0,g.saldo)}h</b><div class="mut">Sexta a domingo · máx. 6h por dia · domingo até 18h</div></div></div></div>
    <div class="card"><h2>💰 Notas da P2</h2><p class="mut">R$ 7 por matéria com nota 8+ · bônus de R$ 9 se nenhuma ficar abaixo de 7</p>
    <table>${d.linhas.map(l => `<tr><td>${MAT[l.mid].emoji} ${h(MAT[l.mid].nome)}</td><td>${l.n ?? '—'}</td><td>${l.v?'R$ '+l.v:''}</td></tr>`).join('')}
    <tr><td>⭐ Bônus nenhuma abaixo de 7</td><td></td><td>${d.bonus?'R$ 9':d.todas?'—':'aguardando'}</td></tr></table>
    <div class="row sp" style="margin-top:8px"><b>Total</b><span class="big">R$ ${d.total}</span></div></div>`;
}

function telaPainel(){
  const linhas = MATERIAS.map(m => {
    const p = progMat(m.id);
    const doms = m.topicos.map((_, i) => S.prog[chT(m.id,i)]?.dominio).filter(Boolean);
    const media = doms.length ? (doms.reduce((a,b)=>a+b,0)/doms.length).toFixed(1) : '—';
    const tr = melhor(m.id,'treino'), pv = melhor(m.id,'prova');
    return `<tr><td>${m.emoji} ${h(m.nome)}</td><td>${p.ok}/${p.total}</td><td>${media}</td><td>${tr>=0?tr+'%':'—'}</td><td>${pv>=0?pv+'%':'—'}</td></tr>`;
  }).join('');
  const duvidas = Object.values(S.prog).filter(r => r.duvida && r.chave !== 'redacao:texto' && !r.chave.startsWith('crono:')).map(r => {
    const [mid, i] = r.chave.split(':'); return `<div class="topico"><b>${MAT[mid]?.emoji||''} ${h(MAT[mid]?.topicos[i]||r.chave)}</b><div class="mut">${h(r.duvida)}</div></div>`;
  }).join('');
  return `<div class="card"><h2>🛡️ Visão geral</h2><table><tr><th>Matéria</th><th>Check</th><th>Domínio</th><th>Treino</th><th>Prova</th></tr>${linhas}</table></div>
    <div class="card"><h2>❓ Dúvidas que ele anotou</h2>${duvidas || '<p class="mut">Nenhuma ainda.</p>'}</div>
    <div class="card"><h2>📋 Relatório para o Claude</h2><p class="mut">Copia um resumo do progresso para colar na conversa e pedir questões no nível dele.</p>
      <button class="btn sec" data-a="relatorio" style="width:100%">Copiar relatório</button></div>
    <div class="card"><h2>⏱️ Registrar uso do GTA</h2><div class="row"><input id="gdia" type="date" value="${hojeISO()}" style="flex:2"><input id="ghoras" type="number" step="0.5" min="0.5" placeholder="horas" style="flex:1"></div><br>
      <button class="btn" data-a="regGta" style="width:100%">Registrar</button>
      ${S.gta.map(r => `<div class="row sp topico"><span>${fmtData(r.dia)} · ${r.horas}h</span><button class="btn sec" data-a="delGta" data-v="${r.id}">🗑️</button></div>`).join('')}</div>
    <div class="card"><h2>💰 Lançar notas da P2</h2><table>${P2_MATS.map(mid => `<tr><td>${MAT[mid].emoji} ${h(MAT[mid].nome)}</td><td style="width:90px"><input data-a="nota" data-v="${mid}" type="number" step="0.1" min="0" max="10" value="${S.notas[mid] ?? ''}"></td></tr>`).join('')}</table></div>
    <div class="card"><h2>📥 Importar questões</h2><p class="mut">Cole aqui o bloco que o Claude gerar e toque em Importar.</p>
      <textarea id="imp" style="min-height:140px" placeholder='[{"id":"...","materia":"portugues", ...}]'></textarea><br><br>
      <button class="btn" data-a="importar" style="width:100%">Importar</button></div>`;
}

// ---------------- AÇÕES ----------------
async function liberarProva(mid){
  const min = 30;
  if (ehResp()){
    await gravarLiberacao(sb, mid, min);
    return;
  }
  const html = `<div class="modal" id="mlib"><div class="card"><h2>🔐 Liberar prova de ${h(MAT[mid].nome)}</h2>
    <p class="mut">Pai ou mãe: entre com o seu login. Tempo de prova: ${min} minutos.</p>
    <input id="remail" type="email" placeholder="e-mail do responsável"><br><br><input id="rsenha" type="password" placeholder="senha"><br><br>
    <div class="row"><button class="btn sec" id="rcanc">Cancelar</button><button class="btn" id="rok" style="flex:1">Liberar</button></div></div></div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  const fechar = () => document.getElementById('mlib')?.remove();
  document.getElementById('rcanc').onclick = fechar;
  document.getElementById('rok').onclick = async () => {
    const tmp = createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:false, autoRefreshToken:false, storageKey:'tmp-resp' } });
    const { data, error } = await tmp.auth.signInWithPassword({ email:document.getElementById('remail').value.trim(), password:document.getElementById('rsenha').value });
    if (error){ toast('Login inválido'); return; }
    const { data: pf } = await tmp.from('perfis').select('papel').eq('user_id', data.user.id).maybeSingle();
    if (pf?.papel !== 'responsavel'){ toast('Esse login não é de responsável 😏'); await tmp.auth.signOut(); return; }
    await gravarLiberacao(tmp, mid, min, data.user.id);
    await tmp.auth.signOut();
    fechar();
  };
}
async function gravarLiberacao(cli, mid, min, uid){
  const ate = new Date(Date.now() + min*6e4).toISOString();
  const { error } = await cli.from('liberacoes').upsert({ materia:mid, ate, liberada_por: uid || S.user.id });
  if (error){ toast('Erro: ' + error.message); return; }
  S.lib[mid] = { materia:mid, ate };
  toast('Prova liberada por ' + min + ' minutos');
  render();
}

async function iniciarProva(mid){
  const { data, error } = await sb.from('questoes').select('id,enunciado,alternativas,topico').eq('materia', mid).eq('tipo','prova');
  if (error || !data?.length){ toast('Ainda não há questões de prova para essa matéria'); return; }
  S.prova = { materia:mid, ate:S.lib[mid].ate, lista:data.sort(() => Math.random()-.5), resp:{} };
  render();
}

async function treinar(mid){
  const { data: qs, error } = await sb.from('questoes').select('id,enunciado,alternativas,topico').eq('materia', mid).eq('tipo','treino');
  if (error || !qs?.length){ toast('Ainda sem questões de treino — cobra o pai pelas fotos 😅'); return; }
  const { data: gb } = await sb.from('gabarito').select('*').in('questao_id', qs.map(q => q.id));
  const G = Object.fromEntries((gb||[]).map(g => [g.questao_id, g]));
  const lista = qs.sort(() => Math.random()-.5).slice(0,10).map(q => ({ ...q, correta:G[q.id]?.correta, explicacao:G[q.id]?.explicacao }));
  S.quiz = { materia:mid, lista, i:0, acertos:0, resp:null };
  render();
}

function relatorio(){
  const linhas = MATERIAS.map(m => {
    const tops = m.topicos.map((t, i) => { const r = S.prog[chT(m.id,i)] || {};
      return `  - ${t}: ${r.estudou?'estudou':'não estudou'}, ${r.exercicios?'fez exercícios':'sem exercícios'}, domínio ${r.dominio||'?'}/5${r.duvida?`, dúvida: "${r.duvida}"`:''}`; }).join('\n');
    const tr = melhor(m.id,'treino'), pv = melhor(m.id,'prova');
    return `${m.nome} (prova ${m.prova}) — melhor treino: ${tr>=0?tr+'%':'—'} · prova valendo: ${pv>=0?pv+'%':'—'}\n${tops}`;
  }).join('\n\n');
  const red = S.prog['redacao:texto']?.duvida;
  return `RELATÓRIO DE ESTUDOS — ${new Date().toLocaleString('pt-BR')}\n\n${linhas}${red ? `\n\nREDAÇÃO PARA CORRIGIR:\n${red}` : ''}`;
}

$app.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  if (a === 'entrar'){
    const { error } = await sb.auth.signInWithPassword({ email:document.getElementById('lemail').value.trim(), password:document.getElementById('lsenha').value });
    if (error) toast('E-mail ou senha errados'); return;
  }
  if (a === 'sair'){ await sb.auth.signOut(); return; }
  if (a === 'aba'){ S.aba = v; render(); window.scrollTo(0,0); return; }
  if (a === 'abrir'){ S.aberta = S.aberta === v ? null : v; render(); return; }
  if (a === 'dom'){ await salvar(el.dataset.k, { dominio:Number(v) }); render(); return; }
  if (a === 'treinar'){ await treinar(document.getElementById('tmat').value); return; }
  if (a === 'resp'){ const q = S.quiz; q.resp = Number(v); if (q.resp === q.lista[q.i].correta) q.acertos++; render(); return; }
  if (a === 'proxima'){
    const q = S.quiz; q.i++; q.resp = null;
    if (q.i >= q.lista.length){
      const pct = Math.round(1000*q.acertos/q.lista.length)/10;
      const { data } = await sb.from('tentativas').insert({ materia:q.materia, tipo:'treino', acertos:q.acertos, total:q.lista.length, pct }).select().single();
      if (data) S.tent.unshift(data);
    }
    render(); window.scrollTo(0,0); return;
  }
  if (a === 'fecharQuiz'){ S.quiz = null; render(); return; }
  if (a === 'liberar'){ await liberarProva(v); return; }
  if (a === 'iniciarProva'){ await iniciarProva(v); return; }
  if (a === 'marcar'){ S.prova.resp[el.dataset.q] = Number(v); render(); return; }
  if (a === 'enviarProva'){
    const p = S.prova;
    if (!p.auto && Object.keys(p.resp).length < p.lista.length && !confirmarEnvio()) return;
    const { data, error } = await sb.rpc('corrigir_prova', { p_materia:p.materia, p_respostas:p.resp });
    if (error){ toast(error.message); return; }
    p.resultado = data; await carregar(); render(); window.scrollTo(0,0); return;
  }
  if (a === 'fecharProva'){ S.prova = null; S.aba = 'treino'; render(); return; }
  if (a === 'relatorio'){ try { await navigator.clipboard.writeText(relatorio()); toast('Relatório copiado! Cola na conversa com o Claude.'); } catch { toast('Não consegui copiar'); } return; }
  if (a === 'regGta'){
    const horas = Number(document.getElementById('ghoras').value); const dia = document.getElementById('gdia').value;
    if (!horas || !dia) return;
    const { data, error } = await sb.from('uso_gta').insert({ dia, horas }).select().single();
    if (error){ toast(error.message); return; } S.gta.push(data); render(); return;
  }
  if (a === 'delGta'){ await sb.from('uso_gta').delete().eq('id', v); S.gta = S.gta.filter(r => String(r.id) !== v); render(); return; }
  if (a === 'importar'){
    let arr; try { arr = JSON.parse(document.getElementById('imp').value); } catch { toast('Bloco inválido — copie de novo do Claude'); return; }
    const qs = arr.map(q => ({ id:q.id, materia:q.materia, topico:q.topico || null, tipo:q.tipo, enunciado:q.enunciado, alternativas:q.alternativas }));
    const gb = arr.map(q => ({ questao_id:q.id, correta:q.correta, explicacao:q.explicacao || null }));
    const r1 = await sb.from('questoes').upsert(qs); if (r1.error){ toast(r1.error.message); return; }
    const r2 = await sb.from('gabarito').upsert(gb); if (r2.error){ toast(r2.error.message); return; }
    toast(arr.length + ' questões importadas ✅'); document.getElementById('imp').value = ''; return;
  }
});

// Ações de checkbox (precisam ver o estado novo)
$app.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.a === 'ck'){ await salvar(el.dataset.k, { [el.dataset.f]: el.checked }); render(); }
  if (el.dataset.a === 'crono'){ await salvar(el.dataset.k, { feito: el.checked }); }
  if (el.dataset.a === 'duv'){ await salvar(el.dataset.k, { duvida: el.value }); toast('Salvo'); }
  if (el.dataset.a === 'nota'){
    const n = el.value === '' ? null : Number(el.value);
    const { error } = n == null ? await sb.from('notas_p2').delete().eq('materia', el.dataset.v) : await sb.from('notas_p2').upsert({ materia:el.dataset.v, nota:n });
    if (error) toast(error.message); else { S.notas[el.dataset.v] = n; toast('Nota salva'); }
  }
});

function confirmarEnvio(){ return window.confirm('Tem questão sem resposta. Enviar mesmo assim?'); }

// Relógio da prova
setInterval(() => {
  if (!S.prova || S.prova.resultado) return;
  const r = document.getElementById('relogio'); if (!r) return;
  const falta = Math.max(0, new Date(S.prova.ate) - new Date());
  r.textContent = `${Math.floor(falta/6e4)}:${String(Math.floor(falta%6e4/1e3)).padStart(2,'0')}`;
  if (falta === 0 && !S.prova.auto){ S.prova.auto = true; document.querySelector('[data-a="enviarProva"]')?.click(); }
}, 1000);

// ---------------- INÍCIO ----------------
async function iniciarSessao(session){
  S.user = session?.user || null;
  if (!S.user){ S.perfil = null; render(); return; }
  const { data } = await sb.from('perfis').select('*').eq('user_id', S.user.id).maybeSingle();
  if (!data){ $app.innerHTML = `<div id="login" class="card"><h2>Quase lá</h2><p class="mut">Seu login funciona, mas ainda não foi cadastrado no app. Fala com o pai.</p><button class="btn sec" data-a="sair">Sair</button></div>`; return; }
  S.perfil = data;
  await carregar();
  render();
}
sb.auth.onAuthStateChange((_ev, session) => {
  const novo = session?.user?.id || null;
  if (novo === (S.user?.id || null) && S.perfil !== undefined && _ev !== 'INITIAL_SESSION') return;
  setTimeout(() => iniciarSessao(session), 0);
});
</script>
