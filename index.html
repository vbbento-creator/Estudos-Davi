<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b5bf0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Estudos do Davi · P2</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--txt:#1d2433;--mut:#6b7489;--line:#e6e9f2;--ac:#5b5bf0;--ok:#1fa971;--okbg:#e3f6ee;--warn:#f59e0b;--bad:#e5484d;--badbg:#fdecec;--soft:#eef0fb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding-bottom:90px}
header{padding:18px 16px 6px;display:flex;justify-content:space-between;align-items:center;max-width:760px;margin:0 auto}
header h1{font-size:22px;margin:0}
header .sair{background:none;border:0;color:var(--mut);font-size:14px;text-decoration:underline;cursor:pointer}
main{padding:0 14px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 -4px 16px #1d24330d}
nav button{background:none;border:0;color:var(--mut);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 14px;border-radius:12px;cursor:pointer}
nav button span{font-size:22px}
nav button.on{color:var(--ac);background:var(--soft)}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #1d24330a}
.card h2{font-size:17px;margin:0 0 10px}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.btn{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:13px 16px;font-size:16px;font-weight:700;cursor:pointer;width:100%}
.btn.sec{background:var(--soft);color:var(--ac)}
.btn.ok{background:var(--ok)}
.btn.min{width:auto;padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.45}
input,select,textarea{background:#fff;color:var(--txt);border:1.5px solid var(--line);border-radius:12px;padding:11px;font-size:16px;width:100%;font-family:inherit}
textarea{min-height:70px;resize:vertical}
.bar{height:10px;background:var(--soft);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:var(--ok);transition:width .3s}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--mut)}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.hoje{background:var(--ac);color:#fff}
.hello{font-size:15px;color:var(--mut);margin:0 0 4px}
.hero{background:linear-gradient(135deg,#5b5bf0,#8b5cf6);color:#fff}
.hero .mut{color:#e4e2ff}
.big{font-size:30px;font-weight:800;line-height:1.1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.mcard{background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 10px #1d24330a;cursor:pointer;border-top:6px solid var(--c);display:flex;flex-direction:column;gap:6px}
.mcard .em{font-size:28px}
.mcard b{font-size:15px}
.mhead{border-radius:18px;padding:18px;color:#fff;background:var(--c);margin:12px 0}
.mhead .em{font-size:34px}
.voltar{background:none;border:0;color:var(--ac);font-weight:700;font-size:15px;padding:8px 0;cursor:pointer}
.topico{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #1d24330a}
.topico .tt{font-weight:700;margin-bottom:10px}
.pills{display:flex;gap:8px}
.pill{flex:1;border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 6px;font-size:15px;font-weight:700;color:var(--mut);cursor:pointer}
.pill.on{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.dom{display:flex;gap:6px;margin-top:6px}
.dom button{flex:1;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 0;font-size:22px;cursor:pointer;filter:grayscale(1);opacity:.6}
.dom button.on{filter:none;opacity:1;border-color:var(--ac);background:var(--soft)}
.lbl{font-size:13px;color:var(--mut);margin-top:12px}
details summary{cursor:pointer;color:var(--ac);font-weight:600;font-size:14px;margin-top:10px}
.alt{display:block;width:100%;text-align:left;background:#fff;color:var(--txt);border:2px solid var(--line);border-radius:14px;padding:13px;margin:8px 0;font-size:15px;cursor:pointer}
.alt.certa{border-color:var(--ok);background:var(--okbg)}
.alt.errada{border-color:var(--bad);background:var(--badbg)}
.alt.sel{border-color:var(--ac);background:var(--soft)}
.trilha{display:flex;gap:6px;margin:10px 0}
.trilha div{flex:1;text-align:center;padding:10px 4px;border-radius:14px;background:#ffffff26;font-size:13px;font-weight:700}
.trilha div.on{background:#fff;color:var(--ac)}
.trilha div span{display:block;font-size:22px}
.falta{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid #ffffff33;cursor:pointer}
.ck{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;border-top:1px solid var(--line)}
.ck:first-of-type{border-top:0}
.ck input{width:22px;height:22px;accent-color:var(--ok);flex:none}
.dia{margin:12px 0;padding-left:12px;border-left:4px solid var(--line)}
.dia.hoje{border-color:var(--ac)}
.dia.passado{opacity:.5}
.modal{position:fixed;inset:0;background:#1d243380;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .card{width:100%;max-width:420px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 18px;border-radius:12px;z-index:20;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.nivel{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.nivel b.ic{font-size:26px}
.enun{white-space:pre-line;font-size:16px;font-weight:600;margin:8px 0}
#login{max-width:380px;margin:12vh auto;padding:24px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://ykwcicxnqdvopkykwxzc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_aPmFxy7JzuJCRWdWurQPsw_fzW58nNX';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------------- CONTEÚDO DA P2 ----------------
const MATERIAS = [
  { id:'portugues', nome:'Língua Portuguesa', emoji:'📝', prova:'2026-11-23', topicos:['Crase','Homônimos e parônimos','Leitura e interpretação textual'] },
  { id:'ingles', nome:'Inglês', emoji:'🇬🇧', prova:'2026-11-23', topicos:['Text comprehension','Relative pronouns: who, which and whose','Question tag'] },
  { id:'fisica', nome:'Física', emoji:'🌌', prova:'2026-11-24', topicos:['Módulo 10: Constelações','Módulo 11: Evolução estelar'] },
  { id:'biologia', nome:'Biologia', emoji:'🌿', prova:'2026-11-24', topicos:['16.1 Modificações na estrutura dos ecossistemas','16.2 Poluição'] },
  { id:'redacao', nome:'Redação', emoji:'✍️', prova:'2026-11-25', topicos:['Artigo de opinião','Livro: O Quarto de Despejo'] },
  { id:'espanhol', nome:'Espanhol', emoji:'🇪🇸', prova:'2026-11-25', topicos:['Variantes linguísticas','Aspectos culturales: Cuba','Comprensión lectora'] },
  { id:'matematica', nome:'Matemática', emoji:'📐', prova:'2026-11-26', topicos:['Trigonometria no triângulo retângulo','Razões trigonométricas','Ângulos notáveis','Situações-problema: trigonometria no triângulo retângulo','Situações-problema: razões trigonométricas','Situações-problema: ângulos notáveis'] },
  { id:'quimica', nome:'Química', emoji:'⚗️', prova:'2026-11-26', topicos:['Química orgânica (introdução)','Classificação geral de cadeia','Classificação geral do carbono'] },
  { id:'geografia', nome:'Geografia', emoji:'🗾', prova:'2026-11-27', topicos:['Japão: localização, fatores naturais, população e economia','Antártida: localização e Tratado da Antártida'] },
  { id:'historia', nome:'História', emoji:'📜', prova:'2026-11-27', topicos:['Módulo 13: Brasil, a encruzilhada da ditadura','Nova República e Constituição de 1988','A conquista do protagonismo feminino','Questão indígena e questão do "campo negro"','Transformações do capitalismo na América Latina e no Brasil','Nova República e Neoliberalismo'] },
  { id:'arte', nome:'Arte', emoji:'🎨', prova:'2026-12-01', topicos:['Ciberarte','Bioarte','A história da arte'] },
  { id:'musica', nome:'Música', emoji:'🎵', prova:'2026-12-01', topicos:['Simbologia musical (p.174)','Figuras de duração (p.174)','Barras de compasso: simples e dupla (p.174-175)','Ligadura e ponto de aumento (p.175)','Sinais de repetição: Da Capo e Ritornelo (p.176)','Sinais de intensidade (p.176)','Pulso e compasso: binário, ternário, quaternário (p.177-178)','Clave e suas finalidades (p.179)'] },
];
const MAT = Object.fromEntries(MATERIAS.map(m => [m.id, m]));

const CRONO = [
  { d:'2026-11-18', t:'Quarta', itens:['Português: crase, homônimos e parônimos','Inglês: relative pronouns e question tag','📖 Livro: 1º sexto'] },
  { d:'2026-11-19', t:'Quinta 🎯 META GTA até 22h', itens:['Física: constelações e evolução estelar','Biologia: módulo 16','📖 Livro: 2º sexto (curto)','Treinos das 4 matérias (70%+)','Prova valendo supervisionada (80%+)'] },
  { d:'2026-11-20', t:'Sexta (feriado)', itens:['Matemática: razões trigonométricas + decorar 30°, 45°, 60°','📖 Livro: 3º sexto (de manhã)'] },
  { d:'2026-11-21', t:'Sábado', itens:['Matemática: exercícios de triângulo retângulo','História: ditadura e Nova República (leitura)','📖 Livro: 4º sexto'] },
  { d:'2026-11-22', t:'Domingo (GTA até 18h)', itens:['Revisão Português','Revisão Inglês','📖 Livro: 5º sexto (de manhã)','Dormir cedo'] },
  { d:'2026-11-23', t:'Segunda · ✏️ Português e Inglês', itens:['Revisão Física','Revisão Biologia','📖 Livro: 6º sexto — FIM 🏁'] },
  { d:'2026-11-24', t:'Terça · ✏️ Física e Biologia', itens:['Redação: escrever 1 artigo de opinião usando o livro','Espanhol: variantes, Cuba, leitura'] },
  { d:'2026-11-25', t:'Quarta · ✏️ Redação e Espanhol', itens:['Matemática: situações-problema','Química: classificação de cadeias e do carbono'] },
  { d:'2026-11-26', t:'Quinta · ✏️ Matemática e Química', itens:['Geografia: Japão e Antártida','Revisão História'] },
  { d:'2026-11-27', t:'Sexta · ✏️ Geografia e História', itens:['Folga merecida 😎'] },
  { d:'2026-11-28', t:'Sábado', itens:['Arte: ciberarte, bioarte, história da arte'] },
  { d:'2026-11-29', t:'Domingo', itens:['Música: figuras, compassos, repetição, claves (p.174-179)'] },
  { d:'2026-11-30', t:'Segunda', itens:['Revisão Arte','Revisão Música'] },
  { d:'2026-12-01', t:'Terça · ✏️ Arte e Música', itens:['🏁 Acabou! Agora é esperar as notas'] },
];

// ---------------- RECOMPENSAS ----------------
const PRAZO_GTA = new Date('2026-11-19T22:00:00-03:00');
const META_MATS = ['portugues','ingles','fisica','biologia'];
const HORAS = { bronze:5, prata:9, ouro:14 };
const P2_MATS = MATERIAS.map(m => m.id);

// ---------------- ESTADO ----------------
const S = { user:null, perfil:null, aba:'hoje', prog:{}, tent:[], lib:{}, notas:{}, gta:[], quiz:null, prova:null, aberta:null, materia:null };
const $app = document.getElementById('app');
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hojeISO = () => new Date().toLocaleDateString('sv-SE', { timeZone:'America/Sao_Paulo' });
const fmtData = iso => new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'2-digit' });
const ehResp = () => S.perfil?.papel === 'responsavel';
const chT = (m, i) => `${m}:${i}`;
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.append(t); setTimeout(()=>t.remove(),2600); }

// ---------------- DADOS ----------------
async function carregar(){
  const [p, t, l, n, g] = await Promise.all([
    sb.from('progresso').select('*'),
    sb.from('tentativas').select('id,materia,tipo,acertos,total,pct,criado').order('criado', { ascending:false }),
    sb.from('liberacoes').select('*'),
    sb.from('notas_p2').select('*'),
    sb.from('uso_gta').select('*').order('dia'),
  ]);
  S.prog = Object.fromEntries((p.data||[]).map(r => [r.chave, r]));
  S.tent = t.data || [];
  S.lib = Object.fromEntries((l.data||[]).map(r => [r.materia, r]));
  S.notas = Object.fromEntries((n.data||[]).map(r => [r.materia, r.nota]));
  S.gta = g.data || [];
}

async function salvar(chave, campos){
  const atual = S.prog[chave] || { chave };
  const novo = { ...atual, ...campos, chave, atualizado:new Date().toISOString() };
  if ('estudou' in campos || 'exercicios' in campos){
    const ok = novo.estudou && novo.exercicios;
    novo.concluido_em = ok ? (atual.concluido_em || new Date().toISOString()) : null;
  }
  S.prog[chave] = novo;
  const { error } = await sb.from('progresso').upsert(novo);
  if (error) toast('Erro ao salvar: ' + error.message);
}

// ---------------- CÁLCULOS ----------------
function progMat(mid){
  const m = MAT[mid]; let ok = 0;
  m.topicos.forEach((_, i) => { const p = S.prog[chT(mid,i)]; if (p?.estudou && p?.exercicios) ok++; });
  return { ok, total:m.topicos.length };
}
function melhor(mid, tipo, ateData){
  return S.tent.filter(t => t.materia===mid && t.tipo===tipo && (!ateData || new Date(t.criado) <= ateData) && (tipo!=='treino' || t.total>=5))
    .reduce((mx, t) => Math.max(mx, Number(t.pct)), -1);
}
function calcGTA(){
  const bronzeDet = META_MATS.map(mid => {
    const m = MAT[mid];
    const ok = m.topicos.every((_, i) => { const p = S.prog[chT(mid,i)]; return p?.concluido_em && new Date(p.concluido_em) <= PRAZO_GTA; });
    return { mid, ok };
  });
  const bronze = bronzeDet.every(x => x.ok);
  const prataDet = META_MATS.map(mid => ({ mid, v:melhor(mid,'treino',PRAZO_GTA) }));
  const prata = bronze && prataDet.every(x => x.v >= 70);
  const ouroDet = META_MATS.map(mid => ({ mid, v:melhor(mid,'prova',PRAZO_GTA) }));
  const ouro = prata && ouroDet.filter(x => x.v >= 80).length >= 3;
  const horas = ouro ? HORAS.ouro : prata ? HORAS.prata : bronze ? HORAS.bronze : 0;
  const usadas = S.gta.reduce((s, r) => s + Number(r.horas), 0);
  return { bronze, prata, ouro, bronzeDet, prataDet, ouroDet, horas, usadas, saldo:horas - usadas };
}
function calcDinheiro(){
  const linhas = P2_MATS.map(mid => { const n = S.notas[mid]; const v = (n != null && n >= 8) ? 7 : 0; return { mid, n, v }; });
  const todas = linhas.every(l => l.n != null);
  const bonus = todas && linhas.every(l => l.n >= 7) ? 9 : 0;
  return { linhas, bonus, total:linhas.reduce((s,l) => s + l.v, 0) + bonus, todas };
}

// ---------------- TELAS ----------------
const COR = { portugues:'#e5484d', ingles:'#3b82f6', fisica:'#6d4aff', biologia:'#1fa971', redacao:'#f59e0b', espanhol:'#f97316', matematica:'#0ea5e9', quimica:'#14b8a6', geografia:'#84cc16', historia:'#a16207', arte:'#ec4899', musica:'#8b5cf6' };
const DOM = [['😵','Não sei nada'],['😕','Sei pouco'],['😐','Mais ou menos'],['🙂','Sei bem'],['😎','Explico pra alguém']];

function render(){
  if (!S.user) return telaLogin();
  const abas = [['hoje','🏠','Hoje'],['materias','📚','Matérias'],['premios','🎮','Prêmios']];
  if (ehResp()) abas.push(['painel','🛡️','Painel']);
  let corpo = '';
  if (S.prova) corpo = telaProva();
  else if (S.quiz) corpo = telaQuiz();
  else if (S.aba === 'materias' && S.materia) corpo = telaMateria(S.materia);
  else corpo = ({ hoje:telaHoje, materias:telaMaterias, premios:telaPremios, painel:telaPainel })[S.aba]();
  const foco = S.quiz || S.prova;
  $app.innerHTML = `
    <header><h1>📘 Estudos P2</h1>${foco ? '' : '<button class="sair" data-a="sair">sair</button>'}</header>
    <main>${corpo}</main>
    ${foco ? '' : `<nav>${abas.map(([id,ic,nm]) => `<button data-a="aba" data-v="${id}" class="${S.aba===id?'on':''}"><span>${ic}</span>${nm}</button>`).join('')}</nav>`}`;
}

function telaLogin(){
  $app.innerHTML = `<div id="login" class="card">
    <div class="big">📘</div><h2>Estudos P2</h2><p class="mut">Entre com seu e-mail e senha.</p>
    <input id="lemail" type="email" placeholder="e-mail" autocomplete="username"><br><br>
    <input id="lsenha" type="password" placeholder="senha" autocomplete="current-password"><br><br>
    <button class="btn" data-a="entrar">Entrar</button></div>`;
}

function proximaProva(){
  const hoje = hojeISO();
  const futuras = MATERIAS.filter(m => m.prova >= hoje).sort((a,b) => a.prova.localeCompare(b.prova));
  if (!futuras.length) return null;
  const d = futuras[0].prova;
  const dias = Math.round((new Date(d+'T12:00:00') - new Date(hoje+'T12:00:00')) / 864e5);
  return { d, dias, mats:futuras.filter(m => m.prova===d) };
}

function blocoDia(dia){
  const hoje = hojeISO();
  const cls = dia.d===hoje ? 'hoje' : dia.d < hoje ? 'passado' : '';
  return `<div class="dia ${cls}"><div class="row sp"><b>${h(dia.t)}</b><span class="tag ${dia.d===hoje?'hoje':''}">${dia.d===hoje?'HOJE':fmtData(dia.d)}</span></div>
    ${dia.itens.map((it, i) => { const k=`crono:${dia.d}:${i}`; return `<label class="ck"><input type="checkbox" data-a="crono" data-k="${k}" ${S.prog[k]?.feito?'checked':''}> ${h(it)}</label>`; }).join('')}</div>`;
}

function oQueFalta(g){
  const itens = [];
  if (!g.bronze) g.bronzeDet.forEach(x => { if (!x.ok){ const p = progMat(x.mid); itens.push([x.mid, `Marcar estudo + exercícios: ${p.ok}/${p.total} tópicos`]); } });
  else if (!g.prata) g.prataDet.forEach(x => { if (x.v < 70) itens.push([x.mid, `Treino com 70%+ (melhor: ${x.v>=0?x.v+'%':'nenhum'})`]); });
  else if (!g.ouro) g.ouroDet.forEach(x => { if (x.v < 80) itens.push([x.mid, `Prova valendo com 80%+ (precisa em 3 das 4)`]); });
  return itens;
}

function telaHoje(){
  const hoje = hojeISO(); const pp = proximaProva(); const g = calcGTA();
  const diaHoje = CRONO.find(d => d.d===hoje) || CRONO.find(d => d.d > hoje);
  const faltaGta = PRAZO_GTA - new Date();
  let gta = '';
  if (faltaGta > 0){
    const hh = Math.floor(faltaGta/36e5), mm = Math.floor(faltaGta%36e5/6e4);
    gta = `<div class="card hero"><div class="row sp"><h2 style="margin:0">🎮 Missão GTA</h2><span class="mut">faltam ${hh}h${String(mm).padStart(2,'0')}</span></div>
      <div class="trilha"><div class="${g.bronze?'on':''}"><span>🥉</span>5h</div><div class="${g.prata?'on':''}"><span>🥈</span>9h</div><div class="${g.ouro?'on':''}"><span>🥇</span>14h</div></div>
      <div class="mut" style="margin-bottom:4px">${g.ouro ? 'Você bateu o OURO! 14h garantidas 🔥' : 'Pra subir de nível, falta:'}</div>
      ${oQueFalta(g).map(([mid, t]) => `<div class="falta" data-a="mat" data-v="${mid}"><span>${MAT[mid].emoji} <b>${h(MAT[mid].nome)}</b><br><small>${h(t)}</small></span><span>›</span></div>`).join('')}</div>`;
  }
  return `<p class="hello">E aí, ${h(S.perfil?.nome || '')}! 👋</p>

async function liberarProva(mid){
  const min = 30;
  if (ehResp()){
    await gravarLiberacao(sb, mid, min);
    return;
  }
  const html = `<div class="modal" id="mlib"><div class="card"><h2>🔐 Liberar prova de ${h(MAT[mid].nome)}</h2>
    <p class="mut">Pai ou mãe: entre com o seu login. Tempo de prova: ${min} minutos.</p>
    <input id="remail" type="email" placeholder="e-mail do responsável"><br><br><input id="rsenha" type="password" placeholder="senha"><br><br>
    <div class="row"><button class="btn sec" id="rcanc">Cancelar</button><button class="btn" id="rok" style="flex:1">Liberar</button></div></div></div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  const fechar = () => document.getElementById('mlib')?.remove();
  document.getElementById('rcanc').onclick = fechar;
  document.getElementById('rok').onclick = async () => {
    const tmp = createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:false, autoRefreshToken:false, storageKey:'tmp-resp' } });
    const { data, error } = await tmp.auth.signInWithPassword({ email:document.getElementById('remail').value.trim(), password:document.getElementById('rsenha').value });
    if (error){ toast('Login inválido'); return; }
    const { data: pf } = await tmp.from('perfis').select('papel').eq('user_id', data.user.id).maybeSingle();
    if (pf?.papel !== 'responsavel'){ toast('Esse login não é de responsável 😏'); await tmp.auth.signOut(); return; }
    await gravarLiberacao(tmp, mid, min, data.user.id);
    await tmp.auth.signOut();
    fechar();
  };
}
async function gravarLiberacao(cli, mid, min, uid){
  const ate = new Date(Date.now() + min*6e4).toISOString();
  const { error } = await cli.from('liberacoes').upsert({ materia:mid, ate, liberada_por: uid || S.user.id });
  if (error){ toast('Erro: ' + error.message); return; }
  S.lib[mid] = { materia:mid, ate };
  toast('Prova liberada por ' + min + ' minutos');
  render();
}

async function iniciarProva(mid){
  const { data, error } = await sb.from('questoes').select('id,enunciado,alternativas,topico').eq('materia', mid).eq('tipo','prova');
  if (error || !data?.length){ toast('Ainda não há questões de prova para essa matéria'); return; }
  S.prova = { materia:mid, ate:S.lib[mid].ate, lista:data.sort(() => Math.random()-.5), resp:{} };
  render();
}

async function treinar(mid){
  const { data: qs, error } = await sb.from('questoes').select('id,enunciado,alternativas,topico').eq('materia', mid).eq('tipo','treino');
  if (error || !qs?.length){ toast('Ainda sem questões de treino — cobra o pai pelas fotos 😅'); return; }
  const { data: gb } = await sb.from('gabarito').select('*').in('questao_id', qs.map(q => q.id));
  const G = Object.fromEntries((gb||[]).map(g => [g.questao_id, g]));
  const lista = qs.sort(() => Math.random()-.5).slice(0,10).map(q => ({ ...q, correta:G[q.id]?.correta, explicacao:G[q.id]?.explicacao }));
  S.quiz = { materia:mid, lista, i:0, acertos:0, resp:null };
  render();
}

function relatorio(){
  const linhas = MATERIAS.map(m => {
    const tops = m.topicos.map((t, i) => { const r = S.prog[chT(m.id,i)] || {};
      return `  - ${t}: ${r.estudou?'estudou':'não estudou'}, ${r.exercicios?'fez exercícios':'sem exercícios'}, domínio ${r.dominio||'?'}/5${r.duvida?`, dúvida: "${r.duvida}"`:''}`; }).join('\n');
    const tr = melhor(m.id,'treino'), pv = melhor(m.id,'prova');
    return `${m.nome} (prova ${m.prova}) — melhor treino: ${tr>=0?tr+'%':'—'} · prova valendo: ${pv>=0?pv+'%':'—'}\n${tops}`;
  }).join('\n\n');
  const red = S.prog['redacao:texto']?.duvida;
  return `RELATÓRIO DE ESTUDOS — ${new Date().toLocaleString('pt-BR')}\n\n${linhas}${red ? `\n\nREDAÇÃO PARA CORRIGIR:\n${red}` : ''}`;
}

$app.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  if (a === 'entrar'){
    const { error } = await sb.auth.signInWithPassword({ email:document.getElementById('lemail').value.trim(), password:document.getElementById('lsenha').value });
    if (error) toast('E-mail ou senha errados'); return;
  }
  if (a === 'sair'){ await sb.auth.signOut(); return; }
  if (a === 'aba'){ S.aba = v; S.materia = null; render(); window.scrollTo(0,0); return; }
  if (a === 'abrir'){ S.aberta = S.aberta === v ? null : v; render(); return; }
  if (a === 'dom'){ await salvar(el.dataset.k, { dominio:Number(v) }); render(); return; }
  if (a === 'treinar'){ await treinar(v); return; }
  if (a === 'mat'){ S.aba = 'materias'; S.materia = v; render(); window.scrollTo(0,0); return; }
  if (a === 'voltarMats'){ S.materia = null; render(); return; }
  if (a === 'tg'){ const k = el.dataset.k, f = el.dataset.f; await salvar(k, { [f]: !(S.prog[k]?.[f]) }); render(); return; }
  if (a === 'resp'){ const q = S.quiz; q.resp = Number(v); if (q.resp === q.lista[q.i].correta) q.acertos++; render(); return; }
  if (a === 'proxima'){
    const q = S.quiz; q.i++; q.resp = null;
    if (q.i >= q.lista.length){
      const pct = Math.round(1000*q.acertos/q.lista.length)/10;
      const { data } = await sb.from('tentativas').insert({ materia:q.materia, tipo:'treino', acertos:q.acertos, total:q.lista.length, pct }).select().single();
      if (data) S.tent.unshift(data);
    }
    render(); window.scrollTo(0,0); return;
  }
  if (a === 'fecharQuiz'){ S.quiz = null; render(); return; }
  if (a === 'liberar'){ await liberarProva(v); return; }
  if (a === 'iniciarProva'){ await iniciarProva(v); return; }
  if (a === 'marcar'){ S.prova.resp[el.dataset.q] = Number(v); render(); return; }
  if (a === 'enviarProva'){
    const p = S.prova;
    if (!p.auto && Object.keys(p.resp).length < p.lista.length && !confirmarEnvio()) return;
    const { data, error } = await sb.rpc('corrigir_prova', { p_materia:p.materia, p_respostas:p.resp });
    if (error){ toast(error.message); return; }
    p.resultado = data; await carregar(); render(); window.scrollTo(0,0); return;
  }
  if (a === 'fecharProva'){ S.prova = null; render(); return; }
  if (a === 'relatorio'){ try { await navigator.clipboard.writeText(relatorio()); toast('Relatório copiado! Cola na conversa com o Claude.'); } catch { toast('Não consegui copiar'); } return; }
  if (a === 'regGta'){
    const horas = Number(document.getElementById('ghoras').value); const dia = document.getElementById('gdia').value;
    if (!horas || !dia) return;
    const { data, error } = await sb.from('uso_gta').insert({ dia, horas }).select().single();
    if (error){ toast(error.message); return; } S.gta.push(data); render(); return;
  }
  if (a === 'delGta'){ await sb.from('uso_gta').delete().eq('id', v); S.gta = S.gta.filter(r => String(r.id) !== v); render(); return; }
  if (a === 'importar'){ await importar(document.getElementById('imp').value); document.getElementById('imp').value = ''; return; }
});

    const n = el.value === '' ? null : Number(el.value);
    const { error } = n == null ? await sb.from('notas_p2').delete().eq('materia', el.dataset.v) : await sb.from('notas_p2').upsert({ materia:el.dataset.v, nota:n });
    if (error) toast(error.message); else { S.notas[el.dataset.v] = n; toast('Nota salva'); }
  }
});

async function importar(txt){
  let arr; try { arr = JSON.parse(txt); } catch { toast('Arquivo inválido — baixe de novo do Claude'); return; }
  const qs = arr.map(q => ({ id:q.id, materia:q.materia, topico:q.topico || null, tipo:q.tipo, enunciado:q.enunciado, alternativas:q.alternativas }));
  const gb = arr.map(q => ({ questao_id:q.id, correta:q.correta, explicacao:q.explicacao || null }));
  const r1 = await sb.from('questoes').upsert(qs); if (r1.error){ toast(r1.error.message); return; }
  const r2 = await sb.from('gabarito').upsert(gb); if (r2.error){ toast(r2.error.message); return; }
  const t = arr.filter(q => q.tipo==='treino').length;
  toast(`✅ ${arr.length} questões importadas (${t} treino · ${arr.length-t} prova)`);
}
function confirmarEnvio(){ return window.confirm('Tem questão sem resposta. Enviar mesmo assim?'); }

// Relógio da prova
setInterval(() => {
  if (!S.prova || S.prova.resultado) return;
  const r = document.getElementById('relogio'); if (!r) return;
  const falta = Math.max(0, new Date(S.prova.ate) - new Date());
  r.textContent = `${Math.floor(falta/6e4)}:${String(Math.floor(falta%6e4/1e3)).padStart(2,'0')}`;
  if (falta === 0 && !S.prova.auto){ S.prova.auto = true; document.querySelector('[data-a="enviarProva"]')?.click(); }
}, 1000);

// ---------------- INÍCIO ----------------
async function iniciarSessao(session){
  S.user = session?.user || null;
  if (!S.user){ S.perfil = null; render(); return; }
  const { data } = await sb.from('perfis').select('*').eq('user_id', S.user.id).maybeSingle();
  if (!data){ $app.innerHTML = `<div id="login" class="card"><h2>Quase lá</h2><p class="mut">Seu login funciona, mas ainda não foi cadastrado no app. Fala com o pai.</p><button class="btn sec" data-a="sair">Sair</button></div>`; return; }
  S.perfil = data;
  await carregar();
  render();
}
sb.auth.onAuthStateChange((_ev, session) => {
  const novo = session?.user?.id || null;
  if (novo === (S.user?.id || null) && S.perfil !== undefined && _ev !== 'INITIAL_SESSION') return;
  setTimeout(() => iniciarSessao(session), 0);
});
</script>
