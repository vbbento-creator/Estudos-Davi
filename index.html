.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}

.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mh{text-align:center;font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);font-weight:700;margin-top:10px}

.navw{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}

.lista{display:flex;flex-direction:column}

.aviso{background:var(--warnbg);color:var(--warn-ink);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:700}

function calcDinheiro(){

  const linhas = S.mats.map(m => { const n = S.notas[m.id]; return { mid:m.id, n, v:(n != null && n >= c.nota_min) ? Number(c.por_materia) || 0 : 0 }; });

  const bonus = todas && linhas.every(l => l.n >= c.bonus_min) ? Number(c.bonus) || 0 : 0;

function proximaProva(){

  const futuras = S.mats.filter(m => m.prova && m.prova >= hoje).sort((a,b) => a.prova.localeCompare(b.prova));
  if (!futuras.length) return null;
  const d = futuras[0].prova;
  const dias = Math.round((new Date(d+'T12:00:00') - new Date(hoje+'T12:00:00')) / 864e5);
  return { d, dias, mats:futuras.filter(m => m.prova===d) };
}

function acoesAg(r, w){
  if (!ehResp()) return '';
  const k = `data-t="${r.tarefa}" data-d="${r.dia}" data-al="${w}" data-p="${r.periodo}"`;
  if (r.status === 'feito' && !r.decisao) return `<button class="btn bad min" data-a="tDecidir" data-s="rejeitado" ${k}>Rejeitar</button><button class="btn warn min" data-a="tMetade" data-k="ag|${r.tarefa}|${r.dia}|${w}|${r.periodo}">½ Metade</button><button class="btn ok min" data-a="tDecidir" data-s="validado" ${k}>Validar</button>`;
  if (!r.decisao && r.dia <= hojeISO() && r.status !== 'feito') return `<button class="btn sec min" data-a="tMarcar" data-s="feito" ${k}>Marcar como feita</button>`;
  return '';
}
// a criança marca na Agenda só hoje e ontem, e só período que já abriu
function botaoAg(r){
  const hoje = hojeISO();
  if (ehResp() || r.decisao || !(r.dia === hoje || r.dia === addDias(hoje, -1)) || !['a_fazer', 'feito'].includes(r.status) || travadoHoje(r)) return '';
  return `data-a="tMarcar" data-s="${r.status === 'a_fazer' ? 'feito' : ''}" data-t="${r.tarefa}" data-d="${r.dia}" data-p="${r.periodo}"`;
}
const metadeAg = (r, w) => painelMetade(`ag|${r.tarefa}|${r.dia}|${w}|${r.periodo}`, `data-a="tDecidir" data-s="metade" data-t="${r.tarefa}" data-d="${r.dia}" data-al="${w}" data-p="${r.periodo}"`, true);
// uma linha por tarefa na Agenda (g = grupo de porTarefa, ou uma linha); Trocar e Remover valem para o dia inteiro
function linhaAgenda(g, w){
  if (!g.itens) g = { tarefa:g.tarefa, nome:g.nome, emoji:g.emoji, pontos:g.pontos, itens:[g] };
  const dia = g.itens[0].dia;
  const k = `data-t="${g.tarefa}" data-d="${dia}" data-al="${w}"`;
  let geral = '';
  if (ehResp()){
    if (!g.itens.some(r => r.decisao || r.status === 'feito')) geral += `<button class="btn ghost min" data-a="tTrocar" ${k}>Trocar</button>`;
    if (ehAvulsa(g.tarefa) && !jaMarcada(g.tarefa)) geral += `<button class="btn ghost min" data-a="avRemover" data-v="${g.tarefa}">Remover</button>`;
  }
  const troca = painelTroca({ tarefa:g.tarefa, dia }, w);
  if (g.itens.length === 1){
    const r = g.itens[0]; const { st, mark, sub } = estadoAg(r); const btn = botaoAg(r);
    const per = r.periodo && r.periodo !== 'dia' ? `${nomeP(r.periodo)} · ` : '';
    const acoes = acoesAg(r, w) + geral;
    return `<div class="task ${st}"><button class="chk" ${btn || 'disabled'} aria-label="${h(g.nome)}">${mark}</button>
    <div class="tx"><b>${g.emoji} ${h(g.nome)}${tagAvulsa(g.tarefa)}</b><small>${per}${sub}</small></div>${ptsTag(g.pontos)}${acoes ? `<div class="acoes">${acoes}</div>` : ''}${metadeAg(r, w)}${troca}</div>`;
  }
  const blocos = g.itens.map(r => { const { st, mark, sub } = estadoAg(r); const btn = botaoAg(r); const ac = acoesAg(r, w);
    return `<div class="row" style="flex-basis:100%;gap:8px"><button class="per ${st}" ${btn || 'disabled'} aria-label="${h(g.nome)}, ${PERIODO[r.periodo]}">${nomeP(r.periodo)}${mark ? ' ' + mark : ''}</button><small class="mut grow">${sub}</small>${ac ? `<div class="acoes" style="flex-basis:auto">${ac}</div>` : ''}${metadeAg(r, w)}</div>`; }).join('');
  return `<div class="task ${g.itens.every(r => r.decisao === 'validado') ? 'ok' : ''}"><div class="tx"><b>${g.emoji} ${h(g.nome)}${tagAvulsa(g.tarefa)}</b></div>${ptsTag(g.pontos)}<small class="mut">cada</small>
    ${blocos}${geral ? `<div class="acoes">${geral}</div>` : ''}${troca}</div>`;
}
// pai ou mãe trocam quem faz a tarefa (só para quem ainda não faz naquele dia)
function painelTroca(r, w){
  if (!ehResp() || S.trocaAberta !== `${r.tarefa}|${r.dia}|${w}`) return '';
  const livres = S.alunos.filter(a => a.user_id !== w && !agendaItens(a.user_id, r.dia).some(x => x.tarefa === r.tarefa));
  if (!livres.length) return `<div class="mut" style="flex-basis:100%">Todas as crianças já fazem essa tarefa nesse dia. <button class="btn ghost min" data-a="tTrocar" data-t="" data-d="" data-al="">Fechar</button></div>`;
  const k = `data-t="${r.tarefa}" data-d="${r.dia}" data-al="${w}"`; const av = ehAvulsa(r.tarefa);
  return `<div style="flex-basis:100%;margin-top:8px"><div class="row"><span class="mut">No lugar de ${h(nomeAluno(w))}:</span><select id="trc-para" style="flex:1">${livres.map(a => `<option value="${a.user_id}">${h(a.nome)}</option>`).join('')}</select></div>
    <div class="row" style="margin-top:8px"><button class="btn sec min" data-a="tTrocaOk" data-e="0" ${k}>Só este dia</button>${av ? '' : `<button class="btn min" data-a="tTrocaOk" data-e="1" ${k}>Deste dia em diante</button>`}<button class="btn ghost min" data-a="tTrocar" data-t="" data-d="" data-al="">Cancelar</button></div>
    ${av ? '' : `<p class="mut" style="margin:6px 0 0">${S.tarefasCad.find(t => t.id === r.tarefa)?.modo === 'revezamento' ? 'Deste dia em diante: o revezamento recomeça por quem você escolher.' : 'Deste dia em diante: a criança escolhida faz no lugar, todos os dias.'}</p>`}</div>`;
}
function linhaCronoAg(w, d, i, texto){
  if (!ehResp()) return linhaCrono(d, i, texto);
  const f = !!S.fam.progCrono[w]?.[`crono:${d}:${i}`];
  return `<div class="task ${f ? 'ok' : ''}"><button class="chk" disabled aria-label="${h(texto)}">${f ? '✓' : ''}</button><div class="tx"><b>${h(texto)}</b><small>Plano de estudo</small></div></div>`;
}
function telaAgenda(){
  const hoje = hojeISO(); const sel = S.agSel || hoje;
  const ws = ehResp() ? (S.agFiltro === 'todos' ? S.alunos.map(a => a.user_id) : [S.agFiltro]) : [S.aluno];
  const filtros = ehResp() ? `<div class="seg"><button data-a="agFiltro" data-v="todos" aria-pressed="${S.agFiltro === 'todos'}">Todos</button>${S.alunos.map(a => `<button data-a="agFiltro" data-v="${a.user_id}" aria-pressed="${S.agFiltro === a.user_id}">${h(a.nome)}</button>`).join('')}</div>` : '';
  const toggle = `<div class="seg">${[['semana', 'Semana'], ['mes', 'Mês']].map(([v, n]) => `<button data-a="agView" data-v="${v}" aria-pressed="${S.agView === v}">${n}</button>`).join('')}</div>`;
  const cel = (d, mes) => `<button class="dbtn ${d === hoje ? 'hoje' : ''} ${d === sel ? 'sel' : ''} ${d < hoje ? 'pas' : ''}" data-a="agSel" data-v="${d}" aria-label="${diaCurto(d)}">${mes ? '' : `<small>${DOWL[dow(d)]}</small>`}<span class="n">${Number(d.slice(8))}</span>${pontosDia(d, ws)}</button>`;
  let grade;
  if (S.agView === 'semana'){
    const ini = S.agIni || hoje;
    grade = `<div class="navw"><button data-a="agIni" data-v="-7" ${ini <= addDias(hoje, -7) ? 'disabled' : ''} aria-label="Semana anterior">‹</button><b>${fmtData(ini).replace(/^[^,]*, /, '')} a ${fmtData(addDias(ini, 6)).replace(/^[^,]*, /, '')}</b><button data-a="agIni" data-v="7" ${ini >= addDias(hoje, 21) ? 'disabled' : ''} aria-label="Próxima semana">›</button></div>
      <div class="week">${Array.from({ length:7 }, (_, i) => cel(addDias(ini, i), false)).join('')}</div>`;
  } else {
    const ini = addDias(hoje, -dow(hoje));
    grade = `<div class="month" style="margin-bottom:4px">${DOWH.map(x => `<div class="mh">${x}</div>`).join('')}</div><div class="month">${Array.from({ length:28 }, (_, i) => cel(addDias(ini, i), true)).join('')}</div>`;
  }
  const provasDia = (S.fam.provas || []).filter(p => ws.includes(p.aluno) && p.prova === sel);
  const pausa = S.pausas.find(p => sel >= p.inicio && sel <= p.fim);
  const meta = calcMeta();
  const fimMeta = meta && ws.includes(S.aluno) && meta.prazo.toLocaleDateString('sv-SE', { timeZone:'America/Sao_Paulo' }) === sel;
  const blocos = ws.map(w => { const T = agendaItens(w, sel); const C = (S.fam.crono[w] || []).find(c => c.d === sel); const PV = provasJanela(w, sel);
    return `${ws.length > 1 ? `<div class="pessoa">${av(w, true)} ${h(nomeAluno(w))}</div>` : ''}${porTarefa(T).map(g => linhaAgenda(g, w)).join('')}
      ${C ? `<h3>${h(C.t)}</h3>${C.itens.map((it, i) => linhaCronoAg(w, sel, i, it)).join('')}` : ''}
      ${PV.length ? `${C ? '' : '<h3>Plano de estudo</h3>'}${PV.map(linhaProvaPlano).join('')}` : ''}
      ${!T.length && !C && !PV.length ? '<div class="vazio">Nada marcado.</div>' : ''}`; }).join('');
  return `<div class="row sp">${toggle}${filtros}</div>
    <div class="card" style="padding:12px">${grade}<div class="legenda"><span><i class="dot prova"></i>prova</span><span><i class="dot casa"></i>tarefa de casa</span><span><i class="dot estudo"></i>estudo</span><span><i class="dot meta"></i>fim da missão</span></div></div>
    <div class="card"><div class="row sp"><h2 style="margin:0">${diaCurto(sel)}</h2>${sel === hoje ? '<span class="chip ok">hoje</span>' : ''}</div>
      ${pausa ? `<div class="aviso" style="margin-top:8px">⏸️ Dia pausado${pausa.motivo ? ' (' + h(pausa.motivo) + ')' : ''}: nada é cobrado.</div>` : ''}
      ${provasDia.map(p => `<div class="row" style="margin-top:8px"><span class="chip prova">Prova</span><b>${p.emoji} ${h(p.nome)}</b>${ehResp() ? av(p.aluno, true) : ''}</div>`).join('')}
      ${fimMeta ? '<div class="row" style="margin-top:8px"><span class="chip meta">Fim da missão</span><b>Prazo do bronze, prata e ouro</b></div>' : ''}
      ${blocos}
      ${ehResp() ? blocoAvulsa(sel) : ''}
      ${!ehResp() && sel > hoje ? '<p class="mut" style="margin:8px 0 0">Tarefas de casa: você marca só hoje e ontem.</p>' : ''}</div>`;
}

function telaMaterias(){
  const hoje = hojeISO();
  const lista = [...S.mats].sort((a,b) => (a.prova||'9').localeCompare(b.prova||'9'));
  if (!lista.length) return '<div class="card"><p class="mut">Nenhuma matéria cadastrada ainda.</p></div>';
  return `<p class="hello">Toque numa matéria pra estudar, treinar ou fazer a prova.</p><div class="grid">${lista.map(m => {
    const p = progMat(m.id); const tr = melhor(m.id,'treino'); const pv = melhor(m.id,'prova');
    return `<div class="mcard" style="--c:${h(m.cor)}" data-a="mat" data-v="${m.id}">
      <div class="row sp"><span class="em">${m.emoji}</span>${m.prova ? `<span class="tag ${m.prova===hoje?'hoje':''}">${m.prova<hoje?'✔ foi':fmtData(m.prova)}</span>` : ''}</div>
      <b>${h(m.nome)}</b>
      <div class="bar"><i style="width:${p.total ? 100*p.ok/p.total : 0}%;background:${h(m.cor)}"></i></div>
      <div class="mut" style="font-size:12px">${p.ok}/${p.total} tópicos ${tr>=0?'· 🎯 '+tr+'%':''} ${pv>=0?'· 🏛️ '+pv+'%':''}</div></div>`;
  }).join('')}</div>`;
}

  const topicos = m.topicos.map((t, n) => {
    const k = chT(mid, t.idx); const r = S.prog[k] || {};
    return `<div class="topico"><div class="tt">${n+1}. ${h(t.nome)}</div>
      <div class="pills"><button class="pill ${r.estudou?'on':''}" data-a="tg" data-k="${k}" data-f="estudou">📖 ${r.estudou?'Estudei ✓':'Estudei'}</button>
      <button class="pill ${r.exercicios?'on':''}" data-a="tg" data-k="${k}" data-f="exercicios">✏️ ${r.exercicios?'Fiz exercícios ✓':'Fiz exercícios'}</button></div>
      <div class="lbl">Quanto eu domino? ${r.dominio ? '· <b>'+DOM[r.dominio-1][1]+'</b>' : ''}</div>
      <div class="dom">${DOM.map(([e], n) => `<button data-a="dom" data-k="${k}" data-v="${n+1}" class="${r.dominio===n+1?'on':''}" title="${DOM[n][1]}">${e}</button>`).join('')}</div>
      <details ${r.duvida?'open':''}><summary>❓ Tenho uma dúvida</summary><textarea data-a="duv" data-k="${k}" placeholder="Escreva o que não entendeu">${h(r.duvida)}</textarea></details></div>`;
  }).join('');
  let extra = '';
  if (mid === 'redacao'){

      : e.st === 'andamento' && !ehResp() ? `<button class="btn ok" data-a="iniciarProva" data-v="${mid}">Continuar a prova</button><p class="mut">${txtProva(e)}</p>`
      : `<span class="tag ${['feita', 'liberada', 'andamento'].includes(e.st) ? 'ok' : ''}">${txtProva(e)}</span>`;
    acoes = `<div class="card"><h2>🎯 Treino livre</h2><p class="mut">10 questões sorteadas com gabarito comentado. Refaça quantas vezes quiser. ${tr>=0?'Melhor: <b>'+tr+'%</b>':''}</p>
      <button class="btn" data-a="treinar" data-v="${mid}">Me testa!</button></div>
      ${concluirCard(mid)}
      <div class="card"><h2>🏛️ Prova valendo</h2><p class="mut">Só com o pai ou a mãe do lado. É uma vez só: depois de começar, você tem 1 hora. Abre 2 dias antes da prova da escola, depois de um treino com 70%+. ${pv>=0?'Resultado: <b>'+pv+'%</b>':''}</p>${botaoProva}</div>`;

    <div class="big" style="margin-top:6px">${h(m.nome)}</div><div style="opacity:.9">${p.ok} de ${p.total} tópicos concluídos</div>

}

function telaQuiz(){
  const q = S.quiz; const it = q.lista[q.i];
  if (!it && q.modo === 'revisao'){
    const e = S.treinoEstado[q.materia]; const falta = e ? e.erradas.length + e.novas.length : null; const completo = e && falta === 0 && e.total >= e.minimo;
    const txt = ehResp() ? 'Teste do responsável: não fica registrado.' : falta == null ? '' : completo ? 'Treino concluído! Todas as questões estão certas.'
      : falta === 0 ? `Todas certas! Falta a matéria ter ${e.minimo} questões de treino para dar o bônus.` : `Faltam ${falta} questões para chegar a 100%.`;
    return `<div class="card" style="text-align:center"><div class="big">${completo ? '🏆' : q.acertos === q.lista.length ? '🔥' : '💪'}</div><h2>${q.acertos} de ${q.lista.length} nesta rodada</h2><p class="mut">${txt}</p>
      ${!ehResp() && falta > 0 ? `<button class="btn" data-a="concluirTreino" data-v="${q.materia}">Continuar (faltam ${falta})</button><br><br>` : ''}
      <button class="btn sec" data-a="fecharQuiz">Voltar pra matéria</button></div>`;
  }
  if (!it){
    const pct = Math.round(100*q.acertos/q.lista.length);
    return `<div class="card" style="text-align:center"><div class="big">${pct>=70?'🔥':'💪'}</div><h2>${q.acertos} de ${q.lista.length} · ${pct}%</h2>
      <p class="mut">${ehResp() ? 'Teste do responsável: não fica registrado.' : pct>=70 ? 'Mandou bem! Isso conta pra meta.' : 'Revisa os tópicos e tenta de novo.'}</p>
      <button class="btn" data-a="fecharQuiz">Voltar pra matéria</button></div>`;
  }
  return `<div class="card"><div class="row sp"><span class="tag">${MAT(q.materia).emoji} ${h(MAT(q.materia).nome)}</span><span class="tag">${q.i+1} de ${q.lista.length}</span></div>
    <div class="bar" style="margin:12px 0"><i style="width:${100*q.i/q.lista.length}%;background:var(--ac)"></i></div>
    ${it.topico ? `<div class="mut">${h(it.topico)}</div>` : ''}
    <p class="enun">${h(it.enunciado)}</p>
    ${it.alternativas.map((a, i) => {
      let c = ''; if (q.resp != null){ if (i===it.correta) c='certa'; else if (i===q.resp) c='errada'; }
      return `<button class="alt ${c}" data-a="resp" data-v="${i}" ${q.resp!=null?'disabled':''}><b>${'ABCDE'[i]})</b> ${h(a)}</button>`;
    }).join('')}
    ${q.resp != null ? `<p><b>${q.resp===it.correta?'✅ Acertou!':'❌ Errou.'}</b> ${h(it.explicacao||'')}</p><button class="btn" data-a="proxima" ${q.salvando?'disabled':''}>${q.i+1===q.lista.length?'Ver resultado':'Próxima →'}</button>` : ''}
    <br><button class="voltar" data-a="fecharQuiz">Sair do treino</button></div>`;
}

// ---------- Tarefas da casa ----------
function itemLoja(p){
  const saldo = S.saldoT;
  const l = S.limites[p.id]; const restante = l ? Math.max(0, l.limite - l.usado) : Infinity;
  const n = p.unidade ? Math.min(Math.max(1, S.qtdLoja[p.id] || 1), Math.max(1, restante === Infinity ? 99 : restante)) : 1;
  const custo = p.custo * n;
  const aguard = p.divide > 1 ? S.resgates.find(r => r.premio === p.id && r.status === 'aguardando') : null;
  const compartilha = p.limite_grupo ? S.premios.filter(x => x.ativo && x.id !== p.id && x.limite_grupo === p.limite_grupo).map(x => x.nome) : [];
  let limTxt = '';
  if (l){
    const usadoTxt = p.tipo === 'tela' ? `${fmtMin(l.usado * p.unidade)} de ${fmtMin(l.limite * p.unidade)}` : p.tipo === 'dinheiro' ? `R$ ${l.usado * p.unidade} de R$ ${l.limite * p.unidade}` : `${l.usado} de ${l.limite}`;
    limTxt = `<small class="mut" style="display:block">${usadoTxt} ${p.limite_periodo === 'semana' ? 'nesta semana' : 'neste mês'}${compartilha.length ? ` (junto com ${h(compartilha.join(', '))})` : ''}</small>`;
  }
  const unidTxt = p.unidade ? (p.tipo === 'tela' ? fmtMin(p.unidade * n) : `R$ ${p.unidade * n}`) : '';
  const stepper = p.unidade && !aguard ? `<div class="step"><button data-a="step" data-v="${p.id}" data-d="-1" ${n <= 1 ? 'disabled' : ''} aria-label="Menos">−</button><output>${unidTxt}</output><button data-a="step" data-v="${p.id}" data-d="1" ${n >= Math.min(restante, 99) ? 'disabled' : ''} aria-label="Mais">+</button></div>` : '';

async function abrirAnalise(mid){
  S.anMat = mid; S.banco = null; render(); window.scrollTo(0,0);
  const { data: qs } = await sb.from('questoes').select('id,topico,tipo,enunciado,alternativas').eq('aluno', S.aluno).eq('materia', mid);
  const { data: gb } = await sb.from('gabarito').select('*').in('questao_id', (qs||[]).map(q => q.id));
  const G = Object.fromEntries((gb||[]).map(g => [g.questao_id, g]));
  S.banco = Object.fromEntries((qs||[]).map(q => [q.id, { ...q, correta:G[q.id]?.correta, explicacao:G[q.id]?.explicacao }]));
  render();
}
// detalhes da prova trazem o texto; os do treino, só {id, r, c}
const normDet = d => (d || []).map(x => ({ id:x.id, r:x.r ?? x.resposta ?? null, c:x.c ?? x.correta }));
function telaAnalise(){
  const mid = S.anMat; const m = MAT(mid); const B = S.banco;
  const T = S.tent.filter(t => t.materia === mid).sort((a, b) => a.criado.localeCompare(b.criado));
  const voltar = `<button class="voltar" data-a="fecharAnalise">‹ Painel</button>
    <select data-a="anMat" style="margin-bottom:8px">${S.mats.map(x => `<option value="${x.id}" ${x.id===mid?'selected':''}>${x.emoji} ${h(x.nome)}</option>`).join('')}</select>`;
  if (!B) return voltar + '<p class="mut">Carregando…</p>';
  // clique duplo: mesma matéria/resultado gravada com menos de 3 s de diferença
  const dup = new Set(); T.forEach((t, i) => { const a = T[i-1]; if (a && a.tipo === t.tipo && a.acertos === t.acertos && a.total === t.total && new Date(t.criado) - new Date(a.criado) < 3000) dup.add(t.id); });
  const validas = T.filter(t => !dup.has(t.id));
  const tr = validas.filter(t => t.tipo === 'treino'), pv = validas.filter(t => t.tipo === 'prova');
  const media = L => L.length ? Math.round(L.reduce((s, t) => s + Number(t.pct), 0) / L.length) + '%' : '—';
  // estatística por questão
  const Q = {};
  validas.forEach(t => normDet(t.detalhes).forEach(d => { const q = Q[d.id] ||= { vezes:0, acertos:0, tipo:t.tipo }; q.vezes++; if (d.r === d.c) q.acertos++; }));
  const ids = Object.keys(Q); const comDet = validas.filter(t => t.detalhes?.length).length;
  const bancoTreino = Object.values(B).filter(q => q.tipo === 'treino').length;
  const vistasTreino = ids.filter(id => B[id]?.tipo === 'treino').length;
  const repetidas = ids.filter(id => Q[id].vezes > 1);
  const respostas = ids.reduce((s, id) => s + Q[id].vezes, 0);
  const erradas = ids.filter(id => Q[id].acertos < Q[id].vezes).sort((a, b) => (Q[b].vezes - Q[b].acertos) - (Q[a].vezes - Q[a].acertos) || Q[a].acertos/Q[a].vezes - Q[b].acertos/Q[b].vezes);
  const sempreErra = erradas.filter(id => Q[id].acertos === 0 && Q[id].vezes > 1);
  const errouDepoisAcertou = ids.filter(id => Q[id].vezes > 1 && Q[id].acertos > 0 && Q[id].acertos < Q[id].vezes);
  // por tópico
  const top = {}; ids.forEach(id => { const k = B[id]?.topico || 'sem tópico'; const x = top[k] ||= { v:0, a:0 }; x.v += Q[id].vezes; x.a += Q[id].acertos; });
  const linhaQ = id => { const q = B[id]; const x = Q[id];
    return `<div class="nivel"><div style="flex:1"><b>${q ? h(q.enunciado.slice(0, 110)) + (q.enunciado.length > 110 ? '…' : '') : h(id) + ' (apagada)'}</b><div class="mut">${h(q?.topico || '')} · ${x.tipo === 'prova' ? 'prova' : 'treino'}</div></div>
      <span class="tag ${x.acertos === x.vezes ? 'ok' : x.acertos === 0 ? 'bad' : 'warn'}">${x.acertos}/${x.vezes}</span></div>`; };
  const detTent = t => { const D = normDet(t.detalhes);
    if (!D.length) return '<p class="mut">Sem detalhe por questão (teste feito antes desta versão).</p>';
    return D.map((d, n) => { const q = B[d.id]; const ok = d.r === d.c;
      return `<div class="topico"><b>${ok ? '✅' : '❌'} ${n+1}. ${q ? h(q.enunciado) : h(d.id) + ' (questão apagada)'}</b>
        ${q ? q.alternativas.map((a, i) => `<div class="alt ${i===d.c?'certa':i===d.r?'errada':''}" style="cursor:default"><b>${'ABCDE'[i]})</b> ${h(a)}${i===d.r?' ← marcou':''}</div>`).join('') : ''}
        ${d.r == null ? '<p class="mut">Não respondeu.</p>' : ''}${q?.explicacao ? `<p class="mut">💡 ${h(q.explicacao)}</p>` : ''}</div>`; }).join(''); };
  const quando = iso => new Date(iso).toLocaleString('pt-BR', { weekday:'short', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
  return `${voltar}
    <div class="mhead" style="--c:${h(m.cor)}"><span class="em">${m.emoji}</span><div class="big">${h(m.nome)}</div><div>Desempenho de ${h(nomeAluno(S.aluno))}</div></div>
    <div class="card"><h2>Resumo</h2><table>
      <tr><td>🎯 Treinos</td><td><b>${tr.length}</b></td><td>média ${media(tr)} · melhor ${tr.length ? Math.max(...tr.map(t => Number(t.pct))) + '%' : '—'}</td></tr>
      <tr><td>🏛️ Provas valendo</td><td><b>${pv.length}</b></td><td>${pv.map(t => t.pct + '%').join(', ') || '—'}</td></tr>
      <tr><td>📈 Evolução dos treinos</td><td colspan="2">${tr.map(t => t.pct + '%').join(' → ') || '—'}</td></tr>
      <tr><td>👀 Questões de treino vistas</td><td colspan="2"><b>${vistasTreino}</b> de ${bancoTreino}${bancoTreino && vistasTreino < bancoTreino ? ` · ${bancoTreino - vistasTreino} nunca apareceram` : ''}</td></tr>
      <tr><td>🔁 Repetidas</td><td colspan="2"><b>${repetidas.length}</b> questões apareceram mais de uma vez${respostas ? ` · ${respostas} respostas no total` : ''}</td></tr>
      <tr><td>❌ Sempre erra</td><td colspan="2"><b>${sempreErra.length}</b> (erradas toda vez, vistas 2+ vezes)</td></tr>
      <tr><td>🔀 Instáveis</td><td colspan="2"><b>${errouDepoisAcertou.length}</b> (ora acerta, ora erra: pode ser chute)</td></tr>
    </table>
    ${dup.size ? `<p class="mut">⚠️ ${dup.size} tentativa(s) gravada(s) em dobro por clique duplo foram ignoradas.</p>` : ''}
    ${comDet < validas.length ? `<p class="mut">${validas.length - comDet} tentativa(s) antigas não têm detalhe por questão; os números acima usam só as ${comDet} com detalhe.</p>` : ''}</div>
    ${Object.keys(top).length ? `<div class="card"><h2>Acerto por tópico</h2><table>${Object.entries(top).sort((a, b) => a[1].a/a[1].v - b[1].a/b[1].v).map(([k, x]) => `<tr><td>${h(k)}</td><td style="width:120px"><div class="bar"><i style="width:${100*x.a/x.v}%;background:${x.a/x.v >= .7 ? 'var(--ok)' : x.a/x.v >= .5 ? 'var(--warn)' : 'var(--bad)'}"></i></div></td><td style="text-align:right">${Math.round(100*x.a/x.v)}% <span class="mut">(${x.a}/${x.v})</span></td></tr>`).join('')}</table></div>` : ''}
    ${erradas.length ? `<div class="card"><h2>Questões que ele erra (${erradas.length})</h2><p class="mut">Acertos / vezes que apareceu. As piores primeiro.</p>${erradas.slice(0, 30).map(linhaQ).join('')}</div>` : ''}
    <div class="card"><h2>Todas as tentativas (${T.length})</h2>${[...T].reverse().map(t => `<details class="topico"><summary>${t.tipo === 'prova' ? '🏛️ Prova' : '🎯 Treino'} · ${quando(t.criado)} · <b>${t.acertos}/${t.total} (${t.pct}%)</b>${dup.has(t.id) ? ' · <span class="tag warn">duplicada</span>' : ''}</summary>${detTent(t)}</details>`).join('') || '<p class="mut">Nenhuma.</p>'}</div>`;
}

async function liberarProva(mid){
  if (estadoProva(mid).st !== 'pode'){ toast(txtProva(estadoProva(mid))); return; }
  if (ehResp()){ await gravarLiberacao(sb, mid); return; }
  const html = `<div class="modal" id="mlib"><div class="card"><h2>🔐 Liberar prova de ${h(MAT(mid).nome)}</h2>
    <p class="mut">Pai ou mãe: entre com o seu login. Fica liberada até ${diaHora(fimJanela(MAT(mid).prova).toISOString())}; depois de começar, são 1 hora.</p>
    <input id="remail" type="email" placeholder="e-mail do responsável"><br><br><input id="rsenha" type="password" placeholder="senha"><br><br>
    <div class="row"><button class="btn sec" id="rcanc">Cancelar</button><button class="btn" id="rok" style="flex:1">Liberar</button></div></div></div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  const fechar = () => document.getElementById('mlib')?.remove();
  document.getElementById('rcanc').onclick = fechar;
  document.getElementById('rok').onclick = async () => {
    const tmp = createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:false, autoRefreshToken:false, storageKey:'tmp-resp' } });
    const { data, error } = await tmp.auth.signInWithPassword({ email:document.getElementById('remail').value.trim(), password:document.getElementById('rsenha').value });
    if (error){ toast('Login inválido'); return; }
    const { data: pf } = await tmp.from('perfis').select('papel').eq('user_id', data.user.id).maybeSingle();
    if (pf?.papel !== 'responsavel'){ toast('Esse login não é de responsável 😏'); await tmp.auth.signOut(); return; }
    await gravarLiberacao(tmp, mid, data.user.id);
    await tmp.auth.signOut();
    fechar();
  };
}
async function gravarLiberacao(cli, mid, uid){
  const ate = fimJanela(MAT(mid).prova).toISOString();
  const { error } = await cli.from('liberacoes').upsert({ aluno:S.aluno, materia:mid, ate, iniciada_em:null, liberada_por: uid || S.user.id }, { onConflict:'aluno,materia' });
  if (error){ toast('Erro: ' + error.message); return; }
  S.lib[mid] = { materia:mid, ate, iniciada_em:null };
  toast('Prova liberada até ' + diaHora(ate));
  render();
}

const chProva = mid => `prova:${S.aluno}:${mid}`;
function guardaProva(){ const p = S.prova; if (!p || p.resultado) return;
  try { localStorage.setItem(chProva(p.materia), JSON.stringify({ ini:p.ini, ordem:p.lista.map(q => q.id), resp:p.resp })); } catch {} }
function lerProva(mid, ini){ try { const g = JSON.parse(localStorage.getItem(chProva(mid)) || 'null'); return g && g.ini === ini ? g : null; } catch { return null; } }
function apagaProva(mid){ try { localStorage.removeItem(chProva(mid)); } catch {} }
async function iniciarProva(mid){
  const retoma = !!S.lib[mid]?.iniciada_em;
  if (!retoma && !window.confirm(`Começar a prova de ${MAT(mid).nome}? Você terá 1 hora a partir de agora, e é uma vez só.`)) return;
  const { data: ate, error: e1 } = await sb.rpc('iniciar_prova', { p_materia:mid });
  if (erro(e1)) return;
  const { data: lib } = await sb.from('liberacoes').select('*').eq('aluno', S.aluno).eq('materia', mid).maybeSingle();
  S.lib[mid] = lib || { materia:mid, ate };
  const { data, error } = await sb.from('questoes').select('id,enunciado,alternativas,topico').eq('aluno', S.aluno).eq('materia', mid).eq('tipo','prova');
  if (error || !data?.length){ toast('Ainda não há questões de prova para essa matéria'); return; }
  const ini = S.lib[mid].iniciada_em; const g = lerProva(mid, ini);
  const pos = g ? Object.fromEntries(g.ordem.map((id, i) => [id, i])) : null;
  const lista = pos ? data.sort((a, b) => (pos[a.id] ?? 1e9) - (pos[b.id] ?? 1e9)) : data.sort(() => Math.random()-.5);
  S.prova = { materia:mid, ate:S.lib[mid].ate, ini, lista, resp:g?.resp || {} };
  guardaProva(); render(); window.scrollTo(0, 0);
}

async function treinar(mid){
  const { data: qs, error } = await sb.from('questoes').select('id,enunciado,alternativas,topico').eq('aluno', S.aluno).eq('materia', mid).eq('tipo','treino');
  if (error || !qs?.length){ toast('Ainda sem questões de treino — cobra o pai pelas fotos 😅'); return; }
  const { data: gb } = await sb.from('gabarito').select('*').in('questao_id', qs.map(q => q.id));
  const G = Object.fromEntries((gb||[]).map(g => [g.questao_id, g]));
  const lista = qs.sort(() => Math.random()-.5).slice(0,10).map(q => ({ ...q, correta:G[q.id]?.correta, explicacao:G[q.id]?.explicacao }));
  S.quiz = { materia:mid, lista, i:0, acertos:0, resp:null, det:[] };
  render();
}

function relatorio(){
  const linhas = S.mats.map(m => {
    const tops = m.topicos.map(t => { const r = S.prog[chT(m.id, t.idx)] || {};
      return `  - ${t.nome}: ${r.estudou?'estudou':'não estudou'}, ${r.exercicios?'fez exercícios':'sem exercícios'}, domínio ${r.dominio||'?'}/5${r.duvida?`, dúvida: "${r.duvida}"`:''}`; }).join('\n');
    const tr = melhor(m.id,'treino'), pv = melhor(m.id,'prova');
    return `${m.nome} [código ${m.id}]${m.prova ? ' (prova ' + m.prova + ')' : ''} — melhor treino: ${tr>=0?tr+'%':'—'} · prova valendo: ${pv>=0?pv+'%':'—'}\n${tops}`;

async function importar(txt){
  let arr; try { arr = JSON.parse(txt.replace(/^﻿/, '').trim()); } catch (e) { toast('Não consegui ler o arquivo: ' + e.message.slice(0,80)); return false; }
  if (!Array.isArray(arr)){ toast('Arquivo em formato inesperado'); return false; }
  const cods = new Set(S.todasMats.map(m => m.id));
  const sem = [...new Set(arr.map(q => q.materia).filter(m => !cods.has(m)))];
  if (sem.length){ toast(`Matéria não cadastrada para ${nomeAluno(S.aluno)}: ${sem.join(', ')}`); return false; }
  const ids = arr.map(q => q.id);
  const { data: existentes } = await sb.from('questoes').select('id,aluno').in('id', ids);
  const deOutro = (existentes || []).filter(q => q.aluno !== S.aluno).map(q => q.id);
  if (deOutro.length){ toast(`IDs já usados por outro aluno (${deOutro.slice(0,3).join(', ')}…). Peça IDs novos ao Claude.`); return false; }
  const qs = arr.map(q => ({ id:q.id, aluno:S.aluno, materia:q.materia, topico:q.topico || null, tipo:q.tipo, enunciado:q.enunciado, alternativas:q.alternativas }));
  const gb = arr.map(q => ({ questao_id:q.id, correta:q.correta, explicacao:q.explicacao || null }));
  const r1 = await sb.from('questoes').upsert(qs); if (r1.error){ toast('Erro: ' + r1.error.message); return false; }
  const r2 = await sb.from('gabarito').upsert(gb); if (r2.error){ toast('Erro: ' + r2.error.message); return false; }
  const t = arr.filter(q => q.tipo==='treino').length;
  toast(`✅ ${arr.length} questões importadas para ${nomeAluno(S.aluno)} (${t} treino · ${arr.length-t} prova)`);
  document.getElementById('imp').value = ''; document.getElementById('impf').value = '';
  return true;
}

async function iniciarSessao(session){
  S.user = session?.user || null; S.motiv = null;
  if (!S.user){ S.perfil = null; render(); return; }
  const { data: perfis } = await sb.from('perfis').select('*');
  const data = (perfis || []).find(p => p.user_id === S.user.id);
  if (!data){ $app.innerHTML = `<div id="login" class="card"><h2>Quase lá</h2><p class="mut">Seu login funciona, mas ainda não foi cadastrado no app. Fala com o pai.</p><button class="btn sec" data-a="sair">Sair</button></div>`; return; }
  S.perfil = data;
  S.alunos = (perfis || []).filter(p => p.papel === 'aluno').sort((a, b) => a.nome.localeCompare(b.nome));
  if (data.papel === 'aluno') S.aluno = data.user_id;
  else { let salvo = null; try { salvo = localStorage.getItem('aluno'); } catch {} S.aluno = S.alunos.some(a => a.user_id === salvo) ? salvo : S.alunos[0]?.user_id; }
  await carregar();
  motivarDia();
  render();
}

  const novo = session?.user?.id || null;
  if (novo === (S.user?.id || null) && S.perfil !== undefined && _ev !== 'INITIAL_SESSION') return;
  setTimeout(() => iniciarSessao(session), 0);
});
</script>
